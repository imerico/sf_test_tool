, "correct": [1], "explanation": "定期データエクスポートを使用すると、Salesforceのすべてのデータを週次または月次でエクスポートできます。この機能は、データバックアップや外部保管用のデータアーカイブに役立ちます。\n他の回答の解説：\n\na. データモデルビルダーはデータ構造を設計するツールで、バックアップ機能はありません。\nc. 自動レポートエクスポートはレポートデータのエクスポートに限定され、全データのバックアップには適していません。\nd. 一括データ送信はSalesforceの公式機能ではありません。", "category": "データ管理＆分析"}, {"question": "特定のチームメンバーが商談の詳細を閲覧できるが編集はできないように設定する必要があります。この要件を満たす方法はどれですか？", "choices": ["ページレイアウトでフィールドを読み取り専用にする", "権限セットでフィールドレベルセキュリティを設定する", "カスタムフィールドタイプを「読み取り専用」に設定する", "ビューとしてデータを出力する"], "correct": [0, 1], "explanation": "ページレイアウトでは、特定のユーザーがそのページレイアウトを使用する場合にフィールドを「読み取り専用」に設定できます。フィールドレベルセキュリティは、権限セットを使用してフィールドへの編集を制限できます。\n他の回答の解説：\n\nc. Salesforceには「読み取り専用」のフィールドタイプは存在しません。\nd. ビューはデータの表示形式であり、フィールドの編集権限には関与しません。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "顧客サポート部門の責任者が、Salesforce Knowledgeを使用して顧客がセルフサービスで問題を解決できるようにしたいと考えています。このナレッジ記事を公開する主な方法として最も適切な選択肢はどれですか？", "choices": ["Salesforce Mobileアプリを通じて公開する", "ナレッジタブで記事を共有する", "コミュニティで記事を公開する", "ダッシュボードを利用してナレッジ記事を可視化する"], "correct": [2], "explanation": "Salesforce Knowledgeの記事は、コミュニティで公開することで外部ユーザーや顧客がセルフサービスでアクセス可能になります。これにより、顧客は必要な情報を簡単に取得でき、サポートチームの負担も軽減されます。\n他の選択肢の解説：\n\na. Salesforce Mobileアプリは主にユーザー向けであり、顧客がナレッジ記事を直接参照する機能は提供していません。\nb. ナレッジタブは内部ユーザー向けの機能であり、外部顧客にはアクセスできません。\nd. ダッシュボードはデータの可視化ツールであり、記事の公開には適していません。", "category": "サービス＆サポートアプリケーション"}, {"question": "製薬会社のカスタマーサポートチームが、Service Cloudを利用してサポート業務を最適化したいと考えています。この目的を達成するために、Salesforceで行うべき設定として正しいものを1つ選んでください。", "choices": ["組織全体の共有設定を変更してService Cloudを有効化する", "ユーザーレコードにある「Service Cloudユーザー」オプションを有効にする", "Service Cloud専用のカスタムアプリケーションを作成する", "レコードタイプを作成してService Cloudを利用可能にする"], "correct": [1], "explanation": "Service Cloudを有効化するには、ユーザーレコードで「Service Cloudユーザー」チェックボックスを有効化する必要があります。これにより、そのユーザーにService Cloudライセンスが割り当てられます。\n他の選択肢の解説：\n\na. 組織全体の共有設定はレコードのアクセス権を管理するためのものであり、Service Cloudの有効化には直接関与しません。\nc. カスタムアプリケーションの作成は便利な方法ですが、Service Cloud自体の有効化には必要ありません。\nd. レコードタイプはデータ管理に役立ちますが、Service Cloudのライセンス有効化には関係ありません。", "category": "サービス＆サポートアプリケーション"}, {"question": "顧客サポート部門が、新規顧客の連絡先情報をSalesforceに登録する際、電話番号の形式がバラバラであることを問題視しました。この状況を改善し、一貫性を持たせるにはどの機能を使用するべきですか？", "choices": ["データ入力時にルールを適用する検証ルール（Validation Rule）", "保存後に自動でフォーマットを更新するフィールド更新（Field Update）", "選択肢を制限するための選択リストフィールド（Picklist Field）", "自動化フローを利用したデータ標準化（Flow）"], "correct": [0], "explanation": "検証ルールは、入力時に特定の条件を強制することでデータの一貫性を確保します。電話番号の形式を10桁や特定の記号で統一するなど、即座にエラーを通知して正しい形式を促します。\n他の回答の解説：\n\nb. フィールド更新はデータ保存後のアクションであり、入力時のフォーマット制御には使用できません。\nc. 選択リストは事前定義された値のみを入力できますが、電話番号のような自由形式データには適しません。\nd. フローで電話番号を標準化することも可能ですが、設定が複雑で管理者試験には向きません。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "国際プロジェクトのチームリーダーが、Salesforceで日付や通貨の表示形式が突然異なると報告しました。この問題を解決するために調整すべき設定は次のうちどれですか？", "choices": ["ユーザーごとのロケール設定（Locale）", "会社全体の営業時間設定（Business Hours）", "システム言語設定（Language）", "タイムゾーン設定（Time Zone）"], "correct": [0], "explanation": "ロケール設定は、日付や数値、通貨の表示形式を制御します。ユーザーが住む地域に合わせて設定を変更することで、この問題を解決できます。\n他の回答の解説：\n\nb. 営業時間設定は組織全体の営業時間を決定するもので、日付や通貨の形式には影響を与えません。\nc. 言語設定はSalesforceのインターフェイス表示に影響しますが、日付や通貨のフォーマットには関係ありません。\nd. タイムゾーン設定は時間の表示に関与しますが、日付や通貨の形式には影響を与えません。", "category": "設定とセットアップ"}, {"question": "ある企業では、特定の部署のみにアクセスを許可するルールを作成し、情報共有を効率化したいと考えています。この場合、共有ルールの「共有対象」として選択可能な項目は次のうちどれですか？", "choices": ["部署（ロール）", "サポートチーム", "プロジェクト担当者", "部署およびその下位部署", "特定ユーザーグループ"], "correct": [0, 3, 4], "explanation": "共有ルールでは、次の共有対象を指定できます。部署（ロール）：部署単位で共有範囲を設定します。部署およびその下位部署：指定した部署とその下位のすべての部署を含めた範囲で共有します。特定ユーザーグループ：管理者が定義したユーザーグループに対して共有します。\n他の回答の解説：\n\nb. サポートチームは共有ルールの対象として選択できません。\nc. プロジェクト担当者を直接指定することはできず、「手動共有」が必要です。", "category": "設定とセットアップ"}, {"question": "製品サポートチームが、お客様の契約が更新された際に自動的に新しいサポートチケットを生成し、それを契約情報に関連付けるプロセスを求めています。この要件を満たすSalesforceのツールはどれですか？", "choices": ["ケース割り当てルール", "ワークフロールール", "プロセスビルダー", "データインポートウィザード"], "correct": [2], "explanation": "プロセスビルダーは、条件に基づいて新しいレコードを作成し、他のオブジェクトに関連付けることができます。このツールは複雑な自動化要件に適しています。\n他の回答の解説：\n\na. ケース割り当てルールはケースの所有者管理に使用されますが、レコード作成機能はありません。\nb. ワークフロールールでは、新しいレコードを作成する機能はありません。\nd. データインポートウィザードはデータの一括インポートに使用されるツールであり、この要件には適しません。", "category": "自動化"}, {"question": "ある企業がカスタマーサポート向けの新しいポリシーを導入しました。その中で、特定のケースを迅速に他の部門の担当者と共有し、問題解決のスピードを向上させる仕組みが求められています。この要件を満たすために、Salesforceで最も適した設定方法はどれですか？", "choices": ["カスタムオブジェクトを作成してケース情報を手動で複製する", "共有ルールを設定して特定の条件でケースを共有する", "手動共有を活用して必要な担当者にアクセスを付与する", "レコードタイプを利用してケースを自動的に再割り当てする"], "correct": [2], "explanation": "手動共有を使用すると、個々のケースについて特定のユーザーやグループにアクセス権を付与できます。これにより、重要なケースを迅速に他の部門の担当者と共有し、適切な対応を可能にします。\n他の選択肢の解説：\n\na. カスタムオブジェクトの作成は非効率的であり、このシナリオには適していません。\nb. 共有ルールは条件に基づいてアクセスを自動付与しますが、迅速な手動対応には不向きです。\nd. レコードタイプはケース分類に役立ちますが、アクセス権管理には使用されません。", "category": "サービス＆サポートアプリケーション"}, {"question": "IT部門が、特定の商談データを基に関連オブジェクトの情報を組み合わせたカスタムレポートを作成したいと考えています。この要件を満たすために、最も適切な方法を1つ選んでください。", "choices": ["カスタムレポートタイプを作成する", "標準のマトリックスレポートを利用する", "レポートフォルダを作成してデータを整理する", "結合レポートを使用して複数のデータセットを組み合わせる"], "correct": [0], "explanation": "カスタムレポートタイプを作成することで、主オブジェクトと関連オブジェクトのデータを基にしたレポートを設計できます。標準レポートタイプでは対応できない要件を満たすための最適な方法です。\n他の選択肢の解説：\n\nb. マトリックスレポートは集計データを表示するためのものですが、カスタムデータモデルには対応できません。\nc. レポートフォルダは整理目的で使用されますが、データモデルの変更には使用できません。\nd. 結合レポートは複数のデータセットを組み合わせる場合に便利ですが、この要件には適しません。", "category": "データ管理＆分析"}, {"question": "製造業を営む企業が、従業員のリモートアクセスを許可するために信頼済みIP範囲を設定しました。この範囲外のIPアドレスからログインが試みられた場合、どのような処理が行われますか？", "choices": ["ログイン試行は拒否される。", "ユーザーにログインチャレンジが表示され、追加認証を求められる。", "ユーザーは読み取り専用モードでログインを許可される。", "システム管理者に通知され、承認後にログインが可能になる。"], "correct": [1], "explanation": "信頼済みIP範囲外からのログイン試行は、ログインチャレンジを引き起こします。このプロセスでは、SMSや認証アプリを利用したコード入力による本人確認が行われます。\n他の回答の解説：\n\na. ログイン試行が拒否されるのはログインIP範囲（Login IP Ranges）を設定した場合です。\nc. Salesforceに読み取り専用モードは存在しません。\nd. システム管理者への通知機能はありません。", "category": "設定とセットアップ"}, {"question": "製造業の社員が、Chatterを使った情報共有において、フォローしている投稿やレコードが追跡しにくいと苦情を寄せました。この課題を解決するために最適な機能は次のうちどれですか？", "choices": ["個人メモを活用して重要な情報を記録する。", "複数フィードを1か所で管理する「ストリーム（Streams）」機能を設定する。", "フィード検索で特定の投稿を見つけやすくする。", "共有フォルダを作成して投稿を整理する。"], "correct": [1], "explanation": "ストリームは、フォローしている投稿、グループ、またはレコードを1つにまとめて表示できるChatterの機能です。これにより、複数の情報源を簡単に追跡できます。\n他の回答の解説：\n\na. 個人メモは情報記録には役立ちますが、複数フィードの統合には適しません。\nc. フィード検索は特定の投稿を見つけるには有効ですが、フィードの整理には使えません。\nd. 共有フォルダはファイル管理向けであり、投稿の統合管理には使用できません。", "category": "生産性向上とコラボレーション"}, {"question": "貿易会社のサポートチームが、新規顧客の問い合わせに対して迅速にタスクを割り当てたいと考えています。Salesforceでタスクを作成する方法として正しくないものを1つ選びなさい。", "choices": ["ワークフロールールを使用してタスクを自動作成する。", "商談レコードの作成時にタスクを自動生成する標準設定を有効にする。", "承認プロセスのアクションでタスクを生成する。", "ユーザーが手動でタスクを作成する。"], "correct": [1], "explanation": "Salesforceには、商談作成時に自動的にタスクを生成する標準機能は存在しません。他の方法はタスク生成に適した手段です。\n他の回答の解説：\n\na. ワークフロールールは条件に基づいてタスクを自動的に作成します。\nc. 承認プロセスの特定のステージでタスクを生成することが可能です。\nd. 手動でタスクを作成することは基本的な機能の1つです。", "category": "自動化"}, {"question": "販売チームが、商談が「成立」ステージに移行した際に、指定されたChatterグループに通知を投稿するよう要望しています。この要件を最も簡単に満たす方法は次のうちどれですか？", "choices": ["ワークフロールール", "プロセスビルダー", "Flow Builder", "Apexコード"], "correct": [1], "explanation": "プロセスビルダーは、特定の条件に基づいてChatter投稿を自動で作成できる管理者向けツールです。コーディング不要で設定が可能であり、要件を効率的に実現できます。\n他の選択肢の解説：\n\na. ワークフロールールはChatter投稿を直接作成する機能を持ちません。\nc. Flow Builderは同様のタスクを実行できますが、プロセスビルダーより設定が複雑です。\nd. Apexコードでも実現可能ですが、コーディングスキルが必要です。", "category": "自動化"}, {"question": "販売チームの一部のユーザーから、「商談ステージが一部表示されない」という報告がありました。この問題を解決するために最も適切なアプローチを1つ選んでください。", "choices": ["販売プロセス設定を確認し、欠けているステージを追加する", "商談ページレイアウトを編集して必要なステージを手動で追加する", "商談レコードタイプを削除して新たに作成する", "商談ステージのフィールドレベルセキュリティを無効化する"], "correct": [0], "explanation": "商談ステージの表示は販売プロセスで管理されています。販売プロセス設定を確認し、必要なステージが含まれていない場合は追加する必要があります。\n他の選択肢の解説：\n\nb. ページレイアウトではステージの設定を直接変更することはできません。\nc. レコードタイプを削除する必要はありません。既存の設定を調整することで問題を解決できます。\nd. フィールドレベルセキュリティは表示の制御には影響を与えません。", "category": "セールス＆マーケティングアプリケーション"}, {"question": "地域担当者が営業戦略を議論するために作成した公開グループに関する質問です。このグループを利用して効果的な情報共有を行う際、正しい記述は次のうちどれですか？（2つ選択）", "choices": ["公開グループを共有ルールの適用先として指定できる。", "公開グループはSalesforceのすべての従業員が自由に作成できる。", "公開グループを使って手動でレコードを特定のユーザーと共有できる。", "公開グループはChatterグループと全く同じ機能を持っている。"], "correct": [0, 2], "explanation": "公開グループは、ユーザーやロールを一括で指定してレコードを共有する便利な機能です。共有ルールを作成する際に公開グループをターゲットとして指定できるほか、手動共有でも利用可能です。\n他の回答の解説：\n\nb. 公開グループはシステム管理者のみが作成可能です。すべてのユーザーが作成できるわけではありません。\nd. Chatterグループはコラボレーションを目的としており、公開グループとは異なる機能です。", "category": "設定とセットアップ"}, {"question": "ある中規模企業が、部門リーダーに一部の管理者権限（パスワードリセット、ユーザーのプロファイル変更など）を委任したいと考えています。この目的に最適なSalesforce機能はどれですか？", "choices": ["Salesforceライト（Salesforce Light）で限定的な管理機能を付与する。", "委任管理（Delegated Administration）を使用して管理タスクを割り当てる。", "スーパーユーザー（Super User）を設定し、全機能を利用可能にする。", "Junior Administrator権限を作成して付与する。"], "correct": [1], "explanation": "委任管理を利用することで、システム管理者以外のユーザーに限定的な管理機能（例：パスワードリセット、特定ユーザーの管理など）を付与できます。この機能は、管理業務の負担を分散するために便利です。\n他の回答の解説：\n\na. Salesforceライトという機能は存在しません。\nc. スーパーユーザー（Super User）は正式なSalesforce機能ではありません。\nd. Junior Administrator権限も公式には存在しません。", "category": "設定とセットアップ"}, {"question": "新進気鋭のEコマース企業が、最近開催したプロモーションキャンペーンで収集した8,000件以上のリード情報をSalesforceに登録しようとしています。このリストには潜在的な重複データが含まれている可能性があるため、データインポート時にエラーファイルを活用して重複を特定し、フィルタリングを行いたいと考えています。この目的を達成するために適切な設定はどれですか？", "choices": ["標準リード重複ルールの「一致ルール（Matching Rule）」をカスタマイズして有効化する。", "標準リード重複ルールで「アラート（Alert）」オプションを有効にし、インポート時に重複エラーを検出する。", "標準リード重複ルールに「通知（Notification）」設定を追加し、エラーをリアルタイムで受け取る。", "リードレコードのLightningページレイアウトに「重複警告」コンポーネントを追加する。"], "correct": [1], "explanation": "「アラート（Alert）」オプションを有効にすると、データローダを使用したインポート時に、潜在的な重複データがエラーファイル（error.csv）に記録されます。この設定により、エラーファイルを使用して重複データを効率的に特定し、処理することが可能です。\n他の回答の解説：\n\na. 一致ルールをカスタマイズしても、エラーファイルの生成には直接影響しません。\nc. 「通知（Notification）」設定はSalesforceに存在しない架空の機能です。\nd. LightningページレイアウトのInsert「重複警告」コンポーネントは、データ入力時に役立ちますが、データローダでのインポートには影響しません。", "category": "データ管理＆分析"}, {"question": "新規ビジネス部門のリーダーが、「取引先ごとの新規商談数」を確認したいと要求しました。ただし、商談が存在しない取引先はレポートに含めたくないという条件があります。この要件を満たすには、どの機能を使用するのが最適ですか？", "choices": ["カスタムサマリーフォーミュラを使用して取引先をフィルタリングする", "クロスフィルターを使用して商談の有無に基づいて取引先を絞り込む", "ダッシュボードに条件付きウィジェットを作成する", "取引先と商談のマトリックスレポートを使用して視覚的に確認する"], "correct": [1], "explanation": "クロスフィルターは、1つのオブジェクト（例：取引先）と関連オブジェクト（例：商談）の関係を基にレポートを絞り込むための強力なツールです。このケースでは、商談が存在する取引先だけをレポートに含めるために最適です。\n他の選択肢の解説：\n\na. カスタムサマリーフォーミュラはデータの集計には適していますが、関連オブジェクトに基づくフィルタリングは行えません。\nc. ダッシュボードのウィジェットは視覚化に役立ちますが、条件ベースのデータ絞り込みには適しません。\nd. マトリックスレポートは複数軸でのデータ集計が可能ですが、フィルタリング目的には適していません。", "category": "セールス＆マーケティングアプリケーション"}, {"question": "ある不動産会社の従業員が、これまで表示されていた「物件評価」フィールドが突然見えなくなったと報告しました。この問題を調査する際に、どのアプローチが誤っているか選びなさい。", "choices": ["ページレイアウトを確認し、フィールドが削除されていないか確認する。", "フィールドレベルセキュリティが「非表示」に設定されていないかプロファイルを確認する。", "ユーザーが誤ってブラウザのキャッシュをクリアしていないことを確認する。", "プロファイルのページレイアウト割り当てが変更されていないか確認する。"], "correct": [2], "explanation": "フィールドが非表示になる主な原因は次の通りです：ページレイアウトの変更でフィールドが削除されている。プロファイルのページレイアウト割り当てが変更されている。フィールドレベルセキュリティが「非表示」に設定されている。ブラウザのキャッシュクリアは表示に関係がなく、このアプローチは不適切です。\n他の回答の解説：\n\na. ページレイアウトでフィールドが削除されると表示されなくなるため、必ず確認する必要があります。\nb. フィールドレベルセキュリティが「非表示」に設定されている場合、フィールドが見えなくなるため重要な確認ポイントです。\nd. プロファイルのページレイアウト割り当てが変更されていると、フィールドの表示が影響を受ける可能性があります。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "ある製造企業が、経営会議のために見やすいダッシュボードを構築しようとしています。このダッシュボードで使用可能なコンポーネントとして誤りを1つ選びなさい。", "choices": ["ゲージ（Gauge）で目標進捗を表示する。", "テーブル（Table）でデータをリスト形式で表示する。", "カスタムコードで作成したレポートスナップショット（Reporting Snapshot）を使用する。", "ビジュアルフォースページ（Visualforce Page）を埋め込む。"], "correct": [2], "explanation": "レポートスナップショットは、データを特定の時点でキャプチャする機能であり、ダッシュボードコンポーネントとして直接利用することはできません。\n他の回答の解説：\n\na. ゲージは目標の進捗を視覚化するために使用されます。\nb. テーブルはリスト形式でのデータ表示に適しています。\nd. ビジュアルフォースページはカスタムコンテンツをダッシュボードに埋め込むために利用可能です。", "category": "データ管理＆分析"}, {"question": "ある物流会社が、重要な取引データを毎週バックアップし、安全に保存するよう指示を受けました。この要件を満たすために使用できるSalesforceのツールはどれですか？", "choices": ["データエクスポート（Data Export）を利用して、データを定期的にエクスポートする。", "ダッシュボードレポートの自動生成機能を使用してバックアップを作成する。", "Salesforceはバックアップ機能を提供していないため、外部ツールを利用する必要がある。", "Lightning Experienceで直接バックアップファイルをダウンロードする。"], "correct": [0], "explanation": "データエクスポート機能を使用すると、すべてのレコードデータをエクスポートしてローカルに保存できます。エクスポートは週次または月次でスケジュール可能で、バックアップの要件を満たすのに最適です。\n他の回答の解説：\n\nb. ダッシュボードはバックアップ用のツールではありません。\nc. Salesforceはバックアップ機能をサポートしており、この選択肢は誤りです。\nd. Lightning Experienceには直接バックアップをダウンロードする機能はありません。", "category": "データ管理＆分析"}, {"question": "国際物流会社が、新しい出荷リクエストを効率的に管理するため、リクエストを特定のチームに割り当てるワークフローを構築しています。どの設定が最適ですか？", "choices": ["出荷管理チームのキューを作成し、リクエストを自動的に割り当てるルールを設定する。", "公開グループを作成し、リクエストを各メンバーに手動で割り当てる。", "チーム内で共有可能な個人キューを設定し、リクエストを割り当てる。", "出荷管理チームのロールを作成し、すべてのリクエストを手動で確認させる。"], "correct": [0], "explanation": "キューを使用することで、リクエストを効率的に管理し、特定の条件に基づいてチーム全体にタスクを割り当てることができます。これにより、タスクの割り当てを自動化し、時間を節約できます。\n不正解の選択肢の解説：\n\nb. 公開グループでは自動割り当てがサポートされていないため、手動管理が必要です。\nc. 個人キューはチームでの効率的な管理には向いていません。\nd. ロールを使用して割り当てを手動で行うのは非効率的です。", "category": "サービス＆サポートアプリケーション"}, {"question": "地域限定のリテールチェーンが、従業員のタスク追跡と通知機能を強化するためにSalesforceワークフローを導入しました。以下のアクションのうち、ワークフローで実行できないものはどれですか？", "choices": ["フィールドの更新", "タスクの作成", "メールアラートの送信", "ユーザー権限の変更"], "correct": [3], "explanation": "Salesforceワークフローは、フィールドの更新、タスクの作成、メールアラートの送信を即時に実行できます。ただし、ユーザー権限の変更はワークフローではサポートされておらず、別の機能やツールが必要です。\n不正解の選択肢の解説：\n\na. フィールドの更新はワークフローで即時に実行可能です。\nb. タスクの作成は、ワークフローによって自動化できます。\nc. メールアラートの送信も、ワークフローの主要なアクションの一つです。", "category": "自動化"}, {"question": "人事データを管理するシステム「PeopleSync」とSalesforceを統合するプロジェクトが進行中です。このプロジェクトでは、統合のために使用される一意のIDを保存するフィールドを作成する必要があります。最適なフィールドタイプは次のうちどれですか？", "choices": ["テキストフィールド（外部IDを指定）", "メールフィールド", "日付フィールド", "長いテキストエリアフィールド"], "correct": [0], "explanation": "Salesforceでは外部IDフィールドを利用して、他システムとのデータマッチングを効率化できます。テキストフィールドに「外部ID」を指定すると、一意のIDを文字列形式で保存することが可能になります。\n他の回答の解説：\n\nb. メールフィールドは電子メールアドレスを保存するためのフィールドで、一意のIDには適していません。\nc. 日付フィールドは日付データを保存するためのもので、外部ID用途には不向きです。\nd. 長いテキストエリアフィールドは大量のテキストを保存できますが、外部IDとして使用する機能はありません。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "プロジェクト承認を迅速に行うため、マネージャーがChatterを利用して承認リクエストを簡素化したいと考えています。この要件を満たすために必要な設定はどれですか？", "choices": ["Chatter承認プロセスを有効化する", "投稿テンプレートをカスタマイズする", "プロファイル設定でChatterストリームを追加する", "ユーザー権限でChatterの使用を有効化する"], "correct": [0, 1], "explanation": "Chatter承認プロセスを有効にすることで、Chatterを利用した承認リクエストが可能になります。また、投稿テンプレートのカスタマイズにより通知内容を調整できます。\n他の回答の解説：\n\nc. Chatterストリームは承認プロセスの機能には直接関与しません。\nd. Chatterを有効にすることは必要ですが、承認プロセスの設定自体には関係ありません。", "category": "生産性向上とコラボレーション"}, {"question": "人事部門が、特定の従業員グループに給与データへの読み取り専用アクセスを提供するよう依頼してきました。この要件を満たす最も適切な方法はどれですか？", "choices": ["共有ルールを作成して給与データへのアクセスを拡張する", "プロファイルを作成して読み取り専用の権限を割り当てる", "権限セットを作成して特定ユーザーに割り当てる", "ロール階層を再設定してデータの可視性を変更する"], "correct": [2], "explanation": "権限セットは、特定のアクセス権を個別に付与するために使用されます。このケースでは、既存のプロファイルを変更せず、特定ユーザーにのみ給与データへの読み取り権限を追加できます。\n他の選択肢の解説：\n\na. 共有ルールはレコードレベルのアクセスを制御しますが、プロファイルや権限セットによる権限付与が前提です。\nb. プロファイルはユーザー全体の権限を管理するため、特定ユーザーのみにアクセスを制限する場合は適していません。\nd. ロール階層はデータ可視性を制御しますが、権限そのものを付与することはできません。", "category": "設定とセットアップ"}, {"question": "外部システムとSalesforceを統合する際に外部IDとして使用できないフィールドタイプを次の中から1つ選んでください。", "choices": ["テキストフィールド", "数値フィールド", "数式フィールド", "メールフィールド"], "correct": [2], "explanation": "数式フィールドは計算結果を表示するためのフィールドであり、外部IDとして使用することはできません。外部IDとして設定可能なフィールドタイプには、テキストフィールド、数値フィールド、メールフィールドなどがあります。\n他の選択肢の解説：\n\na. テキストフィールドは外部IDとして使用可能です。\nb. 数値フィールドは外部IDとして使用可能です。\nd. メールフィールドも外部IDとして使用可能です。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "人事部門が、新しい階層型レポートを作成するため、各社員をその直属の上司に関連付けたいと考えています。この目的を達成するために使用するSalesforceのフィールドタイプはどれですか？", "choices": ["連結関係（Junction Relationship）", "階層関係（Hierarchical Relationship）", "親子関係（Parent-Child Relationship）", "制御フィールド（Controlling Field）"], "correct": [1], "explanation": "階層関係は、Salesforceのユーザーオブジェクトでのみ使用可能な特別なルックアップ関係であり、ユーザー間の階層（例：直属の上司と部下）を作成するために使用されます。\n他の選択肢の解説：\n\na. 連結関係は多対多の関係を作成する際に使用され、人事データには適しません。\nc. 親子関係は主従関係のモデルに使用され、ユーザー間の階層には適用できません。\nd. 制御フィールドはフィールド依存関係を管理しますが、ユーザー間の関係を作成するためのものではありません。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "地域ごとの製品販売状況を分析するため、マーケティングチームが複数選択リストを制御フィールドとして設定しようとしています。しかし、設定の途中でエラーが発生しました。このエラーの原因として最も適切な説明はどれですか？", "choices": ["複数選択リストは制御フィールドとして使用できない", "制御フィールドに設定する前に値の一意性を確認する必要がある", "フィールドレベルセキュリティが複数選択リストに適用されていない", "複数選択リストはすべての選択肢が使用されていないとエラーになる"], "correct": [0], "explanation": "複数選択リストは、制御フィールドとして使用することができません。選択肢の数が膨大になる可能性があるため、管理とシステムパフォーマンスに影響を与える可能性があるからです。\n他の選択肢の解説：\n\nb. 値の一意性は制御フィールド設定には不要です。\nc. フィールドレベルセキュリティはこのケースでは関係ありません。\nd. 複数選択リストの選択肢がすべて使用される必要はありません。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "営業部門が新たなポリシーを導入し、Junior Sales Repは商談の初期段階（ステージ1〜3）にのみアクセスできるようにし、Senior Sales Repは商談の後半段階（ステージ4〜5）にアクセス可能とする必要があります。この要件を満たすには、どのような設定を行うべきですか？", "choices": ["Junior Sales RepとSenior Sales Repに異なるページレイアウトを割り当て、それぞれのレイアウトに特定のステージを表示する", "フィールドレベルセキュリティを使用してJunior Sales Repから後半のステージを非表示にする", "セールスプロセスを2つ作成し、それぞれを異なる商談レコードタイプに関連付ける", "Validation Ruleを作成し、Junior Sales Repが後半のステージを選択できないようにする"], "correct": [2], "explanation": "セールスプロセスを利用することで、各役職に適した商談ステージを定義できます。さらに、レコードタイプを使用してセールスプロセスを区別することで、Junior Sales RepとSenior Sales Repに適切なステージを割り当てることが可能です。\n他の回答の解説：\n\na. 異なるページレイアウト：ページレイアウトはフィールドの表示を制御しますが、特定のピックリスト値の制御はできません。\nb. フィールドレベルセキュリティ：フィールド全体の可視性を制御する機能であり、特定のステージ値の制御には適しません。\nd. Validation Rule：ステージの選択を制限することは可能ですが、ユーザー体験が損なわれる可能性があります。", "category": "セールス＆マーケティングアプリケーション"}, {"question": "ITマネージャーが、新しい営業分析アプリケーションへのアクセスを特定の営業チームメンバーだけに付与したいと考えています。この要件を満たす最適な方法はどれですか？", "choices": ["営業チームメンバーを新しいChatterグループに追加する", "対象ユーザーに適した権限セットを作成して割り当てる", "プロファイルにアプリケーションの権限を追加して一括設定する", "セールスプロセスをカスタマイズしてアクセスを制限する"], "correct": [1], "explanation": "権限セットは、既存のプロファイルを変更せずに個々のユーザーに特定の権限を追加する最適な方法です。これにより、新しいアプリケーションへの柔軟なアクセス管理が可能となります。\n他の回答の解説：\n\na. 営業チームメンバーを新しいChatterグループに追加する：Chatterグループはコラボレーションのためのツールであり、アプリケーションのアクセス制御には関与しません。\nc. プロファイルにアプリケーションの権限を追加して一括設定する：プロファイルの変更は影響範囲が広く、柔軟性に欠けるため、限定的なアクセス管理には適していません。\nd. セールスプロセスをカスタマイズしてアクセスを制限する：セールスプロセスは商談の進行管理に使用される機能であり、アプリケーションのアクセス管理には関連がありません。", "category": "設定とセットアップ"}, {"question": "Northern Trail Outfittersのマーケティングディレクターは、リードステータス項目を評価済みとしてマークするために、予算項目に入力することを求めています。管理者はこの要請を満たすためにどのツールを使用するべきですか？", "choices": ["リードの取引開始", "必須項目", "ワークフロールール", "入力規則"], "correct": [3], "explanation": "D. 入力規則 - 正解です。入力規則を使用すると、ユーザーがレコードを保存する前にデータが特定の条件を満たしているかを検証できます。リードステータスが評価済みに変更されたときに予算項目が空白である場合、エラーを表示して保存をブロックするように設定できるため、今回の要件を満たす最適なツールです。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "cloud kicksの営業担当者は、商品の販売を成約させるために商談レコードの割引を使用しています。商談が成約した場合、関連する商談商品に手動で割引を適用する必要があります。営業マネージャーは、この時間のかかる作業を自動化する方法があるかどうかを尋ねました。管理者はこの要件を満たすために何を使用する必要がありますか？", "choices": ["Flow Builder", "承認プロセス", "事前構築済みマクロ", "数式項目"], "correct": [0], "explanation": "A. Flow Builder - 正解です。フロービルダーは、Salesforce内で複雑なビジネスプロセスを自動化するための強力なツールです。商談が成約したときにトリガーされるレコードトリガフローを作成し、その商談に関連するすべての商談商品レコードを自動的に更新して割引を適用することができます。これにより、手作業による時間のかかるプロセスを排除できます。", "category": "セールス＆マーケティングアプリケーション"}, {"question": "Northern TrailOutfittersの管理者は、割り当てられたライセンスと権限セットを追跡するためにスプレッドシートを使用してきました。Salesforceでこれを追跡するために使用できる機能は何ですか？", "choices": ["ログイン履歴", "Lightning利用状況アプリケーション", "ユーザーレポート", "権限セットグループ"], "correct": [2], "explanation": "C. ユーザーレポート - 正解です。ユーザーレポートを作成することで、組織内のユーザーに割り当てられているプロファイル、ライセンス、権限セットなどの詳細な情報を抽出し、リストとして追跡することができます。これによりスプレッドシートでの手動管理が不要になります。", "category": "設定とセットアップ"}, {"question": "Universal Containersの管理者は、ユーザーがネットワーク外からSalesforceにアクセスするのを防ぐよう求められました。この設定の考慮事項となる2つはどれですか？2つの回答を選択してください。", "choices": ["IPアドレスの制限は、プロファイルまたは組織全体で設定される。", "ユーザーはログインIP制限を回避するためにパスワードを変更できる。", "IP制限を実施するには、「すべての要求でログインIPアドレスの制限を適用」を選択する必要がある。", "シングルサインオンを使用すると、ユーザーはどこからでもログインできるようになる。"], "correct": [0, 2], "explanation": "A. IPアドレスの制限は、プロファイルまたは組織全体で設定される。 - 正解です。SalesforceにおけるIPアドレス制限は、ネットワークアクセス設定を使用して組織全体の信頼済みIP範囲として設定するか、プロファイルレベルで厳密なログインIPアドレスの制限として設定することができます。\n\nC. IP制限を実施するには、「すべての要求でログインIPアドレスの制限を適用」を選択する必要がある。 - 正解です。ユーザーがログイン後に制限外のIPアドレスのネットワークに移動した場合（モバイル環境など）でもアクセスを継続してブロックするには、セッションの設定で「すべての要求でログインIPアドレスの制限を適用」オプションを有効にする必要があります。", "category": "設定とセットアップ"}, {"question": "Cloud Kicksの分析ユーザーは、オブジェクトに対する「参照」、「作成」、および「編集」アクセス権を必要としていますが、レコードの「削除」は制限される必要があります。この要件を満たすために、管理者は何を行うべきですか？", "choices": ["分析ユーザーに標準のシステム管理者プロファイルを割り当てる。", "ユーザーに「すべて表示」アクセス権を付与し、ロール階層で最上位のロールに割り当てる。", "各オブジェクトの「削除」アクセス権を削除したカスタムプロファイルを作成して割り当てる。", "「参照」、「作成」、および「編集」アクセス権を含む権限セットを作成して割り当てる。"], "correct": [2], "explanation": "C. 各オブジェクトの「削除」アクセス権を削除したカスタムプロファイルを作成して割り当てる。 - 正解です。標準プロファイルをベースにしてカスタムプロファイルを作成し、各オブジェクトの「削除」権限を外して「参照」「作成」「編集」のみを残すことで、ユーザーがレコードを削除できないようにアクセス権を適切に制限することができます。", "category": "設定とセットアップ"}, {"question": "Northern Trail Outfittersの管理者は、salesforceで新しいユーザーを追加できません。この問題の原因は何ですか？", "choices": ["ユーザー名が企業のメールアドレスではありません。", "ユーザー名が80文字未満です。", "ユーザー名が偽のメールアドレスです。", "ユーザー名がすでに使用されています。"], "correct": [3], "explanation": "D. ユーザー名がすでに使用されています。 - 正解です。Salesforceにおけるユーザー名は、すべてのSalesforce組織を通じてグローバルに一意である必要があります。そのため、他の組織（他の会社の環境やSandboxなど）で既に同じユーザー名が登録されている場合、新しいユーザーとして保存できずにエラーとなります。", "category": "設定とセットアップ"}, {"question": "Cloud Kicksは、商品ごとに靴のデザインを追跡したいと考えています。靴のデザインは削除できないようにする必要があり、1つの商品に対して様々なフェーズにわたって複数のデザインが存在する可能性があります。この要件を満たすために、管理者はどの2つのステップを設定する必要がありますか？2つ選択してください。", "choices": ["靴のデザイン用のカスタムオブジェクトを作成する。", "商品オブジェクトに靴のデザイン用のカスタム参照項目を設定する。", "商品オブジェクトに靴のデザイン用のカスタム主従関係項目を追加する。", "デザイン用の標準オブジェクトを使用する。"], "correct": [0, 2], "explanation": "A. 靴のデザイン用のカスタムオブジェクトを作成する。 - 正解です。Salesforceには靴のデザインを管理するための専用の標準オブジェクトは存在しないため、要件を満たすデータを格納するためのカスタムオブジェクトを新規作成する必要があります。\n\nC. 商品オブジェクトに靴のデザイン用のカスタム主従関係項目を追加する。 - 正解です。1つの商品に対して複数のデザインが存在するという要件（1対多の関係）を満たし、さらにデザインレコードの削除制限などの詳細な制御を親レコード（商品）側と強固に結びつけるためには、主従関係を構築することが最適です。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "DreamHouse Realtyには承認プロセスがあります。マネージャーがレコードを承認しようとしましたが、エラーが発生しました。この問題をトラブルシューティングするために、管理者は何を確認すべきですか？", "choices": ["プロセス内の次の承認者に対して代理承認者を追加する。", "プロセスで更新される項目の参照アクセス権を付与するために、項目レベルセキュリティを更新する。", "次の承認者に指定されているユーザーが無効化されているか、欠落しているかを確認する。", "プロセスで更新される項目が表示されていることを確認するために、ページレイアウトを確認する。"], "correct": [2], "explanation": "C. 次の承認者に指定されているユーザーが無効化されているか、欠落しているかを確認する。 - 正解です。承認プロセスで次のステップに進む際、指定されている次回の承認者（ユーザー）がシステム上で無効化されていたり、指定されたマネージャー項目が空白（欠落）であったりすると、適切なルーティング先が見つからずにエラーが発生します。", "category": "自動化"}, {"question": "管理者は、組織で行われた最近の設定変更を確認するためにどのツールを使用するべきですか？", "choices": ["重要な更新", "デバッグログ", "設定変更履歴", "項目履歴管理"], "correct": [2], "explanation": "C. 設定変更履歴 - 正解です。設定変更履歴は、自分または他の管理者が組織の設定に対して行った最近の変更を追跡し、誰が、いつ、何を変更したかを確認するために使用される最適なツールです。", "category": "設定とセットアップ"}, {"question": "Ursa Major Solarの管理者は、作業項目とプロジェクトのカスタムオブジェクトのリレーションを主従関係から参照関係に変更するよう求められました。この要件を満たす上で、管理者の妨げとなる可能性があるシナリオはどれですか？", "choices": ["参照をサポートするには連結オブジェクトが必要です。", "すべてのレコードの参照項目に値が含まれています。", "レコードを保存するには参照項目が必要です。", "主オブジェクトに積み上げ集計項目が存在します。"], "correct": [3], "explanation": "D. 主オブジェクトに積み上げ集計項目が存在します。 - 正解です。親オブジェクト（主オブジェクト）側に子レコードの値を計算するための積み上げ集計項目が存在する場合、その基となっている主従関係を参照関係に変更することはできません。変更を行うには、事前に対象の積み上げ集計項目を削除する必要があります。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "Ursa Major Solarは、すべての従業員に素晴らしい体験を提供しています。従業員エンゲージメント委員会は、他の従業員の投稿を制限しつつ、更新情報を投稿したいと考えています。この要求を満たすために、管理者は何を作成するべきですか？", "choices": ["Chatter ストリーム", "Chatter ブロードキャストグループ", "Chatter お勧め", "Chatter リストに記載しないグループ"], "correct": [1], "explanation": "B. Chatter ブロードキャストグループ - 正解です。Chatter ブロードキャストグループは、グループの所有者とマネージャーのみが新規投稿を作成でき、一般メンバーの投稿を制限できるグループです。これにより、委員会のみが情報を発信し、他の従業員の投稿を制限するという要件を満たすことができます。", "category": "生産性向上とコラボレーション"}, {"question": "Ursa Major Solarはケースにパスを設定しています。同社は、ユーザーがパス上にある状況の値に沿って進めることを義務付けたいと考えています。エージェントがケースを以前の状況に戻すことを禁止する必要があります。管理者はこの要求を満たすためにどの機能を使用するべきですか？", "choices": ["入力規則", "グローバル選択リスト", "事前定義済み項目値", "連動選択リスト"], "correct": [0], "explanation": "A. 入力規則 - 正解です。入力規則を使用すると、数式を評価してレコードの保存を防ぐことができます。前の状況の値をチェックし、ユーザーがパスを逆戻りして以前の状況に変更しようとした場合にエラーメッセージを表示し、保存をブロックするという要件を満たすことができます。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "DreamHouse Realtyは、保証作業に関する顧客からのリクエストを定期的に処理しており、顧客にケースを生成するためのセルフサービスオプションを提供したいと考えています。管理者はこの要件を満たすために、どの2つのソリューションを使用するべきですか？2つ選択してください。", "choices": ["Web-to-ケース", "ケースのエスカレーション", "ケースキュー", "メール-to-ケース"], "correct": [0, 3], "explanation": "A. Web-to-ケース - 正解です。Web-to-ケースを使用すると、自社のWebサイトにカスタマイズ可能なフォームを埋め込み、顧客が自らフォームに入力して送信することで、直接Salesforce内にケースレコードを自動生成するセルフサービスチャネルを提供できます。\n\nD. メール-to-ケース - 正解です。メール-to-ケースを設定することで、顧客が指定されたサポート用のメールアドレスにメールを送信するだけで、その内容がSalesforce上で自動的にケースとして登録されます。これにより、顧客に使いやすいセルフサービス型のケース生成手段を提供できます。", "category": "サービス＆サポートアプリケーション"}, {"question": "管理者は、ユーザーのグループに、ユーザーインターフェースログインの2要素認証権限とAPIログインの2要素認証権限を持つ権限セットグループを割り当てました。ユーザーの1人がデータローダにログインしようとしたとき、どの2つのプロンプトが発生しますか？ 2つ選択してください。", "choices": ["ユーザーは認証アプリケーションをSalesforceアカウントに接続する必要があります。", "ユーザーは「私のセキュリティトークンのリセット」を使用して、信頼できるネットワークからセキュリティトークンを取得する必要があります。", "ユーザーはモバイルデバイスに認証アプリケーションをダウンロードしてインストールする必要があります。", "ユーザーは、優先順位が高い方のメールまたはSMSからの確認コードを入力する必要があります。"], "correct": [0, 3], "explanation": "A. ユーザーは認証アプリケーションをSalesforceアカウントに接続する必要があります。 - 正解です。多要素認証（2要素認証）が必須となっている場合、ログインを完了するためにはSalesforce Authenticatorなどの認証アプリケーションをユーザー自身のアカウントに紐づけて接続し、検証プロセスを有効化するためのプロンプトが表示されます。\n\nD. ユーザーは、優先順位が高い方のメールまたはSMSからの確認コードを入力する必要があります。 - 正解です。ログインの試行時、特に新しいデバイスや場所からのアクセスで認証プロセスが完全に設定されていない場合、セキュリティ検証の手段として、登録済みのメールアドレスやSMSに送信された確認コード（ワンタイムパスワード）の入力を求めるプロンプトが表示されることがあります。", "category": "設定とセットアップ"}, {"question": "Aw Computingは、商談が失注したときに、リッチテキスト項目で失注理由を取り込む必要があります。管理者はこの要件をどのように設定する必要がありますか？", "choices": ["ページレイアウトで失注理由項目の横にある必須チェックボックスを選択する。", "フェーズが失注で失注理由が空白の場合にエラーを表示する入力規則を作成する。", "オブジェクトマネージャーで失注理由項目の必須チェックボックスをオンにする。", "失注理由が空白の場合にエラーを表示するワークフロールールを設定する。"], "correct": [1], "explanation": "B. フェーズが失注で失注理由が空白の場合にエラーを表示する入力規則を作成する。 - 正解です。入力規則を使用すると、特定の条件（フェーズが失注かつ失注理由項目が空白）を満たしたときにエラーメッセージを表示し、レコードの保存を防ぐことができます。これにより、特定のフェーズでのみ項目の入力を強制することができます。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "Cloud Kicksは、アプリが自社のニーズを満たしているか確認するために、AppExchangeからアプリを試用したいと考えています。管理者が提案すべき2つのオプションはどれですか？2つの回答を選択してください。", "choices": ["本番組織でテストドライブする。", "Trailhead Playgroundにダウンロードする。", "Sandboxにインストールする。", "エディションの互換性を確認する。"], "correct": [1, 2], "explanation": "B. Trailhead Playgroundにダウンロードする。 - 正解です。Trailhead Playgroundは無料の開発環境として機能するため、自社の本番環境に影響を与えることなくAppExchangeのアプリをインストールし、安全に動作検証やテストを行うための独立した環境として利用できます。\n\nC. Sandboxにインストールする。 - 正解です。Sandboxは本番組織のコピー環境であるため、自社の実際のデータモデルや既存のカスタマイズ設定の中でアプリがどのように機能するかを、本番環境にリスクを与えることなく安全かつ正確にテストすることができます。", "category": "設定とセットアップ"}, {"question": "AW ComputingのCTOは、顧客満足度を向上させるためのケースに関する新しいポリシーを定義しました。ケース理由が「インストール」で送信されたすべてのケースは、メールですぐに受付確認され、適切なエージェントに割り当てられる必要があります。4時間経過しても「新規」ステータスのままであるケースは、サポート管理チームにエスカレーションされる必要があります。この要件のために利用する必要があるケース管理ツールはどれですか？", "choices": ["自動レスポンスルール、マクロ、エンタイトルメント", "自動レスポンスルール、キュー、マクロ", "自動レスポンスルール、キュー、エスカレーションルール", "自動レスポンスルール、エンタイトルメント、エスカレーションルール"], "correct": [2], "explanation": "C. 自動レスポンスルール、キュー、エスカレーションルール - 正解です。メールでの即時の受付確認には自動レスポンスルール、適切な担当者への初期割り当て先としてはキュー、4時間後のサポート管理チームへの自動ルーティングにはエスカレーションルールがそれぞれ使用されます。これが要件を完全に満たす正しい機能の組み合わせです。", "category": "サービス＆サポートアプリケーション"}, {"question": "Cloud Kicksの管理者は、新しいクラウドシューズの返品を追跡するための新しい項目を作成しました。ユーザーは、新しい項目が利用できないことを示すケースを管理者に送信しました。この問題をトラブルシューティングするために、管理者が行うべき2つのステップはどれですか？2つの回答を選択してください。", "choices": ["ユーザーのプロファイルのページレイアウトが更新されていることを確認する。", "組織の設定変更履歴を実行する。", "オブジェクトの組織の共有直接設定を更新する。", "ユーザープロファイルに対する項目の項目レベルセキュリティを確認する。"], "correct": [0, 3], "explanation": "A. ユーザーのプロファイルのページレイアウトが更新されていることを確認する。 - 正解です。項目が作成されていても、ユーザーに割り当てられているページレイアウトにその項目が配置されていない場合、ユーザーはその項目を表示したり入力したりすることができません。そのため、ページレイアウトの確認がトラブルシューティングの重要な最初のステップとなります。\n\nD. ユーザープロファイルに対する項目の項目レベルセキュリティを確認する。 - 正解です。項目レベルセキュリティによって、特定のユーザープロファイルに対してその項目の参照アクセス権や編集アクセス権が付与されていない場合、ページレイアウトに項目が存在していても画面には表示されません。プロファイルの項目権限を確認することが必須のステップです。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "Northern Trail Outfittersは、商談の主要な利害関係者である取引先責任者のROIを追跡したいと考えています。営業担当副社長は、この情報が商談上でアクセス可能であり、レポートで利用できるように要求しました。管理者はこれらの要件を満たすためにどの2つのオプションを設定するべきですか？2つの回答を選択してください。", "choices": ["キャンペーンメンバーの役割をカスタマイズする。", "商談ページレイアウトにキャンペーンメンバー関連リストを追加する。", "キャンペーンの役割をカスタマイズする。", "商談の取引先責任者の役割をカスタマイズする。", "商談ページレイアウトに商談の取引先責任者の役割関連リストを追加する。"], "correct": [3, 4], "explanation": "D. 商談の取引先責任者の役割をカスタマイズする。 - 正解です。商談の取引先責任者の役割（Opportunity Contact Role）の選択リスト値をカスタマイズして、ビジネス要件に合った役割（意思決定者、エグゼクティブスポンサーなど）を追加することで、特定の取引先責任者が商談にどのように関与しているかを正確に追跡し、レポートで分析できるようになります。\n\nE. 商談ページレイアウトに商談の取引先責任者の役割関連リストを追加する。 - 正解です。ユーザーが商談レコードの画面上で、利害関係者である取引先責任者とその役割を簡単に確認および追加できるようにするには、商談のページレイアウトに「取引先責任者の役割」関連リストを追加して表示させる必要があります。", "category": "セールス＆マーケティングアプリケーション"}, {"question": "Northern Trail Outfittersには、新しい取引先が作成されたときに項目値を自動的に設定する新しいフローがあります。そのフローはプロセスによって起動されますが、適切に機能していません。管理者は問題を特定するために何をするべきですか？", "choices": ["Flow Builderのネイティブデバッグ機能を使用する。", "ログインレベルでデバッグログを確認する。", "設定変更履歴を表示してエラーを確認する。", "メールログを設定して送信エラーログを確認する。"], "correct": [0], "explanation": "A. Flow Builderのネイティブデバッグ機能を使用する。 - 正解です。フロービルダーには、フローの実行経路や変数の値、エラーの詳細をステップごとに視覚的に確認できる強力なデバッグ機能が標準で備わっています。プロセスから起動されるフローのトラブルシューティングにおいて、入力変数を指定してこのデバッグ機能を使用することで、どこで問題が発生しているかを最も効率的に特定できます。", "category": "自動化"}, {"question": "Universal Containers (UC) は、各取引先に関連付けられたオープンなケースの数を数え、毎週金曜日の夕方にこの値で取引先を更新したいと考えています。UCは常に数百のオープンなケースを抱えています。管理者はこの要求を完了するために何を使用するべきですか？", "choices": ["レコードトリガーフローを使用する。", "スケジュールされたプロセスビルダーを使用する。", "積み上げ集計項目を使用する。", "スケジュールされたフローを使用する。"], "correct": [3], "explanation": "D. スケジュールされたフローを使用する。 - 正解です。スケジュールトリガーフロー（スケジュールされたフロー）を使用することで、毎週金曜日の夕方という指定したスケジュールでフローを定期実行できます。これにより、関連するオープンなケースの数を取得して取引先の項目を一括更新する要件を満たすことができます。", "category": "自動化"}, {"question": "Cloud Kicksの管理者は、カスタムオブジェクトの行動を更新し、その行動の主要な取引先責任者への参照項目を含めました。行動レポートを実行する際、関連する取引先責任者レコードの項目を参照したいと考えています。カスタムレポートに取引先責任者の項目を取り込むために、管理者は何をするべきでしょうか？", "choices": ["行動に数式項目を設定して、取引先責任者の情報を入力する。", "カスタムの行動レポートタイプを編集し、参照を介して関連する項目を追加する。", "行動を主オブジェクト、取引先責任者を関連オブジェクトとして、新しいレポートタイプを作成する。", "要求通りに行動と取引先責任者のデータを表示するために、検索条件を含むダッシュボードを使用する。"], "correct": [1], "explanation": "B. カスタムの行動レポートタイプを編集し、参照を介して関連する項目を追加する。 - 正解です。カスタムレポートタイプを編集する際、参照先の項目を追加する機能を使用することで、参照関係にある親オブジェクト（この場合は取引先責任者）の項目をレポートレイアウトに直接追加できます。これにより、レポート上で関連レコードのデータを簡単に参照できるようになります。", "category": "データ管理＆分析"}, {"question": "AW Computingは、ユーザーが取引先の年間売上項目を負の値、または1000億ドルを超える金額に更新するのを防ぎたいと考えています。管理者はこの要求をどのように達成するべきでしょうか？", "choices": ["取引先の売上が0未満、または1000億を超える場合にエラーを表示する入力規則を作成する。", "取引先の売上が負の値、または1000億を超える取引先を表示するスケジュール済みレポートを作成する。", "ページレイアウトで取引先の売上項目を必須にする。", "設定で取引先の売上制限を有効にし、最小値を0、最大値を1000億にする。"], "correct": [0], "explanation": "A. 取引先の売上が0未満、または1000億を超える場合にエラーを表示する入力規則を作成する。 - 正解です。入力規則を使用すると、ユーザーが保存しようとしたデータが指定された条件を満たしているかを検証できます。この場合、売上が0未満または1000億を超える場合にエラーメッセージを表示する数式を設定することで、不適切な値での更新を完全に防ぐことができます。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "モバイルナビゲーションメニューで利用できる3つの項目はどれですか？3つ選択してください。", "choices": ["Lightningアプリケーションページ", "Lightningホームページ", "Chatter", "ユーティリティバー", "ダッシュボード"], "correct": [0, 2, 4], "explanation": "A. Lightningアプリケーションページ - 正解です。Lightningアプリケーションページは、モバイルアプリケーションのナビゲーションメニューに追加して、ユーザーにカスタムインターフェースを提供することができます。\n\nC. Chatter - 正解です。Chatterはモバイルナビゲーションメニューで利用可能な標準項目の1つであり、ユーザーはモバイルデバイスからフィードやグループにアクセスできます。\n\nE. ダッシュボード - 正解です。ダッシュボードはモバイルナビゲーションメニューに追加でき、ユーザーは外出先からでも重要なデータや指標を視覚的に確認できます。", "category": "生産性向上とコラボレーション"}, {"question": "Universal Containerの管理者は、項目の値に基づいてレコードを削除する自動化された方法を必要としています。管理者はどの自動化ソリューションを使用するべきでしょうか？", "choices": ["ワークフロー", "プロセスビルダー", "フロービルダー", "Automation Studio"], "correct": [2], "explanation": "C. フロービルダー - 正解です。フロービルダーはSalesforceプラットフォームの強力な自動化ツールであり、レコードの削除要素を使用して、指定した条件や項目の値に基づいてレコードを自動的に削除することができます。", "category": "自動化"}, {"question": "AW Computingは、リードオブジェクトにマーケットセグメントという新しいカスタムテキスト項目を追加しました。リードが取引開始されるとき、この新しい項目は取引先レコードにコピーされません。リードのマーケットセグメント項目が、日常的に取引開始された取引先レコードに確実にコピーされるようにするために、管理者は何をするべきでしょうか？", "choices": ["リードのマーケットセグメント項目が取引先の適切な項目にマッピングされていることを確認する。", "取引先に、新しいリード項目とまったく同じ名前の項目があることを確認する。", "取引先のその項目に値が確実にあるようにする入力規則を作成する。", "カスタム項目をリードから取引先にコピーするレコードトリガフローを作成する。"], "correct": [0], "explanation": "A. リードのマーケットセグメント項目が取引先の適切な項目にマッピングされていることを確認する。 - 正解です。リードのカスタム項目を取引開始時に取引先、取引先責任者、または商談のカスタム項目に引き継ぐには、設定のリードの項目の対応付けでマッピングを明示的に行う必要があります。", "category": "セールス＆マーケティングアプリケーション"}, {"question": "Cloud Kicksのカスタマーサクセスエージェントが休暇に入るため、複数のケースの所有者を変更する必要があります。この要求を満たすことができる2人のユーザーはどれですか？2つ選択してください。", "choices": ["取引先に対する参照権限を持つユーザー。", "エージェントの上のマネージャーロールを持つユーザー。", "システム管理者プロファイルを持つユーザー。", "ケースの管理権限を持つユーザー。"], "correct": [1, 2], "explanation": "B. エージェントの上のマネージャーロールを持つユーザー。 - 正解です。ロール階層においてレコード所有者よりも上位に位置するマネージャーは、部下が所有するレコードに対してフルアクセス権を持つため、ケースの所有者を変更することができます。\n\nC. システム管理者プロファイルを持つユーザー。 - 正解です。システム管理者プロファイルにはすべてのデータの編集権限が含まれており、組織内のすべてのレコードへのフルアクセス権を持つため、ケースの所有者を自由に変更することができます。", "category": "設定とセットアップ"}, {"question": "Dreamhouse Realtyのエージェントは、オープンハウスの行動の夜をダブルブッキングしています。行動マネージャーは、エージェントが行動の詳細と希望日を記入するのを支援する行動提出プロセスを望んでいます。管理者はこの要求をどのように達成するべきでしょうか？", "choices": ["ワークフロールールを作成して、行動の日付項目を更新する。", "キャンペーンオブジェクトに承認プロセスを作成する。", "他のエージェントが行動を表示できるように共有ルールを作成する。", "エージェントが行動の希望日を要求するためのキャンペーンを作成する。"], "correct": [1], "explanation": "B. キャンペーンオブジェクトに承認プロセスを作成する。 - 正解です。承認プロセスを使用することで、エージェントが行動の詳細や希望日を入力して提出し、マネージャーがそれを確認して承認または却下するという一連のワークフローを構築できます。これにより、管理者が日程を適切に管理し、ダブルブッキングを未然に防ぐことが可能になります。", "category": "自動化"}, {"question": "Ursa Major Solarは、サービスチーム向けにSalesforceを評価しており、標準でどのオブジェクトが利用可能かを知りたいと考えています。サポートのユースケースを検討している管理者が利用できる3つの標準オブジェクトはどれですか？3つ選択してください。", "choices": ["契約", "ケース", "チケット", "要求", "取引先"], "correct": [0, 1, 4], "explanation": "A. 契約 - 正解です。契約はSalesforceの標準オブジェクトであり、サポートプロセスにおいて顧客とのサービスレベルアグリーメントやサポート契約などを管理するために使用されます。\n\nB. ケース - 正解です。ケースは顧客からの問い合わせや問題を追跡および解決するための標準オブジェクトであり、サポートのユースケースにおいて中心的な役割を果たします。\n\nE. 取引先 - 正解です。取引先はSalesforceの基盤となる標準オブジェクトであり、サポートを提供する対象の企業や個人の情報を管理するために不可欠です。", "category": "サービス＆サポートアプリケーション"}, {"question": "DreamHouse Realityは、取引先とケースのカテゴリ項目で一貫した選択リスト値を使用し、レコードタイプに応じてそれぞれの値を対応させる必要があります。管理者はこの要件を満たすためにどの2つの機能を使用するべきでしょうか？2つ選択してください。", "choices": ["連動選択リスト", "グローバル選択リスト", "複数選択リスト", "カスタム選択リスト"], "correct": [0, 3], "explanation": "A. 連動選択リスト - 正解です。連動選択リストは、制御項目の値に基づいて利用可能な値を制限する機能であり、特定の条件に合わせてユーザーに適切な選択肢を表示するために活用できます。\n\nD. カスタム選択リスト - 正解です。取引先とケースに独自のカテゴリ項目を持たせるためには、対象のオブジェクトにカスタム選択リスト項目を作成し、レコードタイプごとに利用可能な値を割り当てる設定を行う必要があります。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "AW Computingの管理者は、Salesforceへのログインに問題があるユーザーと協力しています。ユーザーがログインできない理由を特定するために、管理者は何をするべきでしょうか？", "choices": ["ユーザーのログイン履歴を確認する。", "設定変更履歴を実行して、ログイン試行を確認する。", "パスワードポリシーが遵守されていることを確認するために、パスワード履歴を抽出する。", "プロファイルのセキュリティトークンをリセットする。"], "correct": [0], "explanation": "A. ユーザーのログイン履歴を確認する。 - 正解です。ユーザーのレコードまたは設定メニューからログイン履歴を確認することで、ログインの成功や失敗、およびその理由（無効なパスワード、IP制限、ロックアウトなど）を特定し、トラブルシューティングを行うことができます。", "category": "設定とセットアップ"}, {"question": "Cloud Kicksの管理者はカスタム項目を削除しましたが、その項目をまだ使用しているビジネスユニットがあることに気付きました。項目を復元する際、管理者はどのようなことを考慮するべきでしょうか？", "choices": ["項目をレポートに再追加する必要があります。", "項目の履歴は削除されたままになります。", "項目をごみ箱から復元する必要があります。", "項目をページレイアウトに再追加する必要があります。"], "correct": [1], "explanation": "B. 項目の履歴は削除されたままになります。 - 正解です。カスタム項目を削除して復元した場合、項目のデータ自体は復元されますが、その項目に対して記録されていた項目履歴追跡のデータは完全に失われ、復元することはできません。これは管理者が必ず考慮すべき事項です。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "管理者は、子レコードへのアクセスが制限された、2つのオブジェクト間の1対多の関係を作成する必要があります。管理者はどのタイプの項目を使用するべきですか？", "choices": ["積み上げ集計項目", "主従関係項目", "クロスオブジェクト数式", "参照項目"], "correct": [3], "explanation": "D. 参照項目 - 正解です。参照項目は2つのオブジェクト間に1対多の関係を作成します。主従関係とは異なり、親と子は独立しているため、子レコードに独自の共有設定を適用してアクセスを制限することができます。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "Cloud Kicksのマーケティングチームは、製品への関心を引くためにキャンペーンを使用しています。彼らは実行する各キャンペーンのキャンペーンメンバーのステータス項目にカスタム選択リスト値を求めていますが、現在は管理者に値の追加や削除を依頼しており、非常に時間がかかっています。マーケティングチームがキャンペーンメンバーのステータス選択リスト値を自分でカスタマイズできるようにするには、どの2つのユーザー権限が必要ですか？ 2つ選択してください。", "choices": ["キャンペーンメンバーの作成および編集", "マーケティングユーザー機能ライセンス", "アプリケーションのカスタマイズ権限", "キャンペーンの編集権限"], "correct": [1, 3], "explanation": "A. キャンペーンメンバーの作成および編集 - この権限はキャンペーンメンバーレコード自体のデータを作成および編集するためのものであり、キャンペーンメンバーステータスの選択リスト値を設定やカスタマイズする権限は含まれていません。\nB. マーケティングユーザー機能ライセンス - 正解です。ユーザー詳細画面でマーケティングユーザー機能ライセンスを割り当てる(マーケティングユーザーチェックボックスをオンにする)ことで、キャンペーンの作成、編集、削除、および高度なキャンペーン設定(キャンペーンメンバーステータスの値のカスタマイズなど)を行う権限が付与されます。\nC. アプリケーションのカスタマイズ権限 - この権限はシステム全体のカスタマイズを許可する強力な管理者権限です。キャンペーンのステータス値を変更するためだけにマーケティングチームの一般ユーザーへ付与するべきではありません。\nD. キャンペーンの編集権限 - 正解です。キャンペーンメンバーステータスの値を自分でカスタマイズするには、マーケティングユーザー機能ライセンスを持っていることに加えて、その対象となるキャンペーンレコード自体に対する編集権限を持っている必要があります。", "category": "セールス＆マーケティングアプリケーション"}, {"question": "Ursa Majorの新しい営業担当者に、対話の準備が整った評価済みのリードがあります。リードの取引開始プロセスを使用する際、作成できる2つのレコードはどれですか？ 2つ選択してください。", "choices": ["取引先", "キャンペーン", "ケース", "取引先責任者"], "correct": [0, 3], "explanation": "A. 取引先 - 正解です。リードの取引開始プロセスを実行すると、Salesforceはリードに入力されている会社情報に基づいて、新しい取引先レコードを作成するか、既存の取引先レコードにマージすることができます。\nB. キャンペーン - キャンペーンはマーケティング活動を管理するためのオブジェクトであり、リードの取引開始プロセス中に自動的に作成されることはありません。\nC. ケース - ケースは顧客からの問い合わせやサポートの要求を管理するためのオブジェクトであり、リードの取引開始によって作成されるレコードではありません。取引開始時に作成できるのは、取引先、取引先責任者、および商談です。\nD. 取引先責任者 - 正解です。リードの取引開始プロセスを実行すると、Salesforceはリードに入力されている個人情報に基づいて、新しい取引先責任者レコードを作成するか、既存の取引先責任者レコードにマージすることができます。", "category": "セールス＆マーケティングアプリケーション"}, {"question": "Ursa Major Solarのコールセンターマネージャーは、ケースの発生源、ステータス、所有者別にドリルダウンできるケースダッシュボードをエージェントに提供したいと考えています。この要望を満たすために、管理者はダッシュボードに何を追加するべきですか？", "choices": ["ダッシュボード検索条件", "バケット列", "ダッシュボードコンポーネント", "複合グラフ"], "correct": [0], "explanation": "A. ダッシュボード検索条件 - 正解です。ダッシュボード検索条件を使用すると、ユーザーは1つのダッシュボード上で、ケースの発生源、ステータス、所有者などの指定した条件に基づいてデータを動的に絞り込み、異なる視点から分析することができます。\nB. バケット列 - バケット列は、レポート上でカスタムの数式や新しい項目を作成せずに、複数の値を1つのカテゴリに素早くグループ化するための機能です。ダッシュボード全体のデータを絞り込むための機能ではありません。\nC. ダッシュボードコンポーネント - ダッシュボードコンポーネントは、基となるレポートのデータをグラフや表などの視覚的な形式で表示するための構成要素です。コンポーネントを追加するだけでは、ユーザーが動的にデータを絞り込む機能は提供されません。\nD. 複合グラフ - 複合グラフは、棒グラフと折れ線グラフなどを組み合わせて、1つのグラフ上で複数のデータセットを比較するためのダッシュボードコンポーネントの表示形式です。データをドリルダウンするための検索条件を提供するものではありません。", "category": "データ管理＆分析"}, {"question": "cloud kicksの管理者は、ユーザーがsalesforceで繰り返しToDoを追加できないと報告を受けました。ユーザーがこれを行えるようにするために、管理者が使用すべき2つの解決策はどれですか？2つの回答を選択してください。", "choices": ["活動設定で「定期的なToDoの作成を有効化」を有効にする", "共有活動を無効にする", "ページレイアウトに「一連の定期的なToDoの作成」項目を追加する", "ToDoの通知サービスをオンにする"], "correct": [0, 2], "explanation": "A. 活動設定で「定期的なToDoの作成を有効化」を有効にする - 正解です。ユーザーが繰り返しのToDoを作成できるようにするには、まず活動設定で定期的なToDoの作成機能を有効にする必要があります。これにより組織全体で機能が利用可能になります。\nB. 共有活動を無効にする - 共有活動は、1つのToDoや行動を複数の取引先責任者に関連付けるための機能です。定期的なToDoの作成機能とは無関係であり、これを無効にしても繰り返しToDoを作成できるようにはなりません。\nC. ページレイアウトに「一連の定期的なToDoの作成」項目を追加する - 正解です。活動設定で機能を有効にした後、ユーザーが実際にレコード作成画面から定期的なToDoを作成できるように、ToDoのページレイアウトに該当する項目を追加して配置する必要があります。\nD. ToDoの通知サービスをオンにする - ToDoの通知は、ToDoが割り当てられた際にユーザーへリマインダーやアラートを送信する機能です。定期的なToDoを作成する機能そのものとは関係がありません。", "category": "生産性向上とコラボレーション"}, {"question": "dream house realtyのイベントマネージャーは、成功したオープンハウスで獲得した有望なリードを、関連する商談を持つ取引先責任者に変換する必要があります。関連付けられたキャンペーンメンバーの履歴を保持したまま、キャンペーンからこれを達成するにはどうすればよいですか？", "choices": ["リードを削除し、新しい取引先責任者と商談を作成する。", "リードをコピーし、コピーしたレコードを取引先責任者に変換する。", "キャンペーンメンバーの詳細ページからリードの取引を開始する。", "キャンペーンメンバーの詳細ページから取引先責任者を追加する。"], "correct": [2], "explanation": "A. リードを削除し、新しい取引先責任者と商談を作成する。 - 既存のリードを削除してしまうと、そのリードに関連付けられていたキャンペーンメンバーとしての活動履歴やその他のデータがすべて失われてしまいます。履歴を保持するという要件を満たすことができません。\nB. リードをコピーし、コピーしたレコードを取引先責任者に変換する。 - リードをコピーして取引を開始しても、元のリードに紐づいていたキャンペーンメンバーの履歴は新しい取引先責任者に自動的には引き継がれません。また、不要な重複データを作成することになってしまいます。\nC. キャンペーンメンバーの詳細ページからリードの取引を開始する。 - 正解です。キャンペーンメンバーの詳細ページから直接リードの取引を開始することで、リードは取引先、取引先責任者、および商談に変換されます。この方法を使用すると、元のリードに関連付けられていたキャンペーンメンバーの履歴が、新しく作成された取引先責任者レコードにそのまま引き継がれて保持されます。\nD. キャンペーンメンバーの詳細ページから取引先責任者を追加する。 - キャンペーンメンバーの詳細ページから新しい取引先責任者を単に追加するだけでは、既存のリードのデータや履歴を引き継いで変換することはできません。リードの取引開始プロセスを実行する必要があります。", "category": "セールス＆マーケティングアプリケーション"}, {"question": "Ursa Major Solarは、設置するすべてのパネルに1年間の保証を提供しています。設置の詳細と保証情報は「Installation（設置）」というカスタムオブジェクトに取り込まれます。設置レコードは、モバイルアプリから設置担当者によって作成されます。設置が遅れたり問題が発生したりした場合、顧客満足度を高めるための手段として、顧客はより長い保証を受けることがあります。管理者は、保証の有効期限を取り込むためにSalesforceをどのように構成する必要がありますか？", "choices": ["保証有効期限項目のデフォルト値として数式を使用する。", "保証購入から1年後を表示する数式項目を作成する。", "有効期限項目が確実に入力されるように入力規則を追加する。", "モバイルのページレイアウトに保証有効期限項目を含める。"], "correct": [0], "explanation": "A. 保証有効期限項目のデフォルト値として数式を使用する。 - 正解です。保証の有効期限項目のデフォルト値として数式を設定することで、レコード作成時に最初は1年間の保証期間を自動的に入力させることができます。デフォルト値の利点は、後からユーザーが手動でその値を上書きして編集できる点にあるため、顧客満足度向上のために保証期間を延長するという要件を満たすことができます。\nB. 保証購入から1年後を表示する数式項目を作成する。 - 数式項目を使用すると、常に計算された値が表示され、ユーザーが手動で値を上書きして変更することができなくなります。そのため、状況に応じて保証期間を延長するという要件を満たすことができません。\nC. 有効期限項目が確実に入力されるように入力規則を追加する。 - 入力規則は、レコード保存時に項目が入力されているかをチェックしたり、特定の条件を満たしているかを検証したりするためのものです。デフォルトで1年間の保証期間を自動設定する機能を提供するものではありません。\nD. モバイルのページレイアウトに保証有効期限項目を含める。 - ページレイアウトに項目を追加するだけでは、1年間の保証期間の自動入力機能は提供されません。設置担当者が毎回手動で1年後の日付を計算して入力する必要があり、要件に合致しません。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "管理者が組織を強化するためにAppExchangeで見つけることができる2つのソリューションはどれですか？2つの回答を選択してください。", "choices": ["Communities", "Consultants", "Components", "Customers"], "correct": [1, 2], "explanation": "A. Communities - Communities（現在はExperience Cloudサイト）はSalesforceの標準機能プラットフォームであり、組織を強化するためにAppExchangeから直接インストールまたは検索するソリューションではありません。\nB. Consultants - 正解です。AppExchangeには、Salesforceの導入、カスタマイズ、最適化、戦略立案などを専門とする認定コンサルタント（Consultants）のディレクトリがあり、要件に合った専門家を見つけて支援を依頼することができます。\nC. Components - 正解です。AppExchangeでは、Lightningページやアプリケーションの構築に直接追加できる再利用可能なビルディングブロックであるLightningコンポーネント（Components）を見つけて組織にインストールすることができます。\nD. Customers - AppExchangeはSalesforceを拡張するためのアプリケーション、コンポーネント、コンサルティングサービスを提供するビジネス向けのマーケットプレイスであり、顧客（Customers）を見つけるためのプラットフォームではありません。", "category": "設定とセットアップ"}, {"question": "Northern Trail Outfittersの管理者は、10人の新入社員のために新しいユーザーを作成しました。なぜこれらのユーザーはSalesforce組織の取引先オブジェクトにアクセスできないのでしょうか？", "choices": ["ユーザーのプロファイルには取引先の共有ルールが必要です。", "ユーザーのプロファイルには取引先オブジェクトへの権限が必要です。", "ユーザーのロールがロール階層の下位にあります。", "組織の共有直接設定が非公開に設定されています。"], "correct": [1], "explanation": "A. ユーザーのプロファイルには取引先の共有ルールが必要です。 - 共有ルールは、組織の共有直接設定の制限を拡張し、特定のレコードへのアクセス権を他のユーザーやグループに付与するためのものです。オブジェクトそのものへの基本的なアクセス権を付与する機能ではありません。\nB. ユーザーのプロファイルには取引先オブジェクトへの権限が必要です。 - 正解です。ユーザーが特定のオブジェクトのタブを表示したりレコードにアクセスしたりするには、まず割り当てられたプロファイルまたは権限セットで、そのオブジェクトに対する「参照」などのオブジェクトレベルの権限が付与されている必要があります。\nC. ユーザーのロールがロール階層の下位にあります。 - ロール階層は、他のユーザーが所有するレコードに対するレコードレベルのアクセス権を拡張するために使用されるものです。ユーザーがオブジェクト自体に全くアクセスできない根本的な原因ではありません。\nD. 組織の共有直接設定が非公開に設定されています。 - 組織の共有直接設定が非公開であっても、オブジェクトに対する権限さえあれば、ユーザーは少なくとも自身が所有するレコードにはアクセスして表示することができます。オブジェクト全体にアクセスできない理由は、プロファイルでのオブジェクト権限が不足しているためです。", "category": "設定とセットアップ"}, {"question": "Cloud Kicksには、Shipmentsというカスタムオブジェクトがあります。同社は、取引先ページからすべての配送項目を確認したいと考えています。取引先が削除されても、Shipmentsレコードは残るようにする必要があります。管理者はShipmentsと取引先の間にどのような種別の関係を作成するべきですか？", "choices": ["Shipmentsは取引先への参照関係を持つ必要がある。", "取引先はShipmentsへの参照関係を持つ必要がある。", "Shipmentsは取引先への主従関係を持つ必要がある。", "取引先はShipmentsへの主従関係を持つ必要がある。"], "correct": [0], "explanation": "A. Shipmentsは取引先への参照関係を持つ必要がある。 - 正解です。参照関係を使用すると、2つのオブジェクトを関連付けながら、それぞれのレコードの独立性を保つことができます。Shipmentsオブジェクト（子）に取引先（親）への参照関係項目を作成することで、取引先ページの関連リストにShipmentsレコードを表示できるようになります。また、参照関係では親レコードである取引先が削除されても、子レコードであるShipmentsは削除されずに組織に残るため、今回の要件を完全に満たします。\nB. 取引先はShipmentsへの参照関係を持つ必要がある。 - 取引先オブジェクトにShipmentsへの参照関係項目を作成すると、1つのShipmentsレコードに対して複数の取引先が紐づく構造になり、親子の関係性が逆転してしまいます。\nC. Shipmentsは取引先への主従関係を持つ必要がある。 - 主従関係を作成すると取引先ページにShipmentsの関連リストを表示することは可能ですが、主従関係の強い結びつきの仕様により、親レコード（取引先）が削除されると子レコード（Shipments）も自動的に削除されてしまうため、要件を満たしません。\nD. 取引先はShipmentsへの主従関係を持つ必要がある。 - 親子関係の向きが逆になっているだけでなく、主従関係であるため親レコードが削除された際に連動して削除される動作となり、要件を満たしません。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "Ursa Majorは取引先をシルバー、ゴールド、またはプラチナレベルに分類しています。シルバーまたはゴールドパートナーの新しいケースが作成されたとき、それは通常のサポートキューに送信される必要があります。取引先がプラチナレベルの場合、自動的に優先サポートキューに送信される必要があります。管理者はこれを達成するために何を使用するべきですか？", "choices": ["割り当てルール", "ケースルール", "ワークフロールール", "エスカレーションルール"], "correct": [0], "explanation": "A. 割り当てルール - 正解です。割り当てルールは、特定の条件に基づいて、新しく作成されたケースやリードを適切なユーザーまたはキューに自動的に振り分けるために使用されます。取引先のレベルという条件に基づいてケースを異なるサポートキューにルーティングする今回の要件に最適な機能です。\nB. ケースルール - Salesforceには「ケースルール」という名称の独立した標準機能は存在しません。ケースの自動処理やルーティングを制御するための機能は、割り当てルールやエスカレーションルールなどの具体的なルール機能として提供されています。\nC. ワークフロールール - ワークフロールールは、レコードが特定の条件を満たしたときに、項目の自動更新、メールアラート、ToDoの作成などのアクションを実行するための自動化機能です。ケースの担当者やキューへの初期割り当てプロセスには、専用の割り当てルールを使用するのがベストプラクティスです。\nD. エスカレーションルール - エスカレーションルールは、ケースが作成されてから一定時間内に解決または対応されなかった場合に、自動的に別の担当者や上位のキューに再割り当て（エスカレーション）するための機能です。レコードの新規作成時の初期ルーティングを行うための機能ではありません。", "category": "サービス＆サポートアプリケーション"}, {"question": "営業担当者は、プロセスを通じて商談レコードに入力する際、重要な項目を見落としています。担当者は前のフェーズに戻ることはできず、プロセスを前に進める必要があります。管理者はこのニーズに対処するために、どの3つのオプションを使用するべきですか？3つの回答を選択してください。", "choices": ["ガイド付き販売を有効にする。", "入力規則を使用する。", "商談パスを設定する。", "フローを使用して項目を必須としてマークする。", "ページレイアウトで項目を必須としてマークする。"], "correct": [0, 1, 4], "explanation": "A. ガイド付き販売を有効にする。 - 正解です。プロセスに沿って各フェーズで入力すべき重要な項目やガイダンスをユーザーに提示し、重要な情報の入力漏れを防ぐためのサポートを提供します。\nB. 入力規則を使用する。 - 正解です。入力規則を使用すると、特定のフェーズに進む際に必要な項目が入力されているかをシステムで検証し、空白の場合にエラーを出すことができます。また、PRIORVALUE関数などを利用して、以前のフェーズに戻ることを制限することも可能です。\nC. 商談パスを設定する。 - 商談パスを設定すると、フェーズごとの重要な項目や成功へのガイダンスを視覚的に表示することはできますが、パス機能単体では項目の入力を強制したり、前のフェーズに戻ることをシステム的に制限したりすることはできません。\nD. フローを使用して項目を必須としてマークする。 - フローはプロセスの自動化に使用する強力なツールですが、ユーザーインターフェース上で項目自体を必須入力として設定するための機能ではありません。必須入力の制御には、ページレイアウトや入力規則を使用するのが適切です。\nE. ページレイアウトで項目を必須としてマークする。 - 正解です。ページレイアウト上で重要な項目を必須に設定することで、レコードを保存する際に必ずその項目が入力されるように制限でき、入力漏れを根本から防ぐことができます。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "Cloud kicksは、注文で適切な配送詳細が使用されるようにする必要があります。担当者は、取引先の配送先住所が変更されたときに、取引先に関連付けられた選択した注文の配送先住所を更新するための合理化されたソリューションを持つ必要があります。管理者はこの要件をどのように提供する必要がありますか？", "choices": ["取引先の配送先住所が変更されるたびに、すべての未処理の注文の配送先住所を更新する、注文ページの自動起動フロー。", "取引先の配送先住所が変更されるたびに、すべての未処理の注文の配送先住所を更新する、取引先ページの自動起動フロー。", "担当者が関連付けられたすべての未処理の注文で更新された取引先の配送先住所を選択できるようにする、注文ページの画面フロー。", "担当者が関連付けられたすべての未処理の注文で更新された取引先の配送先住所を選択できるようにする、取引先ページの画面フロー。"], "correct": [3], "explanation": "A. 取引先の配送先住所が変更されるたびに、すべての未処理の注文の配送先住所を更新する、注文ページの自動起動フロー。 - 注文ページに配置された自動起動フローは、この要件には適していません。要件では担当者が「選択した注文」を更新することが求められていますが、自動化されたフローではユーザーが対象を選択する対話的なプロセスが含まれません。\nB. 取引先の配送先住所が変更されるたびに、すべての未処理の注文の配送先住所を更新する、取引先ページの自動起動フロー。 - 自動起動フローやレコードトリガフローによってすべての注文を背後で強制的に更新することは可能ですが、担当者が状況に応じて更新する注文を「選択」するという要件を満たすことができません。\nC. 担当者が関連付けられたすべての未処理の注文で更新された取引先の配送先住所を選択できるようにする、注文ページの画面フロー。 - 注文ページに画面フローを配置すると、現在開いている単一の注文のコンテキストで実行されてしまうため、取引先に関連付けられた複数の注文を一覧表示して選択するという一括処理には適していません。\nD. 担当者が関連付けられたすべての未処理の注文で更新された取引先の配送先住所を選択できるようにする、取引先ページの画面フロー。 - 正解です。取引先ページから画面フローを起動することで、担当者にその取引先に関連する未処理の注文の一覧を画面上に提示し、配送先住所を更新したい注文だけをチェックボックス等で選択させる合理的なプロセスを提供できます。これにより要件を完全に満たします。", "category": "自動化"}, {"question": "Ursa Major Solarの管理者は、カスタムレポートタイプを作成し、営業業務チーム向けのレポートを作成しました。しかし、ユーザーは誰もそのレポートにアクセスできません。この問題の原因として考えられる2つのオプションはどれですか？2つの回答を選択してください。", "choices": ["カスタムレポートタイプが開発中である。", "ユーザーのプロファイルに参照アクセス権が欠落している。", "組織がカスタムレポートタイプの制限に達している。", "レポートが非公開フォルダに保存されている。"], "correct": [0, 3], "explanation": "A. カスタムレポートタイプが開発中である。 - 正解です。カスタムレポートタイプの状況が「開発中」に設定されている場合、システム管理者および「カスタムレポートタイプの管理」権限を持つユーザーのみが使用できます。他のユーザーがアクセスできるようにするには、状況を「リリース済」に変更する必要があります。\nB. ユーザーのプロファイルに参照アクセス権が欠落している。 - レポートやダッシュボードへのアクセス権は、プロファイルではなく、レポートが保存されているフォルダの共有設定によって制御されます。プロファイルに個々のレポートへの参照権限を設定する項目はありません。\nC. 組織がカスタムレポートタイプの制限に達している。 - 制限に達すると新しいカスタムレポートタイプを作成できなくなりますが、作成済みのレポートにユーザーがアクセスできない理由にはなりません。\nD. レポートが非公開フォルダに保存されている。 - 正解です。レポートが作成者の個人の非公開フォルダに保存されている場合、他のユーザーはそのレポートを表示したりアクセスしたりすることができません。アクセスを許可するには、適切な権限を持つ公開フォルダまたは共有フォルダに保存する必要があります。", "category": "データ管理＆分析"}, {"question": "Ursa Major Solarは、太平洋時間の担当者向けに営業時間を午前9時から午後5時に設定しています。東部時間の担当者は、サポートをカバーするために営業時間を3時間早く開始するように設定する必要があります。管理者はこの問題をどのように解決すべきですか？", "choices": ["各タイムゾーンの臨時営業時間を設定する。", "現在の営業時間を調整して東部タイムゾーンに対応する。", "タイムゾーンごとに1つの営業時間セットを作成する。", "担当者が手動で営業時間を設定できるようにする。"], "correct": [2], "explanation": "A. 各タイムゾーンの臨時営業時間を設定する。 - 臨時営業時間や休日の設定は、特定の日の営業時間を一時的に変更するためのものであり、恒常的なタイムゾーンの違いに対処するための設定ではありません。\nB. 現在の営業時間を調整して東部タイムゾーンに対応する。 - 既存の営業時間を東部時間に合わせて変更してしまうと、太平洋時間の担当者の基準がずれてしまい、両方の地域の要件を同時に満たすことができなくなります。\nC. タイムゾーンごとに1つの営業時間セットを作成する。 - 正解です。Salesforceでは複数の営業時間を設定でき、それぞれに異なるタイムゾーンを割り当てることができます。地域の担当者ごとに適切な営業時間を適用し、ケースのエスカレーションなどを正確に機能させるためには、タイムゾーンごとに個別の営業時間を作成する必要があります。\nD. 担当者が手動で営業時間を設定できるようにする。 - 営業時間は組織のサポートプロセス全体に影響を与えるため、管理者がシステム設定として定義するものです。各担当者が個別に手動で設定や変更を行うための機能ではありません。", "category": "設定とセットアップ"}, {"question": "Cloud Kicksは、営業ユーザーとマーケティングユーザーに異なる選択リスト値を表示できるようにする必要があります。この要件を満たす2つのオプションはどれですか？2つの回答を選択してください。", "choices": ["1つのページレイアウト、2つのレコードタイプ、1つの選択リスト", "2つのページレイアウト、1つのレコードタイプ、2つの選択リスト", "2つの権限セット、1つのレコードタイプ、1つの選択リスト", "1つのレコードタイプ、2つのプロファイル、1つの選択リスト"], "correct": [0, 3], "explanation": "A. 1つのページレイアウト、2つのレコードタイプ、1つの選択リスト - 正解です。レコードタイプを使用すると、1つの選択リスト項目に対して異なる値を割り当てることができます。営業用とマーケティング用に2つのレコードタイプを用意し、プロファイルごとに割り当てることで、ページレイアウトが1つであってもユーザーごとに異なる選択リスト値を表示するという要件を満たすことができます。\nB. 2つのページレイアウト、1つのレコードタイプ、2つの選択リスト - 営業用とマーケティング用に別々の選択リスト項目を2つ作成し、それぞれ異なるページレイアウトに配置して表示を分けることは物理的には可能ですが、同じ目的の項目が複数存在することになり、データの集計や管理が複雑になるため適切な解決策ではありません。\nC. 2つの権限セット、1つのレコードタイプ、1つの選択リスト - 権限セットはオブジェクトや項目レベルのアクセス権を追加で付与するために使用されるものであり、選択リスト内で利用可能な値そのものをユーザーごとに制御したり切り替えたりする機能は持っていません。\nD. 1つのレコードタイプ、2つのプロファイル、1つの選択リスト - 正解です。プロファイルはユーザーの基本的なアクセス権や割り当てられる設定を制御する基盤となります。営業とマーケティングという2つの異なるプロファイルが存在することで、システム側でそれぞれのユーザー群を識別し、適切なレコードタイプやレイアウトの割り当てを管理して異なる選択リスト値を表示する制御が可能になります。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "Dream House Realtyは、取引先とケースのカテゴリ項目で一貫した選択リスト値を使用し、レコードタイプに応じた値を使用する必要があります。2つ選択してください。", "choices": ["複数選択リスト", "連動選択リスト", "グローバル選択リスト", "カスタム選択リスト"], "correct": [1, 2], "explanation": "A. 複数選択リスト - ユーザーが複数の値を選択できる項目です。複数のオブジェクト間（取引先とケースなど）で一貫した値を共有したり、レコードタイプに基づいて値を制御したりするための主な機能ではありません。\nB. 連動選択リスト - 正解です。Salesforceでは、レコードタイプごとに選択リストで利用可能な値を制御することができます。これにより、レコードタイプに応じた固有の値を使用するという要件を満たすことができます。\nC. グローバル選択リスト - 正解です。グローバル選択リスト（グローバル値セット）を使用すると、複数のオブジェクトや項目間で共通の選択リスト値のセットを共有できます。これにより、取引先とケースのカテゴリ項目で一貫した選択リスト値を使用するという要件を満たします。\nD. カスタム選択リスト - 単一のオブジェクト内の特定の項目に対して作成される標準的な選択リストです。これ単体では、取引先とケースのような複数のオブジェクト間で一貫した値のセットを共有し、一元管理することはできません。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "Cloud KicksのユーザーがSalesforceへのログインで問題を抱えています。ユーザーは管理者にパスワードのリセットを依頼しました。管理者がユーザーのパスワードをリセットする際に考慮すべき2つの事項はどれですか？2つ選択してください。", "choices": ["パスワードをリセットすると、ユーザーのパスワードポリシーが変更されます。", "シングルサインオンユーザーは、パスワードを忘れた場合のリンクを使用して自分のパスワードをリセットできます。", "ロックアウトされたユーザーのパスワードをリセットすると、ユーザーのアカウントのロックが自動的に解除されます。", "パスワードをリセットした後、ユーザーがSalesforceに正常にログインするためにデバイスの有効化が求められる場合があります。"], "correct": [2, 3], "explanation": "A. パスワードをリセットすると、ユーザーのパスワードポリシーが変更されます。 - パスワードをリセットしても、パスワードポリシーは変更されません。パスワードの長さや有効期限などのパスワードポリシーは、ユーザーのプロファイルレベルで設定および管理されます。\nB. シングルサインオンユーザーは、パスワードを忘れた場合のリンクを使用して自分のパスワードをリセットできます。 - シングルサインオン（SSO）を使用しているユーザーは、Salesforceのログイン画面にあるパスワードを忘れた場合のリンクを使用してパスワードをリセットすることはできません。SSOユーザーのパスワードや認証は、企業のアイデンティティプロバイダー（IdP）側で一元管理されます。\nC. ロックアウトされたユーザーのパスワードをリセットすると、ユーザーのアカウントのロックが自動的に解除されます。 - 正解です。ログイン試行の失敗回数の上限を超えてアカウントがロックアウトされた場合、管理者がパスワードをリセットすることで、パスワードが再設定されると同時にアカウントのロックも自動的に解除されます。\nD. パスワードをリセットした後、ユーザーがSalesforceに正常にログインするためにデバイスの有効化が求められる場合があります。 - 正解です。パスワードをリセットした後でも、ユーザーが未知のブラウザやデバイス、または指定された信頼済みIP範囲外からログインを試みる場合、セキュリティのためにID検証（デバイスの有効化）が要求されることがあります。", "category": "設定とセットアップ"}, {"question": "Cloud Kicks (CK) は、中古靴店および中古自転車専門店と提携しています。CKには、取引先に関連するオープンなケースの数を数えるために週に1回実行したい自動化されたビジネスプロセスがあります。管理者はこのビジネスプロセスを自動化するために何を推奨すべきでしょうか？", "choices": ["アウトバウンドメッセージを使用したワークフロールールを作成する。", "プロセスビルダーでスケジュール済みプロセスを設定する。", "フロービルダーでスケジュール済みフローを設定する。", "編集時に取引先を更新するプロセスを使用する。"], "correct": [2], "explanation": "A. アウトバウンドメッセージを使用したワークフロールールを作成する。 - ワークフロールールはレコードの作成や編集時などをトリガーとして実行されるため、特定のスケジュール（週に1回など）で自律的かつ定期的に実行することはできません。また、アウトバウンドメッセージは外部システムへのXMLメッセージ送信に使用される機能であり、Salesforce内でのレコードの集計（ケースのカウント）には適していません。\nB. プロセスビルダーでスケジュール済みプロセスを設定する。 - プロセスビルダーはレコードの変更やプラットフォームイベントなどをトリガーとして起動するため、週に1回などの指定したスケジュールで定期的にバッチ処理のように実行させることはできません。また、Salesforceはプロセスビルダーを非推奨としており、新規の自動化にはフローを使用することが強く推奨されています。\nC. フロービルダーでスケジュール済みフローを設定する。 - 正解です。フロービルダーのスケジュールトリガーフロー（スケジュール済みフロー）を使用すると、指定した頻度（毎日、毎週など）や特定の時間で自動的にバックグラウンド処理を実行させることができます。これにより、週に1回取引先に関連するケースをカウントするという自動化の要件を完全に満たすことができます。\nD. 編集時に取引先を更新するプロセスを使用する。 - この方法では、取引先レコードがユーザーやシステムによって編集されたタイミングでしかプロセスが実行されません。「週に1回実行する」という定期的なスケジュールの要件を満たすことができないため不適切です。", "category": "自動化"}, {"question": "Northern Trail Outfittersは、従業員がSalesforceアカウントに対して安全で適切なパスワードを選択することを推奨したいと考えています。管理者が設定すべき3つのパスワードポリシーはどれですか？3つ選択してください。", "choices": ["無効なログインの最大試行回数", "禁止されたパスワード値", "パスワードマネージャーアプリの使用の要求", "パスワードの複雑さの要件", "パスワードの有効期限が切れるまでの日数"], "correct": [0, 3, 4], "explanation": "A. 無効なログインの最大試行回数 - 正解です。無効なログイン試行の最大回数を設定することで、パスワードの推測による不正アクセスやブルートフォース攻撃を防ぎ、アカウントのセキュリティを高めることができます。\nB. 禁止されたパスワード値 - Salesforceの標準のパスワードポリシー設定には、特定の単語や値を禁止パスワードとして直接指定する機能は用意されていません。\nC. パスワードマネージャーアプリの使用の要求 - Salesforceの標準機能では、ユーザーに対して特定のサードパーティ製パスワードマネージャーアプリの使用を強制する設定項目はありません。\nD. パスワードの複雑さの要件 - 正解です。アルファベットと数字、あるいは特殊文字を組み合わせるなどの要件を設定することで、推測されにくい強力なパスワードの作成をユーザーに促すことができます。\nE. パスワードの有効期限が切れるまでの日数 - 正解です。パスワードに有効期限（90日など）を設定することで、定期的なパスワード変更を強制し、長期間同じパスワードを使用することによるセキュリティリスクを軽減できます。", "category": "設定とセットアップ"}, {"question": "Universal Containersは、販売代理店パートナーが購入する商品に割引価格を提供したいと考えています。管理者はこの要件をどのように設定すべきですか？", "choices": ["商談にPartner_Discount__c項目を追加する。", "販売代理店パートナー用の別個の商品を構築する。", "別の商談レコードタイプを使用する。", "販売代理店パートナー用に別個の価格ブックを作成する。"], "correct": [3], "explanation": "A. 商談にPartner_Discount__c項目を追加する。 - カスタム項目を追加して商談全体で割引を計算することは可能ですが、複数の商品に対してそれぞれ異なる割引価格を適用するような複雑な価格管理を行うための標準的なベストプラクティスではありません。\nB. 販売代理店パートナー用の別個の商品を構築する。 - 同じ商品に対して対象者別に異なる商品レコードを作成してしまうと、商品マスタが重複し、在庫管理やレポート作成が非常に複雑になるため推奨されません。\nC. 別の商談レコードタイプを使用する。 - レコードタイプは、ユーザーのプロファイルに応じてページレイアウトや選択リストの表示値を制御するための機能であり、商品ごとの価格を直接設定または変更するものではありません。\nD. 販売代理店パートナー用に別個の価格ブックを作成する。 - 正解です。Salesforceの標準機能である価格ブックを使用することで、同一の商品に対して顧客セグメント（この場合は販売代理店パートナー）ごとに異なる価格リストを作成し、適切な割引価格を柔軟に管理することができます。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "Cloud Kicks (CK) のサポート担当者は、ケースをクローズしようとすると、ケース状況の選択リストに「クローズ」オプションが表示されないと報告しています。CKは管理者に解決策を見つけるよう依頼しました。サポート担当者が指定された選択リストに「クローズ」オプションを表示できないのはなぜですか？", "choices": ["ケースのレコードタイプで、選択リスト値として「クローズ」が欠落している。", "ケースをクローズするには、ケースのクローズページレイアウトを使用する必要がある。", "ケース状況項目のクローズ済みの状況を表示するチェックボックスがデフォルトに設定されている。", "使用されているサポートプロセスで、状況の選択肢から「クローズ」が省略されている。"], "correct": [3], "explanation": "A. ケースのレコードタイプで、選択リスト値として「クローズ」が欠落している。 - レコードタイプは多くの選択リスト値を制御しますが、ケースの「状況」項目は例外であり、レコードタイプではなくサポートプロセスによって直接制御されます。\nB. ケースをクローズするには、ケースのクローズページレイアウトを使用する必要がある。 - クローズページレイアウトはケースをクローズする際のアクションや画面表示を制御するために使用されますが、状況選択リストに特定の値（クローズなど）が表示されるかどうかを決定する根本的な設定ではありません。\nC. ケース状況項目のクローズ済みの状況を表示するチェックボックスがデフォルトに設定されている。 - サポート設定にあるクローズされた状況をケース状況項目に表示する設定は、主にセルフサービスポータルなどの特定の表示に影響を与えるものであり、社内ユーザーのレコード編集時の状況選択リストの値を制御するものではありません。\nD. 使用されているサポートプロセスで、状況の選択肢から「クローズ」が省略されている。 - 正解です。ケースオブジェクトの「状況」項目の選択リストに表示される値は、サポートプロセスによって制御されます。サポートプロセス内で「クローズ」の値が選択済みの値として追加されていない場合、ユーザーはそのサポートプロセスに関連付けられたレコードタイプを使用してケースをクローズすることができません。", "category": "サービス＆サポートアプリケーション"}, {"question": "Ursa Major Solarは、ユーザーの経費精算プロセスをガイドし、提出、ルーティング、および承認を簡素化したいと考えています。管理者はこのソリューションを構築するために、どの2つのツールを使用するべきですか？2つ選択してください。", "choices": ["入力規則", "フロービルダー", "承認プロセス", "クイックアクション"], "correct": [1, 2], "explanation": "A. 入力規則 - 入力規則は、ユーザーが入力したデータが特定の条件を満たしているか、レコードを保存する前に確認する機能です。経費精算のような複数ステップのプロセスをガイドしたり、レコードを特定の担当者にルーティングしたりすることはできません。\nB. フロービルダー - 正解です。フロービルダーの画面フローを使用することで、ユーザーに対してウィザード形式のガイド付き入力画面を提供し、必要な情報の入力と提出のプロセスを簡素化することができます。\nC. 承認プロセス - 正解です。承認プロセスを使用することで、提出された経費精算レコードを適切な承認者（マネージャーなど）に自動的にルーティングし、承認または却下の一連の手順を管理・自動化する要件を満たすことができます。\nD. クイックアクション - クイックアクションは、レコードの作成や更新、活動の記録などを素早く行うための機能です。単一のステップでアクションを完了させるのには便利ですが、画面フローのような複数ステップのガイド付きプロセスを構築したり、承認のためのルーティングを行ったりすることには適していません。", "category": "自動化"}, {"question": "Universal Containersは、サービスチームが商談レコードにアクセスするのを防ぎたいと考えています。サービスユーザーは商談のリストビューにはアクセスできませんが、検索を通じて商談レコードを見つけることができます。アクセスを完全に制限するために、管理者はどのオプションを調整する必要がありますか？", "choices": ["レコード設定と検索インデックス", "権限とタブの表示設定", "アプリケーション権限と検索語", "ページレイアウトと項目レベルセキュリティ"], "correct": [1], "explanation": "A. レコード設定と検索インデックス - Salesforceにはユーザーのアクセスを直接制御するレコード設定と検索インデックスという標準的なアクセス制御の組み合わせは存在しません。検索インデックスを直接変更して特定のユーザーのアクセス制限を行うことはできません。\nB. 権限とタブの表示設定 - 正解です。リストビューにアクセスできないのに検索でレコードが見つかる場合、ユーザーはオブジェクトへの参照権限を持っているものの、タブが非表示に設定されている状態と考えられます。レコードへのアクセスを完全に制限するには、プロファイルまたは権限セットで該当オブジェクトに対する権限そのものを取り消す必要があります。\nC. アプリケーション権限と検索語 - アプリケーション権限は特定のアプリケーションへのアクセスを制御するものであり、オブジェクト単位のレコードアクセスを完全に防ぐものではありません。また、管理者が検索語を調整することでユーザーのアクセスを制限するような機能はありません。\nD. ページレイアウトと項目レベルセキュリティ - ページレイアウトや項目レベルセキュリティは、ユーザーがレコードにアクセスした後に表示される特定の項目や画面レイアウトを制御するものです。レコードそのものへのアクセスや、検索結果への表示を根本的に制限するための設定ではありません。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "プロファイルのどの設定を使用すると、すべてのアプリケーションランチャーでタブを非表示にしたり、任意のアプリケーションで表示可能にしたりしつつ、通常はこのタブの下にあるレコードを引き続きユーザーに表示させることができますか？", "choices": ["オブジェクト権限", "アプリケーション権限", "組織の共有設定", "タブの設定"], "correct": [3], "explanation": "A. オブジェクト権限 - オブジェクト権限は、ユーザーがレコードに対して実行できるアクション（参照、作成、編集、削除など）を制御するものです。タブ自体の表示や非表示を制御する機能ではありません。\nB. アプリケーション権限 - アプリケーション権限は、システム機能や特定のアプリケーション全体へのアクセスを制御するものです。個別のオブジェクトタブの表示設定を直接制御するものではありません。\nC. 組織の共有設定 - 組織の共有設定は、ユーザーが所有していないレコードに対するベースラインのアクセスレベルを定義するものです。タブの表示を制御する設定ではありません。\nD. タブの設定 - 正解です。プロファイルのタブの設定を「タブを隠す」にすると、アプリケーションランチャーやナビゲーションバーからそのタブは非表示になります。しかし、オブジェクトに対する「参照」権限が残っていれば、ユーザーは検索や他のレコードの関連リストなどを通じて引き続きレコードを表示することができます。", "category": "設定とセットアップ"}, {"question": "Universal Containers (UC) の顧客から、サポートケースへの対応が遅すぎるというフィードバックが寄せられました。UCは、未割り当てのまま2時間以上経過したすべてのケースを緊急ケースキューに送信し、サポートマネージャーにアラートを送信したいと考えています。この要件を満たすために、管理者はどの機能を設定する必要がありますか？", "choices": ["ケースのスケジュール済みレポート。", "ケースダッシュボードの更新。", "ケースのエスカレーションルール。", "ケースの割り当てルール。"], "correct": [2], "explanation": "A. ケースのスケジュール済みレポート。 - レポートを定期的にスケジュールしてメールなどで送信することは可能ですが、未割り当てのまま特定の時間が経過したレコードを自動的に別のキューに再割り当てしたり、アラートをリアルタイムで送信したりするアクションやルーティングの機能ではありません。\nB. ケースダッシュボードの更新。 - ダッシュボードのスケジュール済み更新は、定義された間隔で最新のデータを視覚化するための機能です。特定の条件を満たしたケースの所有権の変更や特定ユーザーへのアラート送信といった、レコードに対する自動化アクションを実行するものではありません。\nC. ケースのエスカレーションルール。 - 正解です。エスカレーションルールを使用すると、ケースが作成されてから一定時間（この場合は2時間）経過しても特定の条件（未割り当てなど）を満たしている場合に、ケースを別のユーザーや緊急ケースキューに自動的に再割り当てし、同時にマネージャーにメールアラートを送信するように設定することができます。\nD. ケースの割り当てルール。 - 割り当てルールは、ケースが手動で作成された時点、またはWeb-to-ケースやメール-to-ケースなどのチャネルから自動生成された直後に、特定の条件に基づいて所有者をキューやユーザーに割り当てるための機能です。作成から「2時間経過後」といった時間ベースの遅延アクションを実行することはできません。", "category": "サービス＆サポートアプリケーション"}, {"question": "Northern Trail Outfittersは、各マーケティングキャンペーンからどれだけの収益が創出されたかを計算したいと考えています。管理者はこの情報をどのように提供するべきですか？", "choices": ["標準のキャンペーンレポートを設計し、キャンペーン項目の成約した商談の値を追加する。", "キャンペーンレコードを更新するために定期的なデータジョブを実行する。", "キャンペーンに商談の積み上げ集計項目を作成する。", "キャンペーンに合計値項目を追加し、商談が成約したときに値を更新するワークフロールールを使用する。"], "correct": [2], "explanation": "A. 標準のキャンペーンレポートを設計し、キャンペーン項目の成約した商談の値を追加する。 - レポート上で数値を集計して表示することは可能ですが、キャンペーンレコードの画面上で直接、各キャンペーンの収益を確認できるようにする方がユーザーにとって直感的です。システム内で自動計算できる標準機能があるため、レポートのみで解決するアプローチは最適ではありません。\nB. キャンペーンレコードを更新するために定期的なデータジョブを実行する。 - データジョブを定期的に実行して数値を更新する方法は、データがリアルタイムで反映されないという欠点があります。また、不要なメンテナンスの手間やシステム負荷がかかるため、標準の自動化機能を使用するべきです。\nC. キャンペーンに商談の積み上げ集計項目を作成する。 - 正解です。キャンペーンと商談の間には標準でリレーションがあり、キャンペーンオブジェクトには関連付けられた商談の金額（成約した商談の総額など）を自動的に合計するための積み上げ集計項目が存在します。これを使用することで、キャンペーンから生み出された収益をリアルタイムかつ正確に計算し、表示することができます。\nD. キャンペーンに合計値項目を追加し、商談が成約したときに値を更新するワークフロールールを使用する。 - ワークフロールールは、子レコード（この場合は商談）の金額を合計して親レコード（キャンペーン）に反映させるといった、複数レコードをまたぐ集計処理を行う機能を持っていません。このような集計要件には積み上げ集計項目を使用するのが適切な方法です。", "category": "セールス＆マーケティングアプリケーション"}, {"question": "Ursa Major Solarは、どのマーケティング活動がチームの商談獲得に役立っているかを知りたいと考えています。これらのインサイトを提供するために、管理者は何を設定するべきですか？", "choices": ["キャンペーン階層", "キャンペーンインフルエンス", "カスタムリード項目の対応付け", "リストメール活動"], "correct": [1], "explanation": "A. キャンペーン階層 - キャンペーン階層は、関連するキャンペーンをグループ化し、親キャンペーンと子キャンペーンの関係を構築して全体的な成果を集計するための機能です。特定の商談の成約にどのキャンペーンが直接的に貢献したかを追跡する機能ではありません。\nB. キャンペーンインフルエンス - 正解です。キャンペーンインフルエンス機能を使用すると、商談を1つまたは複数のキャンペーンに関連付け、どのマーケティング活動（キャンペーン）がその商談の成約に影響を与え、収益を生み出したかを追跡および分析することができます。\nC. カスタムリード項目の対応付け - リードのカスタム項目を、リードの取引開始時に取引先、取引先責任者、または商談の項目に対応付けるための機能です。マーケティング活動が商談獲得にどのように影響したかを分析するための機能ではありません。\nD. リストメール活動 - リストメール活動は、取引先責任者やリードのリストに対して一括メールを送信し、その活動履歴を追跡する機能です。個別のメール送信履歴は確認できますが、商談の成約に寄与したマーケティング活動全体のインサイトを提供する直接的な機能ではありません。", "category": "セールス＆マーケティングアプリケーション"}, {"question": "管理者は、ユーザーが顧客を失ったときに入力するフォームをSalesforceで作成したいと考えています。この目標を達成するためのウィザードの作成をサポートする自動化ツールはどれですか？", "choices": ["プロセスビルダー", "承認プロセス", "アウトバウンドメッセージ", "フロービルダー"], "correct": [3], "explanation": "A. プロセスビルダー - プロセスビルダーはレコードの作成や更新をトリガーとしてバックグラウンドで自動化処理を行うツールであり、ユーザーがデータを入力するための画面（ウィザードやフォーム）を作成する機能は備えていません。\nB. 承認プロセス - 承認プロセスは、レコードを適切な担当者に転送し、承認または却下の一連の手順を管理・自動化するための機能です。ユーザーが情報を入力するカスタムフォームやウィザードを作成するためのツールではありません。\nC. アウトバウンドメッセージ - アウトバウンドメッセージは、ワークフロールールや承認プロセスなどからトリガーされ、外部システムに指定した情報をXMLメッセージとして送信するための機能です。画面作成やウィザード作成の機能はありません。\nD. フロービルダー - 正解です。フロービルダーの画面フローを使用することで、ユーザーにステップバイステップで情報を入力させるカスタム画面（ウィザードやフォーム）を作成し、入力されたデータに基づいてSalesforce内のレコード処理を自動化することができます。", "category": "自動化"}, {"question": "DreamHouse Realtyは、戸建てとマンションの両方の販売のために定期的にオープンハウスを開催しています。マンションのオープンハウスの場合、いくつか追加のステップを踏む必要があります。エージェントは、管理組合に申請を提出し、承認を得ることができるようにする必要があります。管理者は、マンションのオープンハウスレコードを作成する際にのみ、これらの追加ステップが表示されるようにするにはどうすればよいですか？", "choices": ["1つのページレイアウトを作成する。レコードタイプを使用して、適切な状況の選択リスト値が表示されるようにする。", "2つのページレイアウトを作成する。ビジネスプロセスとレコードタイプを使用して、適切な選択リスト値を表示する。", "1つのページレイアウトを作成する。ビジネスプロセスを使用して、適切な状況の選択リスト値が表示されるようにする。", "2つのページレイアウトを作成する。1つには戸建て状況項目、もう1つにはマンション状況項目を含める。"], "correct": [1], "explanation": "A. 1つのページレイアウトを作成する。レコードタイプを使用して、適切な状況の選択リスト値が表示されるようにする。 - レコードタイプを使用して選択リストの値を制御することは可能ですが、ページレイアウトが1つしかない場合、マンション固有の追加ステップに必要な項目や関連リストなどを、戸建てとマンションで出し分けることができません。\nB. 2つのページレイアウトを作成する。ビジネスプロセスとレコードタイプを使用して、適切な選択リスト値を表示する。 - 正解です。戸建て用とマンション用の2つのページレイアウトを作成することで、マンションのレコードタイプが選択された場合にのみ追加のステップに関する項目を表示させることができます。さらに、レコードタイプを割り当てることで、それぞれに適した選択リストの値を制御することが可能になります。\nC. 1つのページレイアウトを作成する。ビジネスプロセスを使用して、適切な状況の選択リスト値が表示されるようにする。 - ビジネスプロセスは特定のオブジェクトのライフサイクルを管理するために使用されますが、Aの選択肢と同様に、ページレイアウトが1つではレコード作成時に表示する項目や画面構成を要件に合わせて切り替えることができません。\nD. 2つのページレイアウトを作成する。1つには戸建て状況項目、もう1つにはマンション状況項目を含める。 - 2つのページレイアウトを作成する点は適切ですが、類似の目的を持つ別々のカスタム項目（状況項目）を作成することはデータ構造上推奨されません。同じ状況項目を共有し、レコードタイプによって選択可能な値を制御するのがベストプラクティスです。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "管理者は、予定されている重要な更新を確認しました。管理者はこの重要な更新の有効化をどのように進めるべきですか？", "choices": ["Sandboxで重要な更新を有効化する。", "重要な更新が自動的に有効化されるのを待つ。", "本番環境で重要な更新を有効化する。", "Sandboxで重要な更新が自動的に有効化されるのを待つ。"], "correct": [0], "explanation": "A. Sandboxで重要な更新を有効化する。 - 正解です。重要な更新（リリース更新）はシステムの動作やセキュリティに大きな変更をもたらす可能性があるため、本番環境に適用する前に、まずSandbox環境で手動で有効化し、既存のカスタマイズや業務プロセスに影響がないかを徹底的にテストすることが推奨されるベストプラクティスです。\nB. 重要な更新が自動的に有効化されるのを待つ。 - 自動有効化の期日まで待つと、事前のテストが行われないまま本番環境に変更が直接適用されてしまい、既存の機能が予期せず動作しなくなるリスクがあるため推奨されません。\nC. 本番環境で重要な更新を有効化する。 - Sandboxなどのテスト環境での事前検証なしに、直接本番環境で重要な更新を有効化すると、ユーザーの日常業務に重大な障害を引き起こす危険性があります。\nD. Sandboxで重要な更新が自動的に有効化されるのを待つ。 - Sandboxでテストを行うこと自体は正しいですが、自動有効化を待つのではなく、管理者が検証スケジュールに合わせて主体的に手動で有効化し、十分なテスト期間を確保するべきです。", "category": "設定とセットアップ"}, {"question": "別の財務システムからレコードをインポートして更新する際、管理者は識別子として何を使用するべきですか？", "choices": ["自動採番項目", "外部ID", "リッチテキスト項目", "レコードID"], "correct": [1], "explanation": "A. 自動採番項目 - 自動採番項目は、Salesforce内でレコードが作成されるたびに自動的に一意の番号を割り当てる読み取り専用の項目です。データインポート時に外部システムのレコードとマッチングするための識別子として使用することはできません。\nB. 外部ID - 正解です。外部ID属性を持つカスタム項目を作成することで、外部システム（別の財務システムなど）の一意の識別子をSalesforceに保存できます。データインポートウィザードやデータローダを使用してレコードをインポートおよび更新（Upsert）する際、この外部IDを照合キーとして使用し、既存のレコードを正確に特定して更新することができます。\nC. リッチテキスト項目 - リッチテキスト項目は、書式設定されたテキストや画像などを保存するための項目です。データのインポートや更新時にレコードを特定するための一意の識別子として設定することはできません。\nD. レコードID - レコードIDはSalesforceが各レコードに自動的に割り当てる内部的な一意の識別子です。Salesforceから一度エクスポートしたデータを更新（Update）して戻す際には使用できますが、別の外部システムからデータを連携してインポートする際の外部用の識別子としては適していません。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "営業マネージャーは、商談のフェーズに基づいて重要な値を表示するために実装できる機能を知りたいと考えています。管理者は要件を満たすためにどのツールを使用するべきですか？", "choices": ["動的フォーム", "パスの重要な項目", "商談プロセス", "ワークフロールール"], "correct": [1], "explanation": "A. 動的フォーム - 動的フォームは、Lightningレコードページ上で項目やセクションの表示と非表示を特定の条件に基づいて制御できる機能ですが、商談プロセスの視覚的なガイドとして特定の段階の重要な情報を強調表示する「パス」の目的とは異なります。\nB. パスの重要な項目 - 正解です。パス機能を使用すると、商談の各フェーズにおいて入力や確認が必要な「重要な項目」を最大5つまで指定することができます。これにより、担当者が該当するフェーズに到達した際に、重要な値がパスのすぐ下の画面上に強調して表示されます。\nC. 商談プロセス - 商談プロセスは、特定のレコードタイプに関連付けられる商談フェーズの選択リスト値を定義および制御するための機能です。フェーズに応じて特定の項目値を画面に表面化させる役割は持っていません。\nD. ワークフロールール - ワークフロールールは、特定の条件に基づいて項目の自動更新、メールアラート、ToDoの割り当てなどのバックグラウンド処理を実行するための自動化機能です。画面のUI上で重要な項目を目立たせて表示するためのツールではありません。", "category": "自動化"}, {"question": "Cloud Kicks (CK) は、商談が製品エンジニアリングの担当者によってレビューされるべきかどうかを、Needs Reviewというチェックボックス項目で取り込みます。CKには、商談にProduct Typeの選択リスト項目もあります。営業担当者が商談を保存するとき、Product Typeを選択するか、Needs Reviewボックスにチェックを入れる必要があります。管理者はこれを達成するために何を使用するべきですか？", "choices": ["保存前フロー", "入力規則", "ワークフロールール", "必須項目"], "correct": [1], "explanation": "A. 保存前フロー - 保存前フローはレコードがデータベースに保存される前に項目値を自動的に更新するためには有用ですが、ユーザーに対して特定の項目の入力を強制したり、条件に応じてエラーメッセージを表示したりするための最適なツールではありません。\nB. 入力規則 - 正解です。入力規則を使用すると、ユーザーがレコードを保存する前に特定の条件（この場合は商品タイプの選択、またはレビューが必要チェックボックスのオンのいずれかが満たされているか）を評価する数式を作成できます。条件が満たされていない場合にエラーメッセージを表示して保存をブロックし、ユーザーに適切な入力を促すことができます。\nC. ワークフロールール - ワークフロールールは、特定の条件を満たしたときに項目の自動更新やメールアラートなどのアクションを実行する機能です。ユーザーの入力を検証してレコードの保存をブロックする機能は持っていません。\nD. 必須項目 - ページレイアウトや項目レベルで項目を必須に設定すると、レコード保存時に常にその項目への入力が求められます。今回のような、どちらか一方が入力されていればよいという条件付きの必須ロジックを実装することはできません。", "category": "自動化"}, {"question": "cloud kicksの商談が成約したときに、会社は更新商談を自動的に作成したいと考えています。管理者がこの要請を達成するために使用すべき2つの自動化ツールはどれですか？2つの回答を選択してください。", "choices": ["承認プロセス", "Flow Builder", "ワークフロールール", "プロセスビルダー"], "correct": [1, 3], "explanation": "A. 承認プロセス - 承認プロセスは、特定のレコードに対する承認申請の経路やステップを自動化するための機能です。新しい商談レコードを自動的に作成する機能は持っていません。\nB. Flow Builder - 正解です。フロービルダーはSalesforce内で複雑なビジネスプロセスを自動化するための強力なツールです。商談が成約したタイミングでトリガーされるフローを作成し、新しい更新商談レコードを自動的に作成することができます。\nC. ワークフロールール - ワークフロールールは、特定の条件を満たしたときに項目の自動更新、メールアラート、ToDoの割り当て、アウトバウンドメッセージなどのアクションを実行するための機能です。新しいレコードを作成することはできません。\nD. プロセスビルダー - 正解です。プロセスビルダーは、レコードが作成または編集されたときに自動的に特定のアクションをトリガーできるツールです。商談が成約したという条件に基づいて、新しいレコードを作成するアクションを設定することができるため、この要件を満たすことができます。", "category": "自動化"}, {"question": "Cloud Kicksのサポートエージェントは、ケースを解決するためのリソースを見つけるのに時間をかけすぎています。エージェントは、ケースのページレイアウトからドキュメントや類似のケースを見つけるための、より効率的な方法を必要としています。管理者はこの要件を満たすためにどうすればよいですか？", "choices": ["一般的なケースの解決策を記録するためのカスタムオブジェクトを作成する。", "インタビューフローを使用してケースの詳細を記録する。", "類似のケースを探すために、ユーザーをグローバル検索に誘導する。", "記事とデータカテゴリを使用してナレッジを設定する。"], "correct": [3], "explanation": "A. 一般的なケースの解決策を記録するためのカスタムオブジェクトを作成する。 - 一般的なケースの解決策を記録するためにカスタムオブジェクトを作成することは可能ですが、エージェントがケースのページレイアウトから直接類似のケースやドキュメントを検索して参照するという、効率的な情報検索の要件を満たすための標準的なベストプラクティスではありません。\nB. インタビューフローを使用してケースの詳細を記録する。 - フローはユーザーからデータを収集したりビジネスプロセスを自動化したりするのには役立ちますが、過去の解決策やドキュメントを検索してエージェントに提示するためのデータベースとしての機能は提供しません。\nC. 類似のケースを探すために、ユーザーをグローバル検索に誘導する。 - グローバル検索を使用すると組織全体のデータを検索できますが、ケースのページレイアウト内で現在のレコードに関連するドキュメントや類似ケースを直接かつ自動的に提示する機能ではないため、エージェントの作業効率を最大化するソリューションとしては不十分です。\nD. 記事とデータカテゴリを使用してナレッジを設定する。 - 正解です。Salesforceナレッジを有効にし、記事とデータカテゴリを適切に設定することで、エージェントはケースのページレイアウトに配置されたナレッジコンポーネントから直接、関連するドキュメントや過去の解決策をすばやく検索して参照できるようになります。これによりケース解決の効率が大幅に向上します。", "category": "サービス＆サポートアプリケーション"}, {"question": "Universal Containersは、取引先がセールスコンソールとサービスコンソールで表示されるときに、異なるLightningページが表示されることを必要としています。管理者はこの要件をどのように満たすべきですか？", "choices": ["ページレイアウトの割り当てを更新する。", "複数のレコードタイプを定義する。", "Lightningページをアプリケーションのデフォルトとして割り当てる。", "異なるユーザープロファイルを作成する。"], "correct": [2], "explanation": "A. ページレイアウトの割り当てを更新する。 - ページレイアウトは、レコードの詳細や関連リストの項目配置を制御する機能ですが、Lightningページ全体の表示をアプリケーションごとに切り替えるための設定ではありません。\nB. 複数のレコードタイプを定義する。 - レコードタイプは、異なるビジネスプロセスや選択リスト値、ページレイアウトを提供するために使用されますが、アプリケーションに基づいてLightningページを動的に切り替える要件を満たすための直接的な設定ではありません。\nC. Lightningページをアプリケーションのデフォルトとして割り当てる。 - 正解です。LightningアプリケーションビルダーでLightningページを有効化する際、アプリケーションのデフォルトとしてページを割り当てることで、特定のアプリケーション（この場合はセールスコンソールやサービスコンソール）を使用しているときに専用のLightningレコードページを表示させることができます。\nD. 異なるユーザープロファイルを作成する。 - プロファイルはユーザーのアクセス権や権限を制御するものです。プロファイルごとにLightningページを割り当てることは可能ですが、同一ユーザーが異なるコンソールを開いた際に表示を切り替えるという今回の要件には、アプリケーションのデフォルト割り当てを使用するのが適切です。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "Universal Containerの管理者は、salesforceにブランディングを追加したいと考えています。管理者が留意すべき2つの考慮事項はどれですか？2つの回答を選択してください。", "choices": ["一度に有効にできるテーマは1つだけであり、テーマは組織全体に適用されます。", "テーマはsalesforce classicおよびsalesforceモバイルアプリケーションに適用されます。", "組み込みのテーマから、最大150のカスタムテーマを作成、変更、またはコピーできます。", "Chatter外部ユーザーには、組み込みのLightningテーマのみが表示されます。"], "correct": [0, 3], "explanation": "A. 一度に有効にできるテーマは1つだけであり、テーマは組織全体に適用されます。 - 正解です。組織で一度に有効にできるテーマは1つのみで、そのテーマは組織全体のユーザーに適用されます。プロファイルやユーザーごとに異なるテーマを割り当てることはできません。\nB. テーマはsalesforce classicおよびsalesforceモバイルアプリケーションに適用されます。 - 組織のテーマおよびブランド設定はLightning Experienceにのみ適用されます。Salesforce Classicやモバイルアプリケーションの画面には適用されません。\nC. 組み込みのテーマから、最大150のカスタムテーマを作成、変更、またはコピーできます。 - カスタムテーマは組織につき最大300個まで作成、変更、またはコピーすることができます。150個ではありません。\nD. Chatter外部ユーザーには、組み込みのLightningテーマのみが表示されます。 - 正解です。Chatter外部ユーザーがログインした場合、組織で設定されたカスタムテーマは適用されず、常にデフォルトの組み込みのLightningテーマが表示されます。", "category": "生産性向上とコラボレーション"}, {"question": "Ursa Major Solarの管理者は、顧客の保証ケース用に新しいレコードタイプを作成しました。ユーザーに新しいレコードタイプを表示するために、管理者が使用すべき2つの割り当てはどれですか？2つの回答を選択してください。", "choices": ["プロファイルの割り当て", "ロールの割り当て", "アプリケーションマネージャーの割り当て", "ページレイアウトの割り当て"], "correct": [0, 3], "explanation": "A. プロファイルの割り当て - 正解です。ユーザーが新しいレコードタイプを選択して使用できるようにするには、そのレコードタイプをユーザーのプロファイルに割り当てる必要があります。これにより、特定のプロファイルを持つユーザーに対してレコードタイプへのアクセス権を付与し、表示させることができます。\nB. ロールの割り当て - ロール階層は他のユーザーが所有するレコードへのアクセス権を広げるため（レコードレベルのセキュリティ）に使用するものであり、レコードタイプを利用可能にするための割り当て機能ではありません。\nC. アプリケーションマネージャーの割り当て - アプリケーションマネージャーは、アプリケーションに含まれるタブや、どのプロファイルにアプリケーションを割り当てるかを制御するための機能です。特定のレコードタイプをユーザーに表示させるための割り当て設定を行う場所ではありません。\nD. ページレイアウトの割り当て - 正解です。プロファイルにレコードタイプを割り当てることに加えて、そのレコードタイプが選択されたときにどのページレイアウトを表示するかを、プロファイルとレコードタイプの組み合わせごとに割り当てる必要があります。これにより、対象のレコードタイプに応じた適切な画面が表示されます。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "Cloud Kicksのサポートマネージャーは、顧客にできるだけ早く対応したいと考えています。マネージャーは、顧客の問題解決に役立つ可能性のあるトラブルシューティングのヒントの上位5つを返信に含めるよう要求しました。この要件を満たすために、管理者は何を提案するべきですか？", "choices": ["自動レスポンスルール", "メールアラート", "ナレッジ記事", "割り当てルール"], "correct": [2], "explanation": "A. 自動レスポンスルール - 自動レスポンスルールは、Web-to-ケースやEmail-to-ケースなどからケースが作成された際に、顧客に自動的に初期応答メールを送信する機能です。用意された静的なテンプレートを送信するため、顧客の個別の問題に応じたトラブルシューティング手順を動的に含めるという要件には適していません。\nB. メールアラート - メールアラートは、レコードが特定の条件を満たしたときにメールを自動送信するアクションです。自動レスポンスルールと同様に固定のメールテンプレートを使用するため、サポートエージェントが状況に合わせて具体的なトラブルシューティングのヒントを選択して提供する用途には向いていません。\nC. ナレッジ記事 - 正解です。ナレッジ記事としてトラブルシューティングのヒントを作成および管理することで、サポートエージェントはケースの対応中に適切な記事を検索し、その内容を顧客への返信に直接かつ迅速に挿入できます。これにより、顧客へ効率的に解決策を提示することが可能になります。\nD. 割り当てルール - 割り当てルールは、特定の条件に基づいて新しく作成されたケースやリードを適切な担当者またはキューに自動的に振り分けるための機能です。顧客への返信内容を作成したり、トラブルシューティングの情報を提供したりする機能ではありません。", "category": "サービス＆サポートアプリケーション"}, {"question": "Northern Trail Outfittersは、すべてのマーケティングユーザーに1つのプロファイルを使用しており、キャンペーンオブジェクトへの参照のみのアクセス権を提供しています。現在、一部のマーケティングユーザーがキャンペーンに関する包括的な編集アクセス権を必要としています。管理者はこの要請をどのように満たすべきですか？", "choices": ["権限セット", "組織の共有直接設定", "マーケティングユーザーチェックボックス", "項目レベルセキュリティ"], "correct": [0], "explanation": "A. 権限セット - 正解です。権限セットは、ユーザーのベースとなるプロファイルにアクセス権や権限を追加するために使用されます。プロファイル全体を変更して全員に権限を与えてしまうことなく、プロファイルを共有している一部の特定のユーザーにのみオブジェクトへの追加の編集アクセス権を付与するための最適なソリューションです。\nB. 組織の共有直接設定 - 組織の共有直接設定は、組織内のすべてのユーザーに対してレコードに対する基本レベルのアクセス権(公開、非公開など)を定義するものです。特定のユーザーにオブジェクト自体の編集権限を付与するための機能ではありません。\nC. マーケティングユーザーチェックボックス - マーケティングユーザーチェックボックスは、ユーザーがキャンペーンレコードを作成、削除、および管理するための機能ライセンスを付与するものですが、ユーザーにオブジェクトへの「編集」権限を直接付与するものではありません。ユーザーがキャンペーンを編集するには、チェックボックスの有効化に加えて、プロファイルまたは権限セットでのオブジェクトアクセス権(作成、編集など)が必要です。今回の要件のように一部のユーザーに追加のオブジェクトアクセス権を付与する場合は、権限セットを使用します。\nD. 項目レベルセキュリティ - 項目レベルセキュリティは、特定のプロファイルや権限セットに対して、レコード内の個々の特定の項目(フィールド)の表示や編集を制御する機能です。キャンペーンオブジェクト全体に対する包括的なアクセス権を付与するための機能ではありません。", "category": "設定とセットアップ"}, {"question": "Northern Trail Outfittersには2つの異なるセールスプロセスがあります。1つは4つのフェーズを持つビジネス商談用、もう1つは8つのフェーズを持つパートナー商談用です。両方のプロセスは、ページレイアウトと選択リスト値のオプションが異なります。管理者はこれらの要件を満たすために何を設定する必要がありますか？", "choices": ["ユーザーが正確な商談フェーズ情報を入力していることを確認する入力規則。", "商談タイプの選択リスト値を制御する異なるページレイアウト。", "商談のレコードタイプとセールスプロセスを制限する公開グループ。", "異なるタイプの商談用に別々のレコードタイプとセールスプロセス。"], "correct": [3], "explanation": "A. ユーザーが正確な商談フェーズ情報を入力していることを確認する入力規則。 - 入力規則は、ユーザーがレコードを保存する前にデータが特定の条件を満たしているかを検証するものです。複数のフェーズ、ページレイアウト、および選択リスト値を商談のタイプごとに管理および制御するための機能ではありません。\nB. 商談タイプの選択リスト値を制御する異なるページレイアウト。 - ページレイアウトはレコードの詳細画面や項目の配置を制御しますが、選択リストで利用可能な値そのものを制御したり、商談のフェーズ群であるセールスプロセスを定義したりすることはできません。選択リスト値の制御にはレコードタイプを使用する必要があります。\nC. 商談のレコードタイプとセールスプロセスを制限する公開グループ。 - 公開グループはレコードの共有ルールなどでアクセス権を付与するために使用されるものであり、レコードタイプやセールスプロセスのユーザーへの割り当てを制御する機能ではありません。割り当てはプロファイルなどを通じて行います。\nD. 異なるタイプの商談用に別々のレコードタイプとセールスプロセス。 - 正解です。商談オブジェクトにおいて、ビジネスプロセスごとに異なるフェーズセット（セールスプロセス）、異なる選択リスト値、および対応するページレイアウトを提供するには、個別のセールスプロセスを作成し、それらを異なるレコードタイプに関連付ける設定方法が必須となります。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "管理者がSalesforceオブジェクトを使用する際に留意すべき2つの考慮事項は何ですか？2つの回答を選択してください。", "choices": ["カスタムオブジェクトと標準オブジェクトには標準項目がある。", "標準オブジェクトはSalesforceに含まれている。", "新しい標準オブジェクトを作成できる。", "標準オブジェクトのみが主従関係をサポートする。"], "correct": [0, 1], "explanation": "A. カスタムオブジェクトと標準オブジェクトには標準項目がある。 - 正解です。すべてのオブジェクトには、ID、作成日、最終更新日などの標準項目がデフォルトで含まれています。\nB. 標準オブジェクトはSalesforceに含まれている。 - 正解です。標準オブジェクト(取引先、取引先責任者、商談など)は、Salesforceのプラットフォームに最初から組み込まれて提供されています。\nC. 新しい標準オブジェクトを作成できる。 - 組織の独自の要件に合わせて新しく作成できるのはカスタムオブジェクトのみです。ユーザーが新しい標準オブジェクトを作成することはできません。\nD. 標準オブジェクトのみが主従関係をサポートする。 - カスタムオブジェクトも主従関係をサポートしています。カスタムオブジェクトを主、または従として主従関係を構築することが可能です。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "Universal Containers (UC) には、UCカスタマーサポートチームが作業する必要があるToDoを管理するために使用されるキューがあります。同じチームが今後、UCのケースのいくつかを作業することになります。管理者はサポートチームを支援するためにどの2つのオプションを使用するべきですか？2つの回答を選択してください。", "choices": ["フローを設定して、ケースをキューに割り当てる。", "割り当てルールを使用して、キューをケースの所有者として設定する。", "既存のキューに利用可能なオブジェクトとしてケースを追加する。", "新しいキューを作成し、利用可能なオブジェクトとしてケースを追加する。"], "correct": [1, 2], "explanation": "A. フローを設定して、ケースをキューに割り当てる。 - フローを使用してレコードの所有者をキューに変更することは技術的に可能ですが、ケースのルーティングやキューへの割り当てを行うための標準的なベストプラクティスとしては、専用の機能である割り当てルールを使用する方が適しています。\nB. 割り当てルールを使用して、キューをケースの所有者として設定する。 - 正解です。割り当てルールは、特定の条件に基づいて新しく作成されたケースの所有者を適切なユーザーまたはキューに自動的に割り当てるための標準機能であり、この要件に最適です。\nC. 既存のキューに利用可能なオブジェクトとしてケースを追加する。 - 正解です。既存のカスタマーサポートチーム用のキューは現在ToDoを管理するように設定されているため、ケースもそのキューに割り当て可能にするには、キューのサポートされるオブジェクトのリストにケースオブジェクトを追加する必要があります。\nD. 新しいキューを作成し、利用可能なオブジェクトとしてケースを追加する。 - 要件では同じチームが対応すると指定されているため、既存のチームのキューのサポートオブジェクトを編集してケースを追加するアプローチの方が、新しいキューを作成するよりも管理が簡素化され適切です。", "category": "サービス＆サポートアプリケーション"}, {"question": "オブジェクトマネージャーで項目を必須としてマークする際の考慮事項となる2つの機能はどれですか？2つの回答を選択してください。", "choices": ["そのオブジェクトでAPIを介してレコードを保存する場合、その項目は必須ではありません。", "そのオブジェクトでレコードを保存する場合、その項目は全体で必須になります。", "その項目は、そのオブジェクトのすべてのページレイアウトに追加されます。", "Web-to-リードおよびWeb-to-ケースを介してレコードを保存する場合、その項目はオプションです。"], "correct": [1, 2], "explanation": "A. そのオブジェクトでAPIを介してレコードを保存する場合、その項目は必須ではありません。 - オブジェクトマネージャーで項目を必須（普遍的に必須）に設定した場合、ユーザーインターフェースからだけでなく、データローダなどのAPIを介したレコードの保存時にも必ずその項目の値が必要になります。したがって、必須ではないとするこの記述は誤りとなります。\nB. そのオブジェクトでレコードを保存する場合、その項目は全体で必須になります。 - この記述は正しいです。オブジェクトマネージャー（項目レベル）で必須チェックボックスをオンにすると、ページレイアウト、API、Web-to-リードなど、レコードが作成または保存されるすべての経路でその項目が普遍的に必須となります。\nC. その項目は、そのオブジェクトのすべてのページレイアウトに追加されます。 - この記述は正しいです。項目が全体で必須として設定されると、Salesforceは自動的にそのオブジェクトのすべてのページレイアウトにその項目を追加し、ページレイアウト上から削除できないようにします。\nD. Web-to-リードおよびWeb-to-ケースを介してレコードを保存する場合、その項目はオプションです。 - 項目が全体で必須に設定されている場合、Web-to-リードやWeb-to-ケースのフォーム経由であってもその項目の入力は必須要件となり、オプションとして扱うことはできません。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "ユーザーがユーザーインターフェースを介してSalesforceにログインするとき、システムは認証のためにどの2つの設定をチェックしますか？2つの回答を選択してください。", "choices": ["ユーザーのAPIログインの2要素認証権限", "ロールのIPアドレス制限", "ユーザーのプロファイルのログイン時間制限", "ユーザーのユーザーインターフェースログインの2要素認証権限"], "correct": [2, 3], "explanation": "A. ユーザーのAPIログインの2要素認証権限 - この権限はデータローダや外部連携システムからのAPIアクセス時の認証プロセスを制御するものであり、ユーザーインターフェースからのログイン時の認証チェックには適用されません。\nB. ロールのIPアドレス制限 - SalesforceのIPアドレス制限は、プロファイルレベルでのログインIP制限、または組織全体のネットワークアクセス設定で定義されます。ロールに基づいてIPアドレス制限を設定することはできません。\nC. ユーザーのプロファイルのログイン時間制限 - 正解です。ユーザーがログインを試みると、システムはまずそのユーザーのプロファイルに設定されているログイン時間の制限をチェックし、現在が許可された時間帯であるかを確認します。\nD. ユーザーのユーザーインターフェースログインの2要素認証権限 - 正解です。システムはユーザーインターフェースを介したログイン時に、プロファイルや権限セットで多要素認証（2要素認証）が要求されているかをチェックし、設定されている場合は追加の認証を求めます。", "category": "設定とセットアップ"}, {"question": "Cloud Kicksは、リードソースが選択されている場合にのみ、ユーザーが商談のフェーズで成約を選択できるようにしたいと考えています。管理者はこの目標をどのように達成するべきですか？", "choices": ["リードソースを商談のフェーズ項目の連動選択リストにする。", "フェーズが成約に設定されている場合、リードソースを必要とする入力規則を設定する。", "ページレイアウト上で商談のフェーズ項目を参照のみに変更する。", "商談のフェーズをリードソース項目の連動選択リストに変更する。"], "correct": [1], "explanation": "A. リードソースを商談のフェーズ項目の連動選択リストにする。 - 連動選択リストは、制御項目の値に基づいて連動項目の選択肢を絞り込む機能です。特定のフェーズの時に別の項目の入力を必須にするという要件を満たすための機能ではありません。\nB. フェーズが成約に設定されている場合、リードソースを必要とする入力規則を設定する。 - 正解です。入力規則を使用すると、ユーザーがレコードを保存する前にデータが特定の条件を満たしているかを評価できます。フェーズが成約で、かつリードソースが空白の場合にエラーを表示させる数式を作成することで、この要件を正確に満たすことができます。\nC. ページレイアウト上で商談のフェーズ項目を参照のみに変更する。 - フェーズ項目を参照のみにしてしまうと、ユーザーは商談の進行に合わせてフェーズを一切更新できなくなってしまいます。条件付きで特定の項目の入力を必須にする要件には適していません。\nD. 商談のフェーズをリードソース項目の連動選択リストに変更する。 - 連動選択リストは選択肢の表示を制御するものであり、入力必須化を行うためのツールではありません。さらに、標準の商談のフェーズ項目は制御項目として機能することはできますが、連動項目として設定することはできません。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "Cloud Kicks (CK) は、特定の顧客に関する情報を取引先責任者に保存し、靴やアクセサリーに関する情報をカスタムのMerchandiseオブジェクトに保存します。CKの管理者は、取引先責任者が複数のMerchandiseに関心を持つことができることを表すために何を使用するべきですか？", "choices": ["階層列", "参照フィルター", "数式項目", "連結オブジェクト"], "correct": [3], "explanation": "A. 階層列 - 階層列（階層カスタム項目）はユーザーオブジェクトに特有の機能であり、ユーザー同士の階層関係を関連付けるために使用されます。取引先責任者とカスタムオブジェクトを関連付けるためには使用できません。\nB. 参照フィルター - 参照フィルターは、参照関係で選択できるレコードを特定の条件で制限するための機能です。これ自体が多対多の関係を作成するものではありません。\nC. 数式項目 - 数式項目は、他の項目の値や関数を使用して値を自動計算するための機能です。異なるオブジェクト間のレコードを関連付けるデータベースのリレーションシップを構築する機能ではありません。\nD. 連結オブジェクト - 正解です。取引先責任者とMerchandiseオブジェクトの間に連結オブジェクトを作成することで、多対多の関係を構築できます。これにより、1人の取引先責任者が複数のMerchandiseに関心を持ち、1つのMerchandiseが複数の取引先責任者に関連付けられることを表現できます。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "Northern Trail Outfittersは、カスタムオブジェクトReferral SourceのReferral Date項目が更新されたときに、親オブジェクトReferralも更新する必要があると要求しています。管理者はこの要求を満たすためにどの自動化ソリューションを使用するべきですか？", "choices": ["Lightning Webコンポーネント", "承認プロセス", "ワークフロー項目自動更新", "プロセスビルダー"], "correct": [3], "explanation": "A. Lightning Webコンポーネント - Lightning Webコンポーネントはカスタムユーザーインターフェースを構築するためのプログラミングフレームワークであり、データベースの変更をトリガーとして関連レコードを自動的に更新するための宣言的な自動化ツールではありません。\nB. 承認プロセス - 承認プロセスは、ユーザーにレコードの承認を求めるためのビジネスプロセスを自動化する機能です。特定の項目の更新をトリガーとして親オブジェクトを自動更新する要件を満たすためのツールではありません。\nC. ワークフロー項目自動更新 - ワークフロー項目自動更新は主従関係にある親レコードを更新することは可能ですが、参照関係の親レコードなど任意の関連レコードを柔軟に更新することはできません。関連レコードの更新には、プロセスビルダーやフローを使用するのが標準的な機能となります。\nD. プロセスビルダー - 正解です。プロセスビルダーは、レコードが作成または編集されたときにトリガーされ、そのレコードに関連する親レコードなどの項目を自動的に更新するアクションを簡単に設定できます。したがって、この要件を満たすための適切な自動化ソリューションです。", "category": "自動化"}, {"question": "Northern Trail Outfittersは、組織内で取引先責任者階層を使用して、取引先責任者の関連付けを表示したいと考えています。取引先責任者階層に関して、管理者はどのようなことを考慮するべきでしょうか？", "choices": ["取引先責任者階層に表示される取引先責任者は、ユーザーのレコードレベルのアクセス権に制限されます。", "取引先責任者階層は、一度に3,000件の取引先責任者のみに制限されます。", "階層の列をカスタマイズすると、最近参照した取引先責任者のリストビューが変更されます。", "取引先責任者階層に表示される取引先責任者では、共有設定は無視されます。"], "correct": [0], "explanation": "A. 取引先責任者階層に表示される取引先責任者は、ユーザーのレコードレベルのアクセス権に制限されます。 - 正解です。取引先責任者階層はSalesforceのセキュリティモデル（共有設定など）を尊重するため、ユーザーは自身がアクセス権を持っている取引先責任者レコードのみを階層内で参照することができます。\nB. 取引先責任者階層は、一度に3,000件の取引先責任者のみに制限されます。 - 取引先責任者階層の表示において、一度に3,000件という制限は存在しません。そのため、管理者が考慮すべき事項ではありません。\nC. 階層の列をカスタマイズすると、最近参照した取引先責任者のリストビューが変更されます。 - 階層の列のカスタマイズはオブジェクトマネージャの「階層の列」という専用の設定項目から独立して行われます。そのため、設定を変更しても最近参照したリストビューには影響しません。\nD. 取引先責任者階層に表示される取引先責任者では、共有設定は無視されます。 - 共有設定が無視されることはありません。選択肢Aで説明した通り、取引先責任者階層の表示にはユーザーのレコードレベルのセキュリティと共有設定が厳格に適用されます。", "category": "設定とセットアップ"}, {"question": "Cloud Kicksの管理者は、処理時間を向上させるために、リードの作成時に単純な項目更新を行っている2つの古いワークフロールールを置き換えるよう依頼されました。管理者はワークフロールールを置き換えるためにどのツールを使用するべきでしょうか？", "choices": ["クイックアクションフロー", "保存前フロー", "スケジュールフロー", "画面フロー"], "correct": [1], "explanation": "A. クイックアクションフロー - クイックアクションフローはユーザーが手動でアクションをクリックしたときに起動するものであり、レコード作成時の自動的な項目更新を目的とするものではありません。\nB. 保存前フロー - 正解です。保存前フローは、レコードがデータベースに保存される前に実行されるため処理速度が非常に速く、同一レコードの単純な項目更新を行う古いワークフロールールを置き換えるための最適なツールです。\nC. スケジュールフロー - スケジュールフローは指定された日時に基づいて実行されるものであり、リードが作成されたというイベントをトリガーとして即座に実行する用途には適していません。\nD. 画面フロー - 画面フローはユーザーから情報を収集するための画面を表示するものであり、バックグラウンドで自動的にトリガーされる項目更新の処理には使用されません。", "category": "自動化"}, {"question": "Ursa Major Solarの営業担当者は、商談の管理に苦労しています。経営陣は管理者に、営業担当者が商談の優先順位を付け、より多くの商談を成約できるように支援するよう依頼しました。管理者は何をすべきでしょうか？", "choices": ["Einstein リードスコアリング", "Einstein 検索パーソナライゼーション", "Einstein 活動キャプチャ", "Einstein 商談スコアリング"], "correct": [3], "explanation": "A. Einstein リードスコアリング - Einstein リードスコアリングは、リードが取引開始される可能性を予測してスコアを付ける機能です。今回はすでに発生している商談の優先順位付けと成約を支援することが目的であるため、目的と異なります。\nB. Einstein 検索パーソナライゼーション - Einstein 検索パーソナライゼーションは、ユーザーの過去の活動や好みに基づいて検索結果を個別に最適化する機能です。商談の優先順位付けや成約の支援に直接関連するものではありません。\nC. Einstein 活動キャプチャ - Einstein 活動キャプチャは、メールやカレンダーの行動をSalesforceの関連レコードに自動的に追加する機能です。手入力を減らすことで生産性は向上しますが、商談の優先順位を提示する機能ではありません。\nD. Einstein 商談スコアリング - 正解です。Einstein 商談スコアリングは、人工知能を使用して各商談が成約する可能性を予測し、スコアを割り当てる機能です。これにより、営業担当者は成約の見込みが高い商談を特定して集中できるようになり、優先順位付けと成約数の向上を直接的に支援します。", "category": "セールス＆マーケティングアプリケーション"}, {"question": "Universal Containersのユーザーが退職しました。管理者はその後任のために新しいユーザーを作成する必要がありますが、利用可能なすべてのユーザーライセンスをすでに割り当てています。新しいユーザーのためにユーザーライセンスを解放するには、管理者は何をするべきでしょうか？", "choices": ["元従業員のユーザーレコードを無効化する。", "元従業員のユーザーレコードを削除する。", "元従業員のユーザーレコードを凍結する。", "元ユーザーのレコードを新しいユーザーに変更する。"], "correct": [0], "explanation": "A. 元従業員のユーザーレコードを無効化する。 - 正解です。退職したユーザーのレコードを無効化することで、そのユーザーが使用していたライセンスが解放され、新しいユーザーに割り当てることができるようになります。Salesforceではユーザーレコードを完全に削除することはできないため、無効化が正しい手順となります。\nB. 元従業員のユーザーレコードを削除する。 - Salesforceでは、過去のレコードの所有権や履歴などの関連性を維持する必要があ
