<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salesforce 過去問トレーナー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF1F6;
    --paper:#FFFFFF;
    --ink:#20264D;
    --ink-soft:#5B6389;
    --ink-faint:#9AA1C2;
    --accent:#D98E2B;      /* amber - ticket / highlight */
    --accent-ink:#7A4E0B;
    --blue:#2F6FED;        /* primary action */
    --blue-deep:#1E4FBF;
    --success:#2E9E6D;
    --success-bg:#E4F5EC;
    --danger:#D14343;
    --danger-bg:#FBE8E8;
    --border:#DCE2EF;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 1px 1px, #d7deec 1px, transparent 0) 0 0/16px 16px,
      var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:28px 16px 60px;
  }
  .app{max-width:720px;margin:0 auto;}
  h1,h2,h3{font-family:'Fraunces',serif;margin:0;}
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--ink-faint);
  }

  /* ---- Ticket-style header ---- */
  .ticket{
    background:var(--paper);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px 24px;
    margin-bottom:20px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    overflow:hidden;
  }
  .ticket::before{
    content:"";
    position:absolute;
    right:132px;
    top:0;
    bottom:0;
    width:0;
    border-left:2px dashed var(--border);
  }
  .ticket .stub{
    width:110px;
    text-align:center;
    padding-left:18px;
    flex-shrink:0;
  }
  .ticket .stub .num{
    font-family:'Fraunces',serif;
    font-size:26px;
    font-weight:600;
    color:var(--accent-ink);
    line-height:1;
  }
  .ticket .stub .lbl{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    color:var(--ink-faint);
    letter-spacing:.06em;
    margin-top:4px;
  }
  .ticket h1{font-size:21px;color:var(--ink);}
  .ticket .sub{font-size:13px;color:var(--ink-soft);margin-top:4px;}

  /* ---- Cards ---- */
  .card{
    background:var(--paper);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:22px 24px;
    margin-bottom:16px;
  }
  .card h2{font-size:16px;margin-bottom:4px;}
  .card .desc{font-size:13px;color:var(--ink-soft);margin-bottom:14px;line-height:1.6;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}

  /* ---- Buttons ---- */
  button{
    font-family:'Inter',sans-serif;
    font-size:14px;
    font-weight:600;
    border-radius:9px;
    border:1px solid transparent;
    padding:10px 16px;
    cursor:pointer;
    transition:transform .06s ease, filter .15s ease, background .15s ease;
  }
  button:active{transform:translateY(1px);}
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-primary:hover{background:var(--blue-deep);}
  .btn-primary:disabled{background:#B9C6EA;cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--ink);border-color:var(--border);}
  .btn-ghost:hover{background:#F3F5FA;}
  .btn-amber{background:var(--accent);color:#fff;}
  .btn-amber:hover{filter:brightness(0.95);}
  .btn-danger{background:transparent;color:var(--danger);border-color:#F0C6C6;}
  .btn-danger:hover{background:var(--danger-bg);}
  .btn-sm{padding:6px 11px;font-size:12.5px;}
  button:disabled{opacity:.5;cursor:not-allowed;}
  .link-btn{background:none;border:none;color:var(--blue);font-weight:600;font-size:13px;padding:4px 0;cursor:pointer;}

  /* ---- Home / list rows ---- */
  .stat-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 0;border-bottom:1px solid var(--border);
    gap:10px;flex-wrap:wrap;
  }
  .stat-row:last-child{border-bottom:none;}
  .stat-left{display:flex;align-items:baseline;gap:10px;}
  .stat-tag{
    font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-faint);
    width:52px;flex-shrink:0;
  }
  .stat-score{font-family:'Fraunces',serif;font-size:18px;font-weight:600;}
  .stat-score.good{color:var(--success);}
  .stat-score.bad{color:var(--danger);}
  .stat-sub{font-size:12px;color:var(--ink-soft);}
  .empty-note{font-size:13px;color:var(--ink-faint);padding:8px 0;}

  /* ---- Quiz ---- */
  .progress-wrap{
    display:flex;align-items:center;gap:12px;margin-bottom:18px;
  }
  .progress-bar{flex:1;height:6px;background:var(--border);border-radius:99px;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--accent));transition:width .25s ease;}
  .progress-label{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-soft);white-space:nowrap;}

  .question-text{font-size:18px;line-height:1.65;margin-bottom:18px;font-weight:500;white-space:pre-wrap;}
  .multi-hint{
    display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10.5px;
    color:var(--accent-ink);background:#FBF0DC;padding:3px 8px;border-radius:6px;margin-bottom:14px;
  }
  .choice{
    display:flex;align-items:flex-start;gap:12px;
    border:1px solid var(--border);border-radius:11px;
    padding:13px 15px;margin-bottom:10px;cursor:pointer;
    transition:border-color .12s ease, background .12s ease;
    font-size:14.5px;line-height:1.55;white-space:pre-wrap;
  }
  .choice:hover{border-color:var(--blue);}
  .choice.selected{border-color:var(--blue);background:#EEF3FE;}
  .choice .mark{
    width:20px;height:20px;border-radius:6px;border:1.5px solid var(--ink-faint);
    flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;
    font-size:12px;color:#fff;
  }
  .choice.radio .mark{border-radius:50%;}
  .choice.selected .mark{background:var(--blue);border-color:var(--blue);}
  .choice.locked{cursor:default;pointer-events:none;}
  .choice.correct-mark{border-color:var(--success);background:var(--success-bg);}
  .choice.correct-mark .mark{background:var(--success);border-color:var(--success);}
  .choice.wrong-mark{border-color:var(--danger);background:var(--danger-bg);}
  .choice.wrong-mark .mark{background:var(--danger);border-color:var(--danger);}
  .feedback-banner{
    display:flex;align-items:center;gap:8px;font-family:'Fraunces',serif;font-weight:600;font-size:16px;
    padding:11px 15px;border-radius:10px;margin-bottom:14px;
  }
  .feedback-banner.good{background:var(--success-bg);color:var(--success);}
  .feedback-banner.bad{background:var(--danger-bg);color:var(--danger);}

  .quiz-nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:10px;flex-wrap:wrap;}

  /* ---- explanation ---- */
  .explain-box{
    background:#F6F8FC;border:1px solid var(--border);border-radius:10px;
    padding:14px 16px;margin-top:16px;font-size:13.5px;line-height:1.7;color:var(--ink-soft);
    white-space:pre-wrap;
  }
  .explain-box b{color:var(--ink);}
  .pattern-select{
    font-family:'Inter',sans-serif;font-size:13px;font-weight:600;color:var(--ink);
    border:1px solid var(--border);border-radius:9px;padding:9px 12px;background:#FBFCFE;
    width:100%;margin-bottom:12px;
  }
  .pattern-note{font-size:12px;color:var(--ink-faint);margin:-6px 0 14px;line-height:1.6;}

  /* ---- Result ---- */
  .score-hero{
    text-align:center;padding:20px 10px 8px;
  }
  .score-hero .big{font-family:'Fraunces',serif;font-size:52px;font-weight:600;line-height:1;}
  .score-hero .big.good{color:var(--success);}
  .score-hero .big.bad{color:var(--danger);}
  .score-hero .of{font-size:14px;color:var(--ink-soft);margin-top:6px;}

  .wrong-item{
    border:1px solid var(--border);border-radius:11px;padding:14px 16px;margin-bottom:10px;
  }
  .wrong-item .q{font-weight:600;font-size:14px;margin-bottom:8px;line-height:1.55;white-space:pre-wrap;}
  .wrong-item .meta{font-size:12.5px;line-height:1.8;}
  .wrong-item .meta .your{color:var(--danger);}
  .wrong-item .meta .correct{color:var(--success);}

  /* ---- Manage / list items ---- */
  .qlist-item{
    display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
    padding:12px 0;border-bottom:1px solid var(--border);
  }
  .qlist-item:last-child{border-bottom:none;}
  .qlist-item .qtext{font-size:13.5px;line-height:1.55;}
  .qlist-item .qmeta{font-size:11.5px;color:var(--ink-faint);margin-top:4px;font-family:'JetBrains Mono',monospace;}

  textarea, input[type=text]{
    width:100%;font-family:'JetBrains Mono',monospace;font-size:12.5px;
    border:1px solid var(--border);border-radius:9px;padding:10px 12px;
    background:#FBFCFE;color:var(--ink);
  }
  textarea{min-height:120px;resize:vertical;}
  input.input-inline{
    width:auto;flex:1;min-width:180px;font-family:'Inter',sans-serif;font-size:14px;
  }
  .file-drop{
    border:1.5px dashed var(--border);border-radius:11px;padding:18px;text-align:center;
    font-size:13px;color:var(--ink-soft);cursor:pointer;
  }
  .file-drop:hover{border-color:var(--blue);color:var(--blue);}

  .tabs{display:flex;gap:6px;margin-bottom:16px;}
  .tab{
    padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;
    color:var(--ink-soft);
  }
  .tab.active{background:var(--paper);color:var(--ink);border:1px solid var(--border);}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:11px 20px;border-radius:99px;
    font-size:13px;box-shadow:0 8px 24px rgba(32,38,77,.25);
    opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;
    z-index:99;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  .back-link{
    display:inline-flex;align-items:center;gap:5px;color:var(--ink-soft);
    font-size:13px;font-weight:600;cursor:pointer;margin-bottom:14px;
  }
  .back-link:hover{color:var(--ink);}

  .draft-banner{
    background:#FBF0DC;border:1px solid #EFCE8E;border-radius:11px;
    padding:13px 16px;display:flex;justify-content:space-between;align-items:center;
    margin-bottom:16px;gap:10px;flex-wrap:wrap;font-size:13.5px;color:var(--accent-ink);
  }

  .set-pill{
    display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10.5px;
    color:var(--blue-deep);background:#EAF0FE;padding:3px 9px;border-radius:99px;margin-bottom:8px;
  }

  @media (max-width:480px){
    .ticket{flex-direction:column;align-items:flex-start;}
    .ticket::before{display:none;}
    .ticket .stub{padding-left:0;text-align:left;width:auto;}
  }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ============ storage fallback（exe 版など window.storage が無い環境用） ============ */
if(!window.storage){
  const PREFIX='quiz:';
  window.storage={
    async get(key){ const v=localStorage.getItem(PREFIX+key); return v===null? null: {key, value:v}; },
    async set(key,value){ localStorage.setItem(PREFIX+key, value); return {key, value}; },
    async delete(key){ localStorage.removeItem(PREFIX+key); return {key, deleted:true}; },
    async list(prefix=''){ const keys=[]; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k.startsWith(PREFIX+prefix)) keys.push(k.slice(PREFIX.length)); } return {keys}; }
  };
}

/* ============ storage helpers ============ */
async function sGet(key){
  try{ const r = await window.storage.get(key,false); return r? JSON.parse(r.value): null; }
  catch(e){ return null; }
}
async function sSet(key,val){
  try{ await window.storage.set(key, JSON.stringify(val), false); return true; }
  catch(e){ console.error(e); return false; }
}
async function sDel(key){
  try{ await window.storage.delete(key,false); }catch(e){}
}

/* ============ state ============ */
let sets = [];        // [{id, name}]

/* ============ 初回起動時に自動で読み込む問題セット ============
   mondai1.csv の内容をそのままアプリに反映（インポート操作不要）
============================================================ */
const SEED_SET_NAME = 'アドミニストレーター';
const SEED_QUESTIONS = [{"question": "Dreamhouse Realestateの管理者は、Salesforceモバイルアプリ用のカスタマイズされたページを作成する必要があります。管理者がLightningアプリビルダーを使用して構築およびカスタマイズできるページの種類は次のうちどれですか？正解を2つ選択してください。", "choices": ["アプリページ", "レコードページ", "ユーザーページ", "ダッシュボードページ"], "correct": [0, 1], "explanation": "アプリページ：Lightningアプリビルダーを使用して、Salesforceのアプリに特化したページを作成でき、これによりモバイルアプリやデスクトップアプリで使用されるカスタムページを構築できます。\n\nレコードページ：レコードページは、特定のレコード（例：商談、アカウント、リードなど）に関連するカスタムページを作成するためのページであり、Lightningアプリビルダーを使って、モバイルアプリのレコードページをカスタマイズできます。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "DreamHouse realestateには承認プロセスがあり、マネージャーがレコードを承認しようとしましたが、エラーが発生しました。管理者はこのリクエストのトラブルシューティングに対してどの項目を確認すればよいでしょうか？正解を2つ選択してください。", "choices": ["プロセスの次の承認者のために代理承認者を追加する。", "プロセスで更新される項目の項目レベルセキュリティを表示に更新する。", "プロセスで更新される項目が表示されていることを確認するためにページレイアウトを確認する。", "次の承認者のユーザーが非アクティブ状態であるか、または存在しないかを確認する。"], "correct": [1, 3], "explanation": "B．項目レベルのセキュリティ：承認プロセスで更新される項目が、承認者にとって非表示またはアクセス不可の場合エラーが発生する可能性があります。管理者は承認プロセス内で操作される項目の項目レベルセキュリティ（Field-Level Security）を確認し、適切なアクセス権限を付与する必要があります。\n\nD．非アクティブまたは存在しない次の承認者：承認プロセスでは、次のステップの承認者が非アクティブになっていたりユーザーが存在しなかったりするとエラーが発生します。このような場合、管理者は適切な承認者を割り当て直す必要があります。", "category": "自動化"}, {"question": "Salesforceで新しい商談の追跡にカスタム項目を追加する場合、成約確度を効果的に表現するためにどのデータ型を選択するのが最適ですか？", "choices": ["ナレッジ", "選択リスト", "数値", "参照"], "correct": [1], "explanation": "選択リストは、固定された選択肢を提供し、ユーザーがその中から選択する形式です。成約確度を表現する場合、例えば「高」「中」「低」のように事前定義された値を使用するのが一般的です。選択リストを使用することで標準化された入力を促し、データの一貫性を保つことができます。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "Cloud kicksの管理者がカスタム項目を削除しましたが、あるビジネスユニットがその項目をまだ使用していることに気づきました。この項目を復元する際、何を考慮する必要がありますか？正解を2つ選択してください。", "choices": ["項目はレポートに再追加される必要があります。", "項目の履歴は削除されたままです。", "項目はページレイアウトに再追加される必要があります。", "項目はゴミ箱から復元する必要があります。"], "correct": [0, 2], "explanation": "A．レポートへの再追加：項目を復元した場合でも、レポートの設定からは削除されたままであり、必要であれば該当項目を手動でレポートに再追加する必要があります。\n\nC．ページレイアウトへの再追加：項目を復元しても、関連するページレイアウトには自動的に戻りません。手動でページレイアウトに再追加する必要があります。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "DreamHouse Realtyの管理者は、エージェントの能力とスキルセットを割り当てる簡単な方法を求めています。この要件を満たすために、管理者はどの機能を有効にするべきでしょうか？", "choices": ["ナレッジ管理", "テリトリーマネジメント", "エスカレーションルール", "オムニチャネル"], "correct": [1], "explanation": "テリトリーマネジメントは、エージェントを地理的なエリアやスキルに基づいて割り当てるのに役立つ機能であり、この機能を活用すると、エージェントの能力やスキルセットに応じて、リードや取引先を自動的に適切なエージェントに割り当てることが出来ます。", "category": "サービス＆サポートアプリケーション"}, {"question": "DreamHouse Realesetateは、取引先とケースでカテゴリ項目の選択リスト値を記録タイプに応じて一貫して使用する必要があります。この要件を満たすために、管理者はどの2つの機能を使用するべきですか？正解を2つ選んでください。", "choices": ["複数選択選択リスト", "グローバル選択リスト", "依存選択リスト", "カスタム選択リスト"], "correct": [1, 2], "explanation": "B．グローバル選択リスト：グローバル選択リストを使用することで、複数のオブジェクトで同じ選択リスト値を一貫して使用できます。この設定により、記録タイプ間で一貫性を保つことが容易になります。\n\nC．依存選択リスト：依存選択リストを活用することで、選択リスト値の関連性を定義して記録タイプや他の選択肢に基づいて動的に表示される値を制御でき、カテゴリ項目をさらに一貫性のある形で管理できます。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "標準項目のどの3つの側面を管理者はカスタマイズすべきですか？3つの答えを選んでください。", "choices": ["選択リスト値", "項目履歴の追跡", "ヘルプテキスト", "項目名", "小数点以下の桁数"], "correct": [0, 1, 2], "explanation": "A．選択リスト値：標準項目の選択リスト値はカスタマイズ可能で、例えば、商談の「ステージ」選択リストで値を追加、削除、並べ替えることができます。これにより、ビジネスプロセスに合わせた値を設定できます。\n\nB．項目履歴の追跡：管理者は、標準項目で履歴追跡を有効にすることにより、特定の項目の変更履歴を追跡できます。これにより、データ変更の透明性を確保し、監査要件を満たすことができます。\n\nC．ヘルプテキスト：標準項目にヘルプテキストを追加または編集することで、ユーザーがその項目の目的や入力ルールを理解しやすくなります。これはユーザーのエラーを減らすために重要です。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "クラウドキックスの営業マネージャーは、商談の割引率が30%以上の場合は営業担当副社長の承認が必要となるビジネスプロセスを設定したいと考えています。また、10%以上の割引はユーザーのマネージャーの承認が必要です。管理者は承認プロセスの設定を任されています。この承認プロセスを設定する前に管理者が確認すべき考慮事項は何ですか？正解を2つ選択してください。", "choices": ["提出者が手動で承認者を選択できるようにする。", "割引額を記録するために、商談にカスタム割引項目を作成する。", "二つの別々の承認プロセスを設定する。", "営業ユーザーのユーザ詳細ページにマネージャー標準項目を入力する。"], "correct": [1, 3], "explanation": "B．カスタム割引項目の作成：承認プロセスで割引率を条件として使用するには、そのデータが商談レコードに存在する必要があります。割引率が標準項目として存在しない場合、カスタム項目を作成して割引率を追跡し、承認プロセスで利用できるようにする必要があります。\n\nD．マネージャー項目の設定：Salesforceの承認プロセスで「ユーザーのマネージャー」を条件として使用する場合、ユーザー詳細ページの「マネージャー」標準項目が適切に入力されている必要があります。これにより、10%以上の割引に対するマネージャーの承認が自動的にルーティングされます。", "category": "自動化"}, {"question": "Ursa Major Solarは商談を使用して太陽エネルギー製品の販売を追跡しています。同社には異なるエネルギー市場に焦点を当てた2つの別々の営業チームがあります。サービスチームもまた、インストールを追跡するために商談を使用したいと考えています。これら3つのチームは、異なる項目とフェーズを使用する必要があります。管理者はこの要件をどのように設定すべきですか？", "choices": ["三つの販売プロセスを作成します。三つのレコードタイプと一つのページレイアウトを作成します。", "一つの販売プロセスを作成します。三つのレコードタイプと三つのページレイアウトを作成します。", "三つの販売プロセスを作成します。三つのレコードタイプと三つのページレイアウトを作成します。", "一つの販売プロセスを作成します。一つのレコードタイプと三つのページレイアウトを作成します。"], "correct": [2], "explanation": "この要件では、3つの異なるチームが異なる商談のフェーズや項目を使用する必要があります。そのため、以下の設定が適しています。\n販売プロセス（Sales Process）：各チームが使用する特定の商談フェーズ（ステージ）を定義するために、3つの販売プロセスを作成します。これにより、それぞれのチームが自分たちのワークフローに沿ったフェーズを使用できます。\nレコードタイプ（Record Type）：各チームが利用する特定の項目セットや販売プロセスを割り当てるために、3つのレコードタイプを作成します。\nページレイアウト（Page Layout）：各チームのニーズに基づいて、商談の表示項目をカスタマイズするために、3つの異なるページレイアウトを作成します。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "管理者が一部のユーザーにユーザーインターフェースのログイン用の二要素認証権限とAPIログイン用の二要素認証権限を含む権限セットグループを割り当てました。これらのユーザーの一人がData Loaderにログインしようとしたときどのプロンプトが表示されますか？正解を2つ選んでください。", "choices": ["ユーザーはメールまたはSMSで受け取った確認コードを入力する必要があります。どちらか優先度の高い方を選択します。", "ユーザーはSalesforceアカウントに認証アプリを接続する必要があります。", "ユーザーはモバイルデバイスに認証アプリをダウンロードしてインストールする必要があります。", "ユーザーは「セキュリティトークンをリセット」を使用して信頼できるネットワークからセキュリティトークンを取得する必要があります。"], "correct": [1, 3], "explanation": "B．認証アプリの接続：二要素認証の設定が必要な場合、認証アプリをSalesforceアカウントに接続する必要があります。これにより、Data Loaderのようなツールを使用するときにも二要素認証が求められるため、プロンプトとして表示されます。\n\nD．セキュリティトークン：Data LoaderはAPIを使用してSalesforceにアクセスするため、信頼されていないネットワークからログインする場合にはセキュリティトークンが必要です。セキュリティトークンは、ユーザーがSalesforceの「セキュリティトークンをリセット」から取得できます。", "category": "設定とセットアップ"}, {"question": "管理者は管理されたパッケージをインストールしました。そのパッケージに含まれる権限セットグループには複数のオブジェクトに対する削除アクセスが含まれていますが、管理者は権限セットグループのユーザーがレコードを削除できないようにする必要があります。管理者は削除アクセスを制御するために何をすべきですか？", "choices": ["オブジェクトに対する削除アクセスが選択解除されている新しい権限セットを作成します。", "選択した権限をミュートするために権限セットグループと一緒にミューティング権限セットを使用します。", "ユーザーに削除権限がロールアップされないように新しい役割を作成します。", "ユーザーのプロファイルを編集して、オブジェクトから削除アクセスを削除します。"], "correct": [1], "explanation": "Salesforce管理者は、権限セットグループを使用して、ユーザーがレコードを削除できないようにすることができます。具体的には、権限セットグループ内で、削除権限をミュートするミュート権限セットを作成し、それを該当の権限セットグループに割り当てることで、特定のオブジェクトに対する削除権限を無効化できます。", "category": "設定とセットアップ"}, {"question": "Dreamhouseリアルティは、インスペクターが物件の検査結果を提出するためのフォームをエクスペリエンスクラウドサイト上に提供したいと考えています。この要件を満たすために、管理者はページにどの機能を配置すべきですか？", "choices": ["関連リスト", "画面フロー", "レコード詳細", "自動起動フロー"], "correct": [1], "explanation": "インスペクターが物件の検査結果を提出するためのフォームをエクスペリエンスクラウドサイトに提供するためには画面フローが最適です。画面フローはユーザーがインタラクティブに情報を入力できる画面を提供するもので、検査結果を提出するためのフォームに適しています。フローを使用すると、ユーザーが必要な情報を入力して、そのデータをSalesforceに保存することができます。", "category": "自動化"}, {"question": "AW ComputingのCTOは顧客満足度を向上させるために、ケースに関する新しいポリシーを定義しました。インストールを理由とするすべてのケースは、即座にメールで確認され、適切なエージェントに割り当てられなければなりません。新規ステータスのままで4時間経過したケースは、サポート管理部門にエスカレートされなければなりません。この要件に必要なケース管理ツールは何ですか？", "choices": ["自動応答ルール、マクロ、エンタイトルメント", "自動応答ルール、キュー、エスカレーションルール", "自動応答ルール、キュー、マクロ", "自動応答ルール、エンタイトルメント、エスカレーションルール"], "correct": [1], "explanation": "自動応答ルール：ケースがインストールに関するものであれば、即座に確認メールを送信するために自動応答ルールを使用します。これにより、顧客がケースを提出した直後に自動的に確認メールが送信されます。\nキュー：ケースを適切なエージェントに割り当てるためにキューを使用します。ケースは特定のエージェントまたはチームに割り当てられるようにし、エージェントが効率的に対応できるようにします。\nエスカレーションルール：4時間以内にケースが処理されない場合、サポート管理部門に自動的にエスカレートするためにエスカレーションルールを使用します。これにより、時間内に処理されなかったケースが適切にエスカレートされます。", "category": "サービス＆サポートアプリケーション"}, {"question": "Salesforce開発において、参照項目を設定する目的は何ですか？", "choices": ["共有ルールを設定してデータアクセスを制限するため", "取引先責任者と取引先の間でリンクを作成するため", "ToDoリストを自動的に更新するため", "大規模商談アラートを設定するため"], "correct": [1], "explanation": "参照項目は、Salesforceで異なるオブジェクト間にリレーションシップを作成するために使用されます。例えば、取引先責任者と取引先の間に参照項目を設定することで、取引先責任者がどの取引先に関連しているかをリンクできます。これにより、ユーザーは関連する情報を簡単に参照でき、データの一貫性が保たれます。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "Cloud Kicksの管理者は休暇申請のための承認プロセスを作成しました。承認プロセスの一部として追加できる自動化アクションはどれですか？正解を2つ選んでください。", "choices": ["項目更新", "Chatter投稿", "メールアラート", "自動起動フロー"], "correct": [0, 2], "explanation": "A．項目更新：承認プロセスの一部として、項目更新を設定することができます。たとえば、承認プロセスが完了したときに「ステータス」項目を「承認済み」に更新したり、その他の項目を自動的に更新したりすることが出来ます。これにより、手動での更新を避けてプロセスを効率化できます。\n\nC．メールアラート：承認プロセスの一環として、メールアラートを設定することもできます。たとえば、承認または却下の結果をユーザーや管理者に通知するために承認プロセス内で自動的にメールを送信することが出来ます。これにより、関係者に重要な情報を即座に届けることが出来ます。", "category": "自動化"}, {"question": "Cloud Kicksは製品別に靴のデザインを追跡したいと考えています。靴のデザインは削除できないようにし、一つの製品に対して複数のデザインが異なるフェーズで存在できるようにする必要があります。管理者はこの要件を満たすためにどのステップを設定する必要がありますか？正解を2つの答えを選んでください。", "choices": ["靴のデザイン用にカスタムオブジェクトを作成します。", "製品オブジェクトに靴のデザインのためのカスタム主従関係項目を追加します。", "製品オブジェクトに靴のデザインのためのカスタム参照項目を設定します。", "デザインのための標準オブジェクトを使用します。"], "correct": [0, 2], "explanation": "A．靴のデザインが製品ごとに異なるフェーズで複数存在するため、カスタムオブジェクトを作成するのが適切です。このカスタムオブジェクトには、デザインに関するすべての情報を格納できます。これにより、靴のデザインを追跡し、製品ごとに複数のデザインを管理できます。\n\nC．靴のデザインと製品を関連付けるためには、製品オブジェクトにカスタム参照項目を設定することが適切です。参照項目を使うことで、製品とその関連するデザインをリンクさせることができます。参照関係により、1つの製品に対して複数のデザインを異なるフェーズで保持することが可能になります。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "AW Computingは、リードオブジェクトに「Market Segment」という新しいカスタムテキスト項目を追加しました。リードが取引先に変換される際、新しい項目が取引先レコードにコピーされていません。管理者はどのようにしてリードの「Market Segment」項目がルーチンで取引先レコードにコピーされるようにすべきですか？", "choices": ["リードから取引先へカスタム項目をコピーするレコードトリガーフローを作成します。", "取引先にリードの新しい項目と全く同じ名前の項目があることを確認します。", "取引先がその項目に値を持っていることを保証する入力規則を作成します。", "リードの「Market Segment」項目が取引先の適切な項目にマッピングされていることを確認します。"], "correct": [3], "explanation": "Salesforceでは、リードが取引先、商談、または連絡先に変換される際、リードのカスタム項目は自動的に適切なターゲットオブジェクトにマッピングされる必要があります。リード変換時にカスタム項目が正しくコピーされるためにはリードの「Market Segment」項目が取引先の適切な項目にマッピングされている必要があります。これにより、リード変換時に「Market Segment」のデータが取引先にコピーされます。", "category": "セールス＆マーケティングアプリケーション"}, {"question": "Universal Containersの管理者に、ネットワーク外からSalesforceへのアクセスをユーザーができないようにするよう依頼されました。この設定に関する考慮事項は何ですか？正解を2つ選んでください。", "choices": ["IPアドレスの制限はプロファイルまたは組織全体で設定されます。", "ログイン時間を強制するために、ユーザーのプロファイルでU2Fセキュリティキーを制限します。", "IP制限を強制するために、すべてのリクエストにおいて「ログインIP範囲を強制する」を選択する必要があります。", "ネットワーク外からログインできるように、シングルサインオンを権限セットに割り当てます。"], "correct": [0, 2], "explanation": "A．IPアドレスの制限はプロファイルまたは組織全体で設定されます。IP制限は、プロファイルまたは組織全体の設定で行うことができます。これにより、特定のIPアドレス範囲からのみSalesforceにアクセスを許可し、外部からのアクセスを制限することができます。組織全体で設定する場合もあれば特定のユーザープロファイルに基づいて制限をかけることもできます。\n\nC．IP制限を強制するために、すべてのリクエストにおいて「ログインIP範囲を強制する」を選択する必要があります。IP制限を適用する際、「ログインIP範囲を強制する」オプションを有効にすることで、設定したIP範囲外からのログインを完全にブロックすることができます。これにより、ネットワーク外からのアクセスを確実に制限することが可能になります。", "category": "設定とセットアップ"}, {"question": "マーケティングチームは、アップセルプロモーションキャンペーン用に「キャンペーンメンバーステータス」項目に新しい選択リスト値を追加したいと考えています。管理者が選択リストの値を変更するために利用すべきソリューションは何ですか？正解を2つ選んでください。", "choices": ["オブジェクトマネージャーで「キャンペーンステータス」の選択リスト値を編集します。", "ページレイアウトに「キャンペーンメンバーステータス」の関連リストを追加します。", "「キャンペーンメンバーステータス」の関連リストの選択リスト値を修正します。", "「キャンペーンメンバーステータス」の関連リストを一括修正します。"], "correct": [0, 2], "explanation": "A．「キャンペーンメンバーステータス」項目は通常、オブジェクトマネージャー内で定義されており、ここで選択リスト値を編集することができます。管理者はこの画面を使って、新しい選択肢を追加したり、既存の選択肢を変更したりすることができます。\n\nC．選択リストの設定は、関連リストの設定画面からもアクセスでき、ここで必要な選択肢を追加または修正することができます。関連リストで選択リスト値を変更する操作が該当します。", "category": "セールス＆マーケティングアプリケーション"}, {"question": "AW Computingは、ユーザーが「取引先年間収益」項目を負の値や1000億ドルを超える金額に更新することを防ぎたいと考えています。この要求を達成するために、管理者はどのようにすべきですか？", "choices": ["取引先の収益が負の値または1000億を超える取引先を表示するスケジュールされたレポートを作成します。", "取引先の収益が0未満または1000億を超える場合にエラーを表示する入力規則を作成します。", "ページレイアウトで「取引先収益」項目を必須にします。", "設定で「取引先収益」の限界を有効にし、最小を0、最大を1000億とします。"], "correct": [1], "explanation": "入力規則は、レコードが保存される前に指定された条件を検証し、要件を満たさないデータの入力を防ぐために使用されます。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "モバイルナビゲーションメニューで利用可能な項目は次のうちどれですか？正解を3つ選んでください。", "choices": ["Lightningアプリページ", "Lightningホームページ", "ダッシュボード", "ユーティリティバー", "Chatter"], "correct": [0, 1, 2], "explanation": "モバイルナビゲーションメニューでは、ユーザーがモバイルアプリから簡単にアクセスできるようにさまざまな項目を含めることが可能です。", "category": "生産性向上とコラボレーション"}, {"question": "ある企業では、取引先責任者の関連を表示するために取引先責任者の階層を使用したいと考えています。取引先責任者の階層について、管理者が考慮すべき点は何ですか？", "choices": ["取引先責任者の階層は一度に3,000の取引先責任者に限定されます。", "取引先責任者の階層で表示される取引先責任者は、ユーザーによるレコードレベルのアクセスに制限されます。", "階層の列をカスタマイズすると、最近表示された取引先責任者のリストビューが変更されます。", "取引先責任者の階層で表示される取引先責任者は共有設定を無視します。"], "correct": [2], "explanation": "取引先責任者ページから階層を表示し、取引先責任者間の関係を確認できます。また、階層の列をカスタマイズして、表示する情報を調整することも可能です。", "category": "設定とセットアップ"}, {"question": "Salesforceでナレッジ記事管理システムを設計する際、ナレッジ記事と顧客ケースとの関連付けを強化するために利用する機能はどれですか？", "choices": ["連結オブジェクトを利用してナレッジ記事とケース間の関連を作成する", "選択リストを使用してナレッジ記事のカテゴリーを分類する", "入力規則を設定してナレッジ記事の内容の品質を保証する", "大規模商談アラートを利用してナレッジ記事更新を通知する"], "correct": [0], "explanation": "連結オブジェクトを使用することで、ナレッジ記事とケース間の明確な関連を作成できます。Salesforceでは「ケース記事（Case Article）」という連結オブジェクトを活用することで、ケースとナレッジ記事の関連付けを管理できます。これにより、サポートエージェントがケース解決時に適切な記事を参照したり、リンク付けたりできるようになります。", "category": "サービス＆サポートアプリケーション"}, {"question": "AWコンピューティングの管理者は、Salesforceにログインできない問題を抱えているユーザーと協力しています。管理者は、なぜそのユーザーがログインできないのかを特定するために何をすべきですか？", "choices": ["セキュリティトークンを確認する", "パスワード履歴を確認する", "ログイン履歴を確認する", "パスワードポリシーを確認する"], "correct": [2], "explanation": "ログイン履歴を確認することで、ユーザーがログインに失敗した理由を特定できます。Salesforceのログイン履歴には、成功および失敗したログイン試行が記録されており、失敗した場合にはその理由が記載されています。", "category": "設定とセットアップ"}, {"question": "Cloud Kicksのカスタマーサクセスエージェントが休暇を取ることになり、複数のケースの所有者を変更する必要があります。この要求を達成できるユーザーは次のうちどのユーザーですか？正解を2つ選んでください。", "choices": ["システム管理者プロファイルを持つユーザー", "ケースの管理権限を持つユーザー", "取引先の読み取り権限を持つユーザー", "エージェントより上位のマネージャー役割を持つユーザー"], "correct": [0, 1], "explanation": "A．システム管理者は全てのオブジェクトやレコードへの完全なアクセス権を持ち、他のユーザーのケースの所有者を変更できます。\n\nB．ケースの管理権限（\"ケースの管理\"または\"ケースのすべてのデータを表示\"権限）を持つユーザーは、ケースの所有者を変更できます。", "category": "サービス＆サポートアプリケーション"}, {"question": "Cloud Kicksには、同じ画面上に2つの質問があるスクリーンフローがありますが、一度に必要なのは1つの質問だけです。管理者に対して、必要な質問のみを表示するよう依頼されました。管理者はこれをどのように実行すべきですか？", "choices": ["条件付き可視性を使用して不要な質問を隠す。", "判断項目と新しい画面を使用して適切な質問を表示する。", "各シナリオごとにフローの新しいバージョンを使用する。", "フロースクリーンで分岐を使用して適切なシナリオを表示する。"], "correct": [0], "explanation": "条件付き可視性は、フローの画面上で特定の条件が満たされた場合にのみ特定の要素を表示する機能です。これにより、同じ画面上で複数の質問を持たせつつ、必要な質問のみを動的に表示することができます。", "category": "自動化"}, {"question": "Ursa Major Solarのマーケティングチームは、ウェブサイトのWeb-to-Leadフォームをリードが入力した際にパーソナライズされたメールを送信したいと考えています。彼らは、リードの業界項目の値に基づいて異なるメッセージを送信したいと考えています。管理者は何を設定する必要がありますか？", "choices": ["入力規則を使用して、リードにメールを送信するワークフローをトリガーします。", "リードにメールを送るための割り当てルールを作成します。", "公開グループを追加し、リードにメールを送るためのプロセスビルダーを使用します。", "リードにメールを送るための自動応答ルールを設定します。"], "correct": [3], "explanation": "自動応答ルールは、Web-to-Leadフォームが送信された際に、リードの特定の条件に基づいて自動的にカスタマイズされたメールを送信するために使用できます。条件を定義し、それに基づいて異なるテンプレートを使用するメールを送信できるため、このシナリオに最適です。", "category": "セールス＆マーケティングアプリケーション"}, {"question": "Cloud Kicksのユーザーは、商談の種類に基づいて商談オブジェクトにカスタム選択リストをアップロードする際、異なるオプションを報告しています。管理者は選択リストのオプションをどこで更新すべきですか？", "choices": ["関連する参照フィルター", "項目とリレーション", "レコードタイプ", "選択リスト値セット"], "correct": [1], "explanation": "既存の選択リスト項目を更新する場合、設定画面から「オブジェクトマネージャー」を開き、「商談」オブジェクトを選択し、「項目とリレーション」から、編集したい選択リスト項目を選択します。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "Salesforceでユーザにロールを割り当てる目的として、適切なものは次のうちどれですか？", "choices": ["レコードレベルの共有とデータアクセスの制御", "プロファイルに基づくオブジェクト権限の設定", "Salesforceのライセンスをアクティベートする", "Lightningアプリケーションのレイアウトを変更する"], "correct": [0], "explanation": "ロールは組織内の階層に基づいてデータアクセスを管理します。プロファイルは機能権限を制御しますが、レコードの共有はロール階層に基づいて決まります。", "category": "設定とセットアップ"}, {"question": "Northern Trail Outfittersの管理者は、割り当てられたライセンスと権限セットを追跡するためにスプレッドシートを使用しています。この追跡をSalesforceでどの機能を使用して行うことができますか？", "choices": ["Lightning使用状況アプリ", "ログイン履歴", "ユーザーレポート", "権限セットグループ"], "correct": [2], "explanation": "Salesforceでは、ユーザーレポートを使用して、ユーザーに割り当てられたライセンスや権限セットを追跡できます。ユーザーオブジェクトに関するレポートを作成することで、ライセンスや権限セットの情報を簡単に確認できます。", "category": "設定とセットアップ"}, {"question": "Universal Containerの管理者は、二つのオブジェクト「Containers_c」と「Purchase_c」を作成しました。管理部は、すべての取引先のレコードが商談レコード上に表示されるよう要求しています。Containers_cとPurchase_cの間にどのような関連を作成すれば要件を満たすことができますか？", "choices": ["式項目", "積み上げ集計項目", "主従関係項目", "参照項目"], "correct": [3], "explanation": "参照項目を使用して、異なるオブジェクト間に関係を作成することができます。この場合、Containers_cとPurchase_cの間に参照項目を作成することで、商談（取引先）のレコード上にこれらのオブジェクトの情報を表示することができます。商談オブジェクトと関連する他のオブジェクト（Containers_cやPurchase_c）を参照するためには、参照項目を作成して、その情報を商談のページに表示させることができます。", "category": "セールス＆マーケティングアプリケーション"}, {"question": "Ursa Major Solarの管理者が間違ってオブジェクトにレコードをインポートしてしまいました。このインポートを元に戻すために使用すべきツールはどれですか？2つの回答を選択してください。", "choices": ["週次データエクスポート", "データローダー", "一括削除", "データインポートウィザード"], "correct": [1, 2], "explanation": "B．データローダーを使用して、レコードをインポートまたはエクスポートすることができます。また、誤ってインポートしたレコードを削除するために、データローダーを使って削除操作を行うことができます。データローダーは、複数のレコードを削除するための高度なオプションも提供しています。\n\nC．一括削除ツールは、インポートしたデータを削除するために使用できます。このツールを使用して、間違ってインポートされたレコードを一度に削除することができます。", "category": "データ管理＆分析"}, {"question": "AW Computingでは、商談が失注として終了した際に、リッチテキスト項目で理由を記録する必要があります。管理者はこの要件をどのように設定すべきですか？", "choices": ["ページレイアウトの理由項目の隣にある必須チェックボックスを選択します。", "オブジェクトマネージャーで損失理由項目の必須チェックボックスをオンにします。", "フェーズが失注で理由が空白の場合にエラーを表示する入力規則を作成します。", "理由が空白の場合にエラーを表示するワークフロールールを設定します。"], "correct": [2], "explanation": "入力規則を使って、商談のフェーズが「失注」の場合に、リッチテキスト項目（理由）の入力を必須にすることができます。これにより、商談が失注として終了する際に必ず理由が記入されるようになります。入力規則は、条件に基づいてフィールドの入力を強制するため非常に適しています。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "Dreamhouse Realtyのセールス部門のVPは、異なるチームを通じて企業セールスを視覚化するダッシュボードを要求しました。主要なデータポイントは、年間の総売上と企業セールス目標への進捗です。この数字と目標総額への近接度を単一の値で効果的に示すダッシュボードコンポーネントはどれですか？", "choices": ["テーブル", "ゲージ", "ドーナツ", "スタックドバー"], "correct": [1], "explanation": "ゲージは、数値の進捗や目標達成度を視覚的に示すために最適なダッシュボードコンポーネントです。年間の総売上と企業セールス目標への進捗を示すため、ゲージは売上の進行状況を一目で確認でき、目標に対する近接度を視覚的に示すことができます。", "category": "データ管理＆分析"}, {"question": "Salesforceでカスタムレポートタイプを作成する際に、関連する取引先責任者とToDo情報を包括的に表示するためには、どのオブジェクト関連を利用するべきですか？", "choices": ["主従関係を使用してToDoと取引先責任者を結びつける", "参照関係を使用して取引先責任者からToDoへリンクする", "連結オブジェクトを使用して取引先責任者とToDoの間に関連を作成する", "条件に基づく共有ルールを設定してアクセスを制御する"], "correct": [1], "explanation": "参照関係は、異なるオブジェクト間で関連を作成するのに最も一般的に使用されます。ToDo（タスク）は取引先責任者（Contact）に関連付けられることが一般的で、取引先責任者とToDo間に参照関係を設定することで、関連するToDo情報を取引先責任者に結びつけることができます。カスタムレポートタイプを作成する際、関連するオブジェクト（取引先責任者とToDo）を結びつけるために参照関係が有効であり、これにより両方のオブジェクトをレポートに組み込むことが可能になります。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "Cloud KicksはAppExchangeからアプリを試して、自社のニーズに合っているか確認したいと考えています。管理者はどの二つのオプションを提案すべきですか？正解を2つ選択してください。", "choices": ["本番環境でのテストドライブ。", "Trailhead Playgroundにダウンロードする。", "エディションの互換性を確認する。", "サンドボックスにインストールする。"], "correct": [1, 3], "explanation": "B．Trailhead Playgroundは、Salesforceを安全に試すための環境であり、アプリケーションをインストールしてテストするのに最適な場所です。これは本番環境に影響を与えず、学習や評価を行うために使用されます。データや設定が本番環境と直接関連しないため、安心して試すことができます。\n\nD．サンドボックスは、本番環境のコピーであるため、アプリを本番環境のデータに影響を与えることなくテストできます。これにより、アプリケーションの動作や互換性を本番データを使って検証することができます。サンドボックスはテストや開発のために使用され、問題が発生しても本番環境には影響しません。", "category": "設定とセットアップ"}, {"question": "Universal Containers (UC)は、各取引先に関連付けられている未解決のケースの数をカウントし、この値を毎週金曜日の夕方に取引先を更新することを希望しています。UCには常時数百の未解決ケースがあります。管理者はこの要求を達成するために何を使用すべきですか？", "choices": ["スケジュールされたプロセスビルダーを使用する。", "レコードトリガーフローを使用する。", "積み上げ集計項目を使用する。", "スケジュールされたフローを使用する。"], "correct": [3], "explanation": "スケジュールされたフローを使用することで、毎週金曜日の夕方に取引先を更新する自動化を実行できます。フロー内で、関連する未解決のケース数を集計し、その情報を取引先に反映させることができます。スケジュールされたフローは定期的に実行できるため、要件に合致します。", "category": "自動化"}, {"question": "Salesforce Lightningコンポーネントを開発する際、具体的なユーザーインタラクションに対応するために何を使用しますか？", "choices": ["Apexトリガー", "入力規則", "静的リソース", "Lightningイベント"], "correct": [3], "explanation": "Lightningイベントは、Salesforce Lightningコンポーネント間で通信を行うためのメカニズムです。ユーザーのインタラクションに対応するため、イベントを発行してコンポーネント間でデータや状態をやり取りすることができます。これにより、ユーザーがボタンをクリックしたり、入力フィールドに変更を加えた際のアクションに対して適切に反応できます。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "Salesforceでカスタムアプリケーションを開発する際、新しい商談の成約確度を自動計算するためにはどの機能を使用するのが最適ですか？", "choices": ["カスタム項目と入力規則", "積み上げ集計項目", "Apexクラスとトリガー", "ワークフロー規則とアクション"], "correct": [2], "explanation": "商談の成約確度を自動的に計算する場合、Apexクラスとトリガーを使用するのが最適です。Apexを使用することで、商談の成約確度を計算するためのロジックを柔軟に実装でき、ビジネスロジックに基づいて動的に値を更新できます。トリガーを使って、商談レコードが作成または更新されるたびに計算を自動的に行うことができます。", "category": "セールス＆マーケティングアプリケーション"}, {"question": "カスタマーサービスは、サービスクラウドコンソール上のナレッジライトニングコンポーネントを使用してナレッジ記事にアクセスしています。請求部門のユーザーもコンソールを使用せずにケースレコードで同様の機能を希望しています。管理者はこの要望をどのように設定すべきですか？", "choices": ["ページレイアウトにナレッジコンポーネントを追加する。", "ページレイアウトにナレッジコンポーネントリストを追加する。", "レコードページにナレッジ関連リストを追加する。", "ページレイアウトにナレッジ関連リストを追加する。"], "correct": [3], "explanation": "ナレッジ記事をケースに関連付けて表示したい場合、ページレイアウトに「ナレッジ関連リスト」を追加するのが最適です。この関連リストでは、ケースに関連するナレッジ記事が表示され、ユーザーがナレッジ記事に簡単にアクセスできるようになります。請求部門のユーザーは、サービスコンソールを使用しなくても、ケースページでナレッジ記事を確認できるようになります。", "category": "サービス＆サポートアプリケーション"}, {"question": "Northern Trail Outfittersの管理者がSalesforceに新しいユーザーを追加できない状況です。この問題を引き起こす可能性があるのはどれですか？", "choices": ["ユーザー名が企業のメールアドレスではありません", "ユーザー名が既に使用されています", "ユーザー名が偽のメールアドレスです", "ユーザー名が80文字未満です"], "correct": [1], "explanation": "Salesforceでは、各ユーザーには一意のユーザー名が必要です。このユーザー名は、Salesforce内で一度しか使用できません。もし、同じユーザー名がすでに他のアカウントで使用されている場合、新しいユーザーを作成することができません。したがって、ユーザー名が既に使用されていることが問題を引き起こす原因になります。", "category": "設定とセットアップ"}, {"question": "Ursa Major Solarの管理者に、作業項目とプロジェクトのカスタムオブジェクト関係を主従関係から参照関係に変更するよう依頼されました。どのシナリオがこの要件の実行を防ぐ可能性がありますか？", "choices": ["すべてのレコードの参照項目に値が含まれています。", "参照をサポートするために連結オブジェクトが必要です。", "レコードを保存するために参照項目が必要です。", "マスターオブジェクトに積み上げ集計項目が存在します。"], "correct": [3], "explanation": "主従関係のオブジェクトには積み上げ集計項目が存在する場合、参照関係に変更することができません。積み上げ集計項目は親オブジェクトのデータに基づいて計算されるため、親オブジェクトのレコードを変更することができなくなります。参照関係に変更すると、積み上げ集計項目が機能しなくなるため、これを変更することは出来ません。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "Cloud Kicksにおいて、商談が交渉段階に達すると、営業ユーザーにとって金額の項目が必須となります。営業マネージャーは、金額を知らなくてもこの段階に商談を進めることができる必要があります。管理者は営業ユーザーに対して交渉段階でこの項目が必要となるように設定し、そのマネージャーが変更できるようにするにはどうすればよいですか？", "choices": ["マネージャー用に項目を自動的に入力する計算項目を作成する。", "すべてのユーザーに対して項目を必須にする。", "マネージャーに管理者のプロファイルを割り当てる。", "条件を満たす入力規則を設定する。"], "correct": [3], "explanation": "このシナリオでは、営業ユーザーが商談の交渉段階に達した場合に金額項目を必須にしたいが、営業マネージャーは金額項目を知っていなくても商談を進められるようにしたいという要件です。入力規則を使用すると、特定の条件で金額項目を必須にすることができます。一方、営業マネージャーが金額を知らなくても進められるようにするためには、入力規則を調整して、マネージャーのユーザーに適用しないようにすることができます。これにより、営業ユーザーとマネージャーに異なるルールを適用することが可能です。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "Dreamhouse Realtyのエージェントがオープンハウスイベントの夜にダブルブッキングしています。イベントマネージャーはエージェントがイベントの詳細や日付をリクエストできるようなイベント提出プロセスを希望しています。管理者はこの要求をどのように達成すべきですか？", "choices": ["イベント日付項目を更新するためのワークフローの役割を作成します。", "エージェントがイベントの日付をリクエストできるキャンペーンを作成します。", "他のエージェントがイベントを閲覧できるように共有ルールを作成します。", "キャンペーンオブジェクトに承認プロセスを作成します。"], "correct": [3], "explanation": "イベントマネージャーがエージェントにイベントの日付をリクエストできるようにするためには、承認プロセスを使用するのが適切です。承認プロセスを設定することで、エージェントが提出したイベントの詳細や日付に関するリクエストをイベントマネージャーが承認または却下できるようになります。これにより、ダブルブッキングを防ぐための効率的なプロセスが作成されます。", "category": "自動化"}, {"question": "AW Consultingの管理者はカスタム選択リスト項目を作成しました。ビジネスユーザーからはテキスト項目であるように要求されました。管理者は項目のタイプを変更しようと試みましたが、他の機能によって参照されているため変更できませんでした。どの機能が項目タイプの変更を防いでいますか？", "choices": ["数式項目", "Javascript", "Visualforce", "レコードタイプ"], "correct": [3], "explanation": "項目タイプを変更できない原因は、選択リスト項目がレコードタイプに関連付けられているためです。Salesforceでは、レコードタイプが異なるページレイアウトやビジネスプロセスを管理するために使用されます。選択リスト項目がレコードタイプに関連付けられていると、その項目のタイプを変更することが出来ません。項目タイプを変更するには、まずレコードタイプの関連を解除する必要があります。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "カスタムアプリを作成するプロセスはどのようなものですか？", "choices": ["新しいオブジェクトの作成、ロゴの選択、プロファイルの作成", "新しいアプリを作成し、ロゴを選択し、プロファイルを割り当てます", "タブの作成、レポートの設定、ダッシュボードの構築", "ロールの定義、ユーザーのインポート、レコードタイプの設定"], "correct": [1], "explanation": "カスタムアプリを作成する際の基本的なプロセスは新しいアプリケーションを作成して、そのアプリに関連するロゴを選択して、ユーザーにアクセスできるようにプロファイルを割り当てることです。このプロセスはユーザーがSalesforceでカスタムアプリを効果的に利用できるようにするための最初のステップです。", "category": "設定とセットアップ"}, {"question": "Salesforce Lightning Experienceで、ユーザーがダッシュボードをより効率的に利用するために管理者が行うことができるアクションは何ですか？正解を2つ選んでください。", "choices": ["ダッシュボードのデータソースとして外部オブジェクトを設定する", "ダイナミックダッシュボードを作成して、各ユーザーが自分のデータのみを見ることができるようにする", "カスタムJavaScriptを使用して、ダッシュボード内でインタラクティブなビジュアライゼーションを作成する", "ダッシュボードをスケジュールして、定期的にユーザーのメールボックスに送信する"], "correct": [1, 3], "explanation": "B．ダイナミックダッシュボードは、ユーザーごとに異なるデータを表示することができるため、ユーザーが自分に関連する情報のみを見ることができ、ダッシュボードをより効率的に利用できます。これにより、ユーザーは必要な情報を迅速に取得でき、データの可視性が向上します。\n\nD．ダッシュボードのスケジューリング機能を利用することで、ユーザーは定期的に最新のデータをメールで受け取ることができ、ダッシュボードにアクセスする必要がなくなります。これにより、ユーザーは必要な情報を即座に受け取ることができ、効率的に活用できます。", "category": "データ管理＆分析"}, {"question": "DreamHouse不動産は、新しい住宅管理サービスを発表しました。この商品は、同社が過去に提供したものとは異なるビジネスモデルです。この要件を満たすために、管理者は何を設定すべきでしょうか。", "choices": ["新しいクイックアクションを作成する。", "新しい商談商品を作成する。", "新しいセールスプロセスを作成する。", "新しい承認プロセスを作成する。"], "correct": [1], "explanation": "新しい住宅管理サービスが提供される場合、これに対応する新しい商談商品を作成することで、商品として管理・販売できるようになります。", "category": "セールス＆マーケティングアプリケーション"}, {"question": "Universal Containers社は、商談がクローズされた場合、同じ取引先にある他のすべてのオープンな商談がクローズされたものとしてマークされなければならないことを要求しています。管理者は、この要求を実装するためにどの自動化ソリューションを使用する必要がありますか。", "choices": ["ワークフロルール", "クイックアクション", "フロービルダー", "アウトバウンドメッセージ"], "correct": [2], "explanation": "フロービルダーは複雑な条件付きロジックや関連レコードの更新を自動化するのに最適なツールです。このケースでは、「特定の商談がクローズされた場合、同じ取引先に属する他のオープンな商談をすべてクローズする」という条件付きの処理を実現する必要があるため、フロービルダーが適しています。", "category": "セールス＆マーケティングアプリケーション"}, {"question": "Universal Containers社のIT管理者がシステムのセキュリティ監査を行っています。管理者は、システムのセキュリティの健全性をどのようにまとめればよいでしょうか。", "choices": ["イベントモニタリングをオンにして、ユーザーイベントを追跡する。", "組織全体のデフォルトを非公開に変更し、可視性を制限する。", "過去6か月分のユーザーログインデータをダウンロードする。", "セキュリティ状態チェックを実行して脆弱性を特定する。"], "correct": [3], "explanation": "セキュリティ状態チェックは、Salesforceのセキュリティ設定を評価し、脆弱性を特定して全体的なセキュリティの健全性をまとめるのに最適なツールです。この機能により、組織のセキュリティのスコアを確認し、改善すべき領域を特定できます。", "category": "設定とセットアップ"}, {"question": "Salesforce の Lightning Experience において、取引先責任者が取引先の変更に応じて自動で更新されるように設定するために最も適した機能はどれですか？", "choices": ["入力規則を設定する", "プロセスビルダーを使用して自動化する", "条件に基づく共有ルールを使用する", "主従関係を設定する"], "correct": [1], "explanation": "プロセスビルダーは、Salesforce内で発生したイベントや条件に基づいてレコードを自動的に更新するためのツールです。この場合、「取引先の変更に応じて取引先責任者を更新する」という要件を満たすために最適です。プロセスビルダーを使用すれば、取引先が変更されたときに取引先責任者レコードをトリガーして必要なフィールドを更新できます。", "category": "自動化"}, {"question": "Cloud Kicks社の分析ユーザーは、オブジェクトの参照、作成、編集のアクセス権が必要で、レコードの削除を制限する必要があります。この要件を満たすために管理者は何をすべきですか。", "choices": ["参照、作成、編集を含む権限セットを作成し、割り当てる。", "分析ユーザーに標準のシステム管理者プロファイルを割り当てる。", "各オブジェクトの削除アクセス権が削除されたカスタムプロファイルを作成し、割り当てる。", "分析ユーザーに［すべて表示］権限を与え、ロール階層で最も高いロールに割り当てる。"], "correct": [2], "explanation": "プロファイルは、ユーザーがオブジェクトに対して持つ基本的なアクセス権を制御するためのツールです。このケースでは、「参照、作成、編集は可能で、削除を制限する」という要件を満たすため、カスタムプロファイルを作成し、該当オブジェクトの削除権限を取り除くことで適切なアクセス制御を実現できます。", "category": "設定とセットアップ"}, {"question": "主従関係の特徴はどれですか。3つ選びなさい。", "choices": ["積み上げ集計項目は主従関係でのみサポートされる。", "従レコードの所有者項目は、主レコードの所有者である。", "標準またはカスタムオブジェクトを主オブジェクトにできる。", "従レコードの権限は、主従関係とは別に設定される。", "各オブジェクトは、最大5つの主従関係を持つことができる。"], "correct": [0, 1, 2], "explanation": "A．積み上げ集計項目は主従関係でのみサポートされる\n主従関係では、親オブジェクトで子オブジェクトのデータを集計する積み上げ集計項目を設定できます。これが主従関係の大きな特徴です。\n\nB．従レコードの所有者項目は、主レコードの所有者である\n主従関係では、従レコードの所有権は主レコードと同じ所有者になります。このため、従レコードは主レコードに厳密に依存しています。\n\nC．標準またはカスタムオブジェクトを主オブジェクトにできる\n主オブジェクトとして設定できるのは、標準オブジェクトやカスタムオブジェクトです。ただし、いくつかの例外（例：一部の標準オブジェクトは主オブジェクトとして使えない等）がある点に注意が必要です。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "Salesforce組織で新しいフェーズトラッキングシステムを実装するとき、商談オブジェクトに追加すべき最も適切なカスタム項目タイプは何ですか？", "choices": ["主従関係", "選択リスト", "ナレッジ", "参照"], "correct": [1], "explanation": "商談のフェーズトラッキングには、事前に定義された選択肢から進捗段階を選択できるフィールドが最適です。選択リスト（Picklist）フィールドを使用することで、商談の各段階を追跡することができます。ユーザーが適切なフェーズを選択できるようになり、データの整合性も保たれます。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "Ursa Solar Major社は、サービスチーム向けにSalesforceを評価しています。サポートのユースケースを考えている管理者が利用できる標準オブジェクトはどれですか。3つ選びなさい。", "choices": ["チケット", "リクエスト", "契約", "取引先", "ケース"], "correct": [2, 3, 4], "explanation": "C．契約\nSalesforceでは契約オブジェクトは、顧客との合意事項や契約内容を管理するために使用されます。サポートユースケースでは、顧客との契約状況に基づいてサポートを提供するために役立ちます。\n\nD．取引先\n取引先は、顧客や会社を管理する基本的なオブジェクトです。サポートチームが顧客情報を追跡し、サポートの対応を行う際に使用します。\n\nE．ケース\nケースは、顧客からの問い合わせやサポートリクエストを追跡するための主要なオブジェクトです。サポートチームが顧客の問題を管理し解決するために使います。", "category": "サービス＆サポートアプリケーション"}, {"question": "Northern Trail Outfitters社のマーケティングディレクターが、リードの状況項目を”適格”とマークするために予算項目に入力するよう要求しています。この要求を満たすために、管理者はどのツールを使用すべきですか。", "choices": ["リード変換", "入力規則", "必須項目", "ワークフロールール"], "correct": [1], "explanation": "入力規則は、ユーザーが特定の条件を満たさない限りレコードを保存できないようにするためのツールであり、リードの状況項目を「適格」とマークするために、予算項目に入力を要求する設定は入力規則で実現できます。入力規則を使用することで、予算項目が入力されていない場合にリードの状況を「適格」に変更できないようにすることが出来ます。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "Salesforceで安全なデータ共有のために特定の取引先に対する取引先責任者のアクセス権を設定する場合、どの機能を使用するのが最適ですか？", "choices": ["入力規則", "条件に基づく共有ルール", "ナレッジベースの管理", "主従関係の設定"], "correct": [1], "explanation": "条件に基づく共有ルールは、ユーザーやロールに基づいてレコードの共有を制御するために使用されます。取引先に関連する取引先責任者のアクセス権を制限する場合、この機能を使用することで特定の条件に合致するユーザーにのみアクセスを提供することが出来ます。", "category": "設定とセットアップ"}, {"question": "Salesforceでコントローラークラス内で動的に商談のフェーズを更新する際に、どのメソッドを使用するのが最適ですか？", "choices": ["Apexクラスを使用してスケジュール実行します。", "DML操作を使用してデータベースに変更を反映させます。", "ViewStateを保存してクライアント側の性能を向上させます。", "非同期処理を用いてバックグラウンドで更新を行います。"], "correct": [1], "explanation": "Salesforceで商談のフェーズを動的に更新する場合、DML操作を使用して、商談オブジェクトのレコードを直接更新することが最適です。DML操作を使うことで、データベースに変更を即座に反映させることができ、商談フェーズをプログラム的に更新することが出来ます。", "category": "セールス＆マーケティングアプリケーション"}, {"question": "Northern Trail Outfittersには、新しいケースを作成するカスタムクイックアクションが取引先にあります。管理者はこのクイックアクションをSalesforceモバイルアプリで利用可能にするためにどうすべきですか？", "choices": ["アクションを含めるためにコンパクトなケースページレイアウトを変更する。", "アクションが含まれるカスタムLightningアプリを作成する。", "アクションをSalesforceモバイルナビゲーションメニューに含める。", "ページレイアウトにSalesforceモバイルおよびLightning Experienceアクションを追加する。"], "correct": [3], "explanation": "Salesforceモバイルアプリにカスタムクイックアクションを表示するためには、該当するページレイアウトにそのアクションを追加する必要があります。「Salesforceモバイルおよび Lightning Experience アクション」セクションに追加することで、モバイルアプリでそのアクションを利用可能に出来ます。", "category": "生産性向上とコラボレーション"}, {"question": "ウルサメジャーソーラーの管理者が、外部の会計システムに情報を送信する必要があります。この目的を達成するために、管理者が使用すべきワークフローアクションは何ですか？", "choices": ["タスクの割り当て", "アウトバウンドメッセージ", "カスタム通知", "レコードの作成"], "correct": [1], "explanation": "アウトバウンドメッセージは、Salesforceから外部システムに情報を送信するために使用されるワークフローアクションです。このアクションを使うことで、Salesforceのレコード情報を外部の会計システムなどに自動的に送信できます。例えば、外部APIを呼び出してデータを送信するために使用されます。", "category": "自動化"}, {"question": "ウルサメジャーソーラーの管理者は、VIP顧客からの未割り当てのケースが5時間以内に適切なサービス担当者に転送されるようにする必要があります。VIP顧客は1日24時間サポートを受けることができます。これをどのように設定すべきですか？", "choices": ["割り当てルール", "エスカレーションルール", "ケースキュー", "営業時間"], "correct": [1], "explanation": "エスカレーションルールは、Salesforceでケースが一定の条件を満たした場合に、指定された時間内で自動的にエスカレーション（転送）される仕組みです。VIP顧客からのケースが5時間以内に適切なサービス担当者に転送されるようにするためには、エスカレーションルールを使用して、ケースの転送タイミングや担当者を設定します。", "category": "サービス＆サポートアプリケーション"}, {"question": "管理者がLightningアプリを構築していると、最初に「マイドメイン」を設定する必要があるというメッセージが表示されました。マイドメインを有効にする際に、管理者は何を考慮すべきですか？", "choices": ["マイドメインを実装する前に、シングルサインオンを無効にする必要があります。", "内部および外部の全ユーザーのログインがマイドメインのログインに変更されます。", "マイドメインのURLインスタンスは、すべてのリリースで同じままです。", "配備されたマイドメインは元に戻すことができず、名前の変更もできません。"], "correct": [1], "explanation": "マイドメインを有効にすると、内部および外部のすべてのユーザーが新しいマイドメインURLを通じてSalesforceにログインすることになります。これにより、Salesforce環境へのアクセスが統一され、セキュリティの向上やカスタマイズされたドメインの使用が可能になります。", "category": "設定とセットアップ"}, {"question": "クラウドキックスの営業部副社長は、商談を保存する際にエラーメッセージを受け取り、保存ができない状況です。管理者も同じ編集を試みましたが、エラーは発生しませんでした。管理者はユーザーが受け取っているエラーをどのように検証すべきですか？", "choices": ["ページレイアウトを編集する。", "ユーザーとしてログインする。", "セットアップ監査トレイルを見る。", "共有モデルを確認する。"], "correct": [1], "explanation": "ユーザーとしてログイン（ログイン・アズ・ユーザー機能）を使うと、実際にそのユーザーの視点でSalesforceを操作でき、エラーメッセージが発生する原因をユーザーが経験している状況で確認できます。ユーザーの権限やページレイアウトなど、特定の設定が原因でエラーが発生している場合も、実際にログインしてみることにより確認できます。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "グローバルチームのSalesforceユーザーをサポートする管理者は、会社の設定を構成するよう求められました。管理者が構成すべきオプションはどれですか？正解を2つ選んでください。", "choices": ["パスワードポリシー", "ログイン時間", "通貨設定", "デフォルト言語"], "correct": [2, 3], "explanation": "C．複数の国や地域でビジネスを行っている場合、適切な通貨設定を行うことは非常に重要です。Salesforceではユーザーの地域に応じて異なる通貨を使用することができ、これをグローバルなチームに対して設定することが求められます。\n\nD．グローバルチームをサポートするためには、各ユーザーのデフォルト言語を設定することが重要です。これにより、Salesforceが異なる言語に対応できるようになり、ユーザーが自分の言語でインターフェースを利用できるようになります。", "category": "設定とセットアップ"}, {"question": "AWコンピューティングの営業およびマーケティングチームのために、締め切りが迫っているダッシュボードを作成する必要がある管理者がいます。予算を増やさずに締め切りを守るために、管理者は何をすべきでしょうか？", "choices": ["AppExchangeで簡単にカスタマイズできる既製のソリューションをチェックする。", "営業およびマーケティングチームの誰かをトレーニングしてダッシュボードを作成させる。", "カスタムダッシュボードの構築のためにコンサルタントを雇う。", "締め切りに間に合わせるために、ダッシュボードを手作業で作成する。"], "correct": [0], "explanation": "AppExchangeはSalesforceの公式アプリケーションマーケットプレイスで、既製のダッシュボードテンプレートやソリューションが提供されています。これを利用すれば、予算を増やすことなく迅速にダッシュボードを作成でき、時間内に締め切りを守ることができます。多くのソリューションは簡単にカスタマイズ可能で、迅速に導入できるため、時間とコストの両方を節約できます。", "category": "データ管理＆分析"}, {"question": "クラウドキックスの営業ユーザーは、取引先オブジェクトの業種項目のデータが商談ページレイアウトに表示されることを要望しています。管理者がこの要件を達成するために作成すべき項目のタイプは何ですか？", "choices": ["カスタム取引先項目", "クロスオブジェクト式項目", "標準取引先項目", "主従関係項目"], "correct": [1], "explanation": "営業ユーザーが商談ページレイアウトに取引先オブジェクトの業種項目を表示させたい場合、クロスオブジェクト式項目を作成するのが最適です。クロスオブジェクト式項目を使用すると、異なるオブジェクト（当問題の場合、取引先と商談）のデータを関連付けて表示できます。この方法で、取引先オブジェクトの業種を商談オブジェクトに表示することが出来ます。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "Salesforceのレポートスケジューリングに関する次の記述のうち、正しいものはどれですか？", "choices": ["スケジュールされたレポートは、Salesforce内の任意のユーザーに送信することが可能です。", "レポートをスケジュールするには、少なくとも「編集者」権限が必要です。", "Salesforceでは、レポートを毎週月曜日のみスケジュールすることはできません。", "スケジュールされたレポートの結果は、PDF形式でのみ受け取ることができます。"], "correct": [0], "explanation": "Salesforceではスケジュールされたレポートの結果をメールでSalesforce内の任意の有効なユーザーに送信することが可能です。これにより、必要なレポート情報を適切な関係者と定期的に共有することが出来ます。", "category": "データ管理＆分析"}, {"question": "Salesforceのダッシュボードに関して、管理者がユーザーに最適なビジュアル表現を提供するために実施できるアクションはどれですか？正解を2つ選んでください。", "choices": ["各ユーザーが自分のデータでダッシュボードを表示できるようにする。", "ダッシュボードのコンポーネントに静的なフィルターを適用する。", "ダッシュボードをスケジュールして、特定の時間にユーザーに自動的に送信する。", "カスタムリダイレクトを使用して、ユーザーが特定のレポートに簡単にアクセスできるようにする。"], "correct": [0, 2], "explanation": "A．Salesforceでは、動的ダッシュボードを使用することで、各ユーザーが自分のデータに基づいてダッシュボードを表示できます。これにより、不要な情報を排除し、個々のユーザーに関連するビジュアルを提供できます。\n\nC．ダッシュボードのスケジュール機能を使えば、定期的に最新のデータを含むダッシュボードをメールで送信できます。これにより、ユーザーが定期的に更新された情報を簡単に確認できます。", "category": "データ管理＆分析"}, {"question": "Salesforce Lightning Experienceにおいて、ユーザーエクスペリエンスとデータの整合性を向上させるために管理者が利用することが推奨される機能はどれですか？", "choices": ["入力規則を設定して、データ入力時の誤りを最小限に抑える。", "積み上げ集計項目を使用して、関連リスト内のデータを集約する。", "プロセスビルダーを使用して、レコード作成の自動化を行う。", "カスタムレポートタイプを作成して、複雑なデータ分析を可能にする。"], "correct": [0, 2], "explanation": "A．入力規則を使用すると、ユーザーが特定の基準を満たさないデータを保存しないように制限できます。これにより、データの一貫性が向上し、エラーが減少します。\nC．プロセスビルダーを活用すると、ビジネスプロセスを効率化し、手動でのデータ入力や操作を削減できます。これにより、ユーザーエクスペリエンスが向上します。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "ユニバーサルコンテナーズの管理者は、ユーザーが新しいリードを作成するのを支援するスクリーンフローを持っています。リードソースが「検索エンジン」の場合、管理者はユーザーに特定の検索エンジンを選択リストから選ぶことを要求する必要があります。リードソースが「検索エンジン」でない場合、この選択リストは隠されるべきです。管理者はこの要件をどのように満たすべきですか？", "choices": ["特定の検索エンジンのための選択リストを作成し、条件付きの可視性を設定してリードソースが「検索エンジン」の場合にのみ表示されるようにする。", "リードソースが「検索エンジン」の場合とそれ以外の場合で、割り当て要素を使用する。", "「検索エンジン」がリードソースである場合のみ特定の検索エンジンを含む二番目の画面にユーザーを誘導するために決定要素を割り当てる。", "特定の検索エンジンのための選択リストを設定し、リードソースが「検索エンジン」の場合にのみ条件付きで表示されるように入力規則を使用する。"], "correct": [0], "explanation": "条件付き可視性の設定は、Salesforceのスクリーンフローで使用できる機能です。この設定を使用すると、特定のフィールドやコンポーネントを表示する条件を柔軟に定義できます。この要件では「リードソースが『検索エンジン』の場合にのみ特定の選択リストを表示する」ため、条件付き可視性が最適な解決策です。", "category": "自動化"}, {"question": "Salesforceの営業プロセスにおいて、商談レコードのフェーズが”提案／見積もり”から”交渉／レビュー”に変更される際に自動的に行われるべきアクションは何ですか？", "choices": ["積み上げ集計項目の更新", "定期的な商談レビューのスケジュール設定", "商談に関連する取引先責任者に自動メール通知を送信", "入力規則によるエラーメッセージの表示"], "correct": [2], "explanation": "商談フェーズの変更時に自動的なアクションを設定することで、営業プロセスの効率化が可能です。この場合「提案／見積もり」から「交渉／レビュー」へのフェーズ変更は重要なマイルストーンです。商談に関連する取引先責任者に自動メール通知を送信することで、関係者間のコミュニケーションを促進して、次のアクションの準備を効率的に進めることができます。", "category": "セールス＆マーケティングアプリケーション"}, {"question": "Salesforceで作成する新しい商談が、特定の条件を満たした際に自動的に重要な更新をメールで通知する機能を設定する場合、どの機能を使用するのが最適ですか？", "choices": ["入力規則", "レポートのスケジュール", "ワークフロールール", "積み上げ集計項目"], "correct": [2], "explanation": "ワークフロールールは、指定した条件が満たされたときに自動的にアクションを実行するために使用されます。この場合、商談が特定の条件を満たすときに自動的にメール通知を送信するという要件に最適です。", "category": "自動化"}, {"question": "Salesforceでカスタム TODOリストの機能を開発する際、効率的にデータの一括取り込みを実施するためにはどの機能を使用するのが最適ですか？", "choices": ["データローダを利用する", "積み上げ集計項目を使用する", "入力規則を設定する", "主従関係を定義する"], "correct": [0], "explanation": "SalesforceでカスタムTODOリストの機能を開発する際、効率的なデータの一括取り込みには、インポートウィザードまたはデータローダが推奨されます。インポートウィザードは比較的少量のデータ（数千件程度）の取り込みに適しており、データローダは大量のデータ（数万件以上）の取り込みや、より複雑なデータ操作が必要な場合に有効です。", "category": "データ管理＆分析"}, {"question": "Northern Trail Outfittersのユーザーが Salesforceへのログインに問題を抱えています。このユーザーのログイン履歴を見ると、複数回ログインを試み、組織からロックアウトされてしまったことがわかります。管理者はユーザーが Salesforceにログインできるようにするためにどの方法を用いるべきでしょうか？正解を2つ選びなさい。", "choices": ["ユーザーとしてログインしてユーザーをアンロックし、パスワードをリセットする。", "ユーザーがログインできるようにパスワードポリシーをリセットする。", "ユーザーのレコード詳細ページでアンロックボタンを使用する。", "ユーザーのレコード詳細ページでパスワードをリセットする。"], "correct": [2, 3], "explanation": "C．ユーザーのレコード詳細ページにある「アンロック」ボタンを使用して、アカウントのロックアウトを解除できます。この方法は、簡単にユーザーのアカウントをアンロックするための手段として有効です。\n\nD．パスワードをリセット後、ユーザーは新しいパスワードでログインすることができ、これによりアカウントのロックについても自動的に解除されます。", "category": "設定とセットアップ"}, {"question": "Northern Trail Outfittersは、商談における重要な関係者である取引先責任者を追跡したいと考えています。営業部門の副社長は、この情報が商談上でアクセス可能であり、レポートにも使用できるように要求しました。管理者がこの要件を満たすために設定すべきオプションは何ですか？正解を2つ選んでください。", "choices": ["キャンペーンメンバー関連リストを商談ページレイアウトに追加する。", "キャンペーンメンバーロールをカスタマイズする。", "キャンペーンロールをカスタマイズする。", "商談取引先責任者ロールをカスタマイズする。", "商談取引先責任者ロール関連リストを商談ページレイアウトに追加する。"], "correct": [3, 4], "explanation": "D．商談に関連する取引先責任者のROIを追跡するために、商談取引先責任者ロールをカスタマイズして必要な情報を追跡できるようにします。このカスタマイズにより、商談に関連する取引先責任者の情報を適切に管理することが可能です。\n\nE．商談ページレイアウトに商談取引先責任者ロール関連リストを追加することで、営業チームは商談の詳細に関連する取引先責任者を簡単に確認できるようになります。この情報は商談に関連した取引先責任者のROIを表示するために重要です。", "category": "セールス＆マーケティングアプリケーション"}, {"question": "クラウドキックスのビジネス開発チームは、取引先の作成プロセスに項目が多すぎてページが複雑であると考えています。彼らは管理者にプロセスの簡素化を要求しました。管理者はどの自動化ツールを使用すべきですか？", "choices": ["承認プロセス", "フロービルダー", "ワークフロールール", "入力規則"], "correct": [1], "explanation": "フロービルダー（Flow Builder）は、ユーザーインターフェースを簡素化し、ビジネスプロセスを自動化する強力なツールです。これを使用することで、取引先作成のプロセスで必要な項目をダイナミックに表示したり、条件に応じて入力フォームを簡潔にすることができます。", "category": "自動化"}, {"question": "DreamHouse Realtyは定期的に顧客からの保証作業のリクエストを処理しており、顧客に自己対応のオプションを提供してケースを生成できるようにしたいと考えています。この要求を満たすために、管理者が使用すべきソリューションは何ですか？正解を2つ選んでください。", "choices": ["Web-to-ケース", "ケースのエスカレーション", "Email-to-ケース", "ケースキュー"], "correct": [0, 2], "explanation": "A．Web-to-ケースは、顧客がWebフォームを通じてケースを提出できる機能です。顧客が自己対応でリクエストを送信できるようにするためにはWebサイトにこのフォームを埋め込むことができます。このオプションは、顧客が自分でリクエストを作成し、Salesforceにケースが自動的に生成されるため、要求を満たすのに最適です。\n\nC．Email-to-ケースを使用すると、顧客から送られたサポートメールを受信して、自動的にSalesforceにケースとして作成できます。これにより、顧客が自己対応でメールを送ると、それが自動的にケースに変換されるため、効率的にリクエストを処理できます。", "category": "サービス＆サポートアプリケーション"}, {"question": "AWコンピューティングの管理者にサポートチームのレポートフォルダについて支援を求められました。彼らは「サポートレポート」というフォルダと、その下に「ヘルプデスク」と「R&D」という2つのフォルダを作成したいと考えています。サポート組織はサポートエージェント、R&D、マネージャーのための公開グループを使用しています。サポートエージェントはヘルプデスクのレポートを実行できるようにする必要がありますが、R&Dのレポートは閲覧できないようにする必要があります。サポートマネージャーはすべてのレポートを閲覧および編集できるようにする必要があります。これらのフォルダをどのように共有すべきですか？正解を2つ選んでください。", "choices": ["ヘルプデスクフォルダをサポートエージェントと閲覧アクセスで共有する。", "R&Dフォルダをサポートマネージャーと編集アクセスで共有する。", "サポートレポートフォルダをサポートマネージャーと編集アクセスで共有する。", "サポートレポートフォルダをサポートエージェントと閲覧アクセスで共有する。"], "correct": [0, 2], "explanation": "A．サポートエージェントはヘルプデスクのレポートを実行できる必要がありますが、R&Dのレポートは閲覧できないようにする必要があります。このため、サポートエージェントにはヘルプデスクフォルダへの閲覧アクセスを与えR&Dのレポートを含むフォルダにはアクセスできないようにします。\n\nC．サポートマネージャーはすべてのレポートを閲覧および編集できる必要があります。このため、サポートレポートフォルダを編集アクセスでサポートマネージャーと共有します。これにより、マネージャーはフォルダ内の全レポートにアクセスして、編集や管理ができるようになります。", "category": "データ管理＆分析"}, {"question": "Northern Trail Outfittersは新しいフローを設定して、新しい取引先が作成される際に自動的に項目の値をセットするようにしました。このフローはプロセスによって起動されますが、うまく機能していません。管理者は問題を特定するために何をすべきですか？", "choices": ["フロービルダーのネイティブデバッグ機能を使用する。", "Emailログを設定し、送信エラーログを確認する。", "セットアップ監査トレイルを見てエラーを確認する。", "ログインレベルでのデバッグログを確認する。"], "correct": [0], "explanation": "フローがプロセスによって起動されているがうまく機能していない場合、最も効果的な方法は、フロービルダーのネイティブデバッグ機能を使用してフローの実行を詳細に追跡することです。この機能を使うと、フローがどのように実行されたか、どのステップで問題が発生したかを確認でき、フローのデバッグに役立ちます。", "category": "自動化"}, {"question": "クラウドキックスは、異なる製品カテゴリ（靴、アパレル、アクセサリー）に対して多くの異なるソースからリードを生成しています。一部のリードソースは3つのカテゴリすべてに使用される一方で、他のリードソースは単一のカテゴリに特化しています。マーケティング部門の副社長は、選択された製品カテゴリに基づいて適切なリードソースのみが表示されるように要求しています。この要求を満たすために、管理者はSalesforceをどのように設定すべきですか？", "choices": ["各カテゴリについてページレイアウトを作成し、カテゴリに基づいてリードソース項目をフィルタリングする。", "単一のビジネスプロセスを作成し、各製品カテゴリに対してレコードタイプを作成する。", "3つの製品カテゴリそれぞれにビジネスプロセスとレコードタイプを作成する。", "製品カテゴリ項目とリードソース項目の間に依存関係を作成する。"], "correct": [3], "explanation": "Salesforceでは、依存項目を設定することで、ある項目の選択肢が他の項目の選択によって動的に変更されるようにできます。この場合、リードソース項目を「製品カテゴリ」項目に依存させることで、製品カテゴリに基づいて適切なリードソースのみが表示されるように設定できます。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "クラウドキックスの管理者は、過去90日間に成約された成立した商談のファイルをエクスポートする必要があります。ファイルには商談名、ID、成約日、金額が含まれる必要があります。このファイルはどのようにエクスポートすべきですか？", "choices": ["データインポートウィザード", "データエクスポートウィザード", "データローダー"], "correct": [1], "explanation": "過去90日間に成約された商談の情報をエクスポートするには、データエクスポートウィザードを使用するのが適切です。このツールはSalesforceから選択したオブジェクトのデータをエクスポートするのに使用されます。商談オブジェクトのデータをエクスポートする場合、このウィザードを使ってレポートに基づくデータのエクスポートが可能です。", "category": "データ管理＆分析"}, {"question": "DreamHouse Realestateは、ローンのリードを生成するための住宅ローン計算機を含むテンプレート化されたプロセスを求めています。DreamHouse Realestateはプロジェクトを30日以内に完了する必要があり、年間予算をすでに使い切っています。どのAppExchangeアイテムが管理者がこの要求を満たすのに役立ちますか？", "choices": ["Lightning Community", "Lightning Data", "Flow ソリューション", "Bolt ソリューション"], "correct": [2], "explanation": "Flow ソリューションは事前に構築されたフローやテンプレートを提供し、短期間でのカスタマイズ、導入が可能です。住宅ローン計算機やリード生成のニーズに有用です。", "category": "自動化"}, {"question": "クラウドキックスの営業担当者は、製品の商談を勝ち取るのに役立つために商談レコード上で割引を使用しています。商談が成立した際には、関連する商談商品に手動で割引を適用する必要があります。営業マネージャーは、この時間がかかる作業を自動化する方法があるかどうかを尋ねてきました。管理者はこの要求を満たすために何を使用すべきでしょうか？", "choices": ["承認プロセス", "フロービルダー", "APEX", "フロー"], "correct": [3], "explanation": "フローを使用することで、商談が成立した際に関連する商談商品に自動的に割引を適用するプロセスを自動化できます。フローは、ユーザーの操作を最小限にして、条件に基づいて割引を自動で適用することが可能です。これにより、営業担当者の手作業を減少させ、作業効率が向上します。", "category": "セールス＆マーケティングアプリケーション"}, {"question": "クライアントサービスチームとカスタマーサポートチームは同じプロファイルを共有していますが、異なる権限セットを持っています。カスタムオブジェクト「Retention」関連リストは、Lightningレコードページレイアウトでクライアントサービスチームにのみ限定される必要があります。管理者はこのリクエストを満たすために何を使用すべきでしょうか？", "choices": ["ページレイアウト割当", "共有設定", "コンポーネントの表示設定", "レコードタイプ割当"], "correct": [2], "explanation": "「Retention」関連リストをクライアントサービスチームのみに表示するためには、レコードページのコンポーネントの表示設定を使用することが最適です。この設定により、特定のユーザーやプロファイルに対して、ページ上のコンポーネント（関連リスト）を表示するかどうかを制御できます。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "ユニバーサルコンテナーは、すべての従業員に素晴らしい体験を提供しています。従業員エンゲージメント委員会は、他の従業員が投稿できないように制限しながらアップデートを投稿したいと考えています。管理者はこの要求を満たすために何を作成すべきでしょうか？", "choices": ["Chatter ストリーム", "Chatter のアンケート", "Chatter ブロードキャスト", "Chatter の非公開グループ"], "correct": [2], "explanation": "Chatter ブロードキャストは、管理者や指定されたユーザーが投稿でき、他の従業員がコメントや投稿できないように制限されている投稿方法です。これにより、従業員エンゲージメント委員会は、重要なアップデートや通知をすべての従業員に向けて発信できる一方で、他の従業員が自由に投稿することを防げます。", "category": "生産性向上とコラボレーション"}, {"question": "ユニバーサルコンテナーズの管理者が、会社のSalesforce組織の現在のセキュリティ設定を確認しています。管理者はSalesforceへの不正アクセスを防ぐために何をすべきでしょうか？", "choices": ["セッションのTLS要件を無効にする。", "多要素認証を有効にする。", "ログインページのキャッシュと自動補完を有効にする。", "組織全体のデフォルトをカスタマイズする。"], "correct": [1], "explanation": "多要素認証は、Salesforceに不正アクセスを防ぐための強力なセキュリティ手段です。多要素認証を有効にすることで、ユーザーがログインする際にパスワードに加えて追加の認証を求めることができ、セキュリティを大幅に強化できます。", "category": "設定とセットアップ"}, {"question": "Salesforceでカスタムレポートを作成する際、取引先責任者レコードから直接連絡先情報を取得するために、どの種類のレポートタイプを選択するのが最適ですか？", "choices": ["取引先レポート", "複数オブジェクトレポート", "主従関係レポート", "取引先責任者レポート"], "correct": [1], "explanation": "Salesforceでは、複数オブジェクトレポートを使用すると、異なるオブジェクト間の関連情報を取得することができます。取引先責任者レコードから連絡先情報を取得するためには、複数のオブジェクトにまたがったデータを一つのレポートに組み込む必要があります。これにより、取引先責任者とその関連情報を一つのレポートでまとめて表示することができます。", "category": "データ管理＆分析"}, {"question": "ユニバーサルコンテナーでは、ケースに対するパスが設定されています。同社は、ユーザーに対してそのパス上のステータス値に従うことを要求しています。社員がケースを前のステータスに戻すことを禁止する必要があります。管理者はこの要求を満たすためにどの機能を使用すべきでしょうか？", "choices": ["グローバル選択リスト", "事前定義された項目値", "依存選択リスト", "入力規則"], "correct": [3], "explanation": "入力規則を使用することで、ユーザーがケースのステータスを特定の条件に従って設定できるように制限することができます。例えば、ケースのステータスが前のステータスに戻らないようにするためには、入力規則を設定してステータスが指定された順番に従って変更されることを強制できます。この方法で、ケースが不適切なステータスに戻ることを防げます。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "管理者が自身の組織で最近行われた設定変更を確認するために使用すべきツールはどれですか？", "choices": ["重要なアップデート", "デバッグログ", "項目履歴追跡", "セットアップ監査トレイル"], "correct": [3], "explanation": "セットアップ監査トレイルは、管理者がシステム内で行った設定変更の履歴を確認するために使用するツールです。これにより、変更がどのユーザーによって行われたか、どの設定が変更されたか、変更日時などの詳細を追跡できます。", "category": "設定とセットアップ"}, {"question": "クラウドキックスの管理者は、新しいクラウドシューズのリターンを追跡するための新しい項目を作成しました。あるユーザーが管理者に新しい項目が利用できないと指摘するケースを提出しました。この問題をトラブルシューティングするために管理者はどのステップを踏むべきですか？正解を2つ選んでください。", "choices": ["ユーザーのプロファイルのページレイアウトが更新されていることを確認する。", "組織のセットアップ監査トレイルを実行する。", "ユーザープロファイルに対する項目レベルのセキュリティを確認する。", "オブジェクトの組織全体のデフォルトを更新する。"], "correct": [0, 2], "explanation": "A．ユーザーのプロファイルのページレイアウトが更新されていない場合、新しい項目が表示されません。管理者は、対象のユーザーが新しい項目を表示できるように、ページレイアウトが適切に設定されているかを確認する必要があります。\n\nC．項目レベルのセキュリティ設定により、ユーザーが特定の項目にアクセスできるかどうかが制限されます。管理者はユーザープロファイルに対する項目レベルのセキュリティを確認し、新しい項目が適切に表示されるように設定されているかを確認するべきです。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "クラウドキックスの管理者はカスタムオブジェクト「行動」を更新し、行動に対して主要な取引先責任者を参照する参照項目を追加しました。行動のレポートを実行する際、関連する取引先責任者レコードの項目を参照したいと考えています。管理者はカスタムレポートに取引先責任者の項目を取り込むために何をすべきですか？", "choices": ["カスタム行動レポートタイプを編集して、参照を通じて関連する項目を追加する。", "行動に対して連絡先情報を入れる計算式項目を設定する。", "行動を主要オブジェクトとし、取引先責任者を関連オブジェクトとする新しいレポートタイプを作成する。", "フィルターを使用したダッシュボードを用いて、要求された行動と取引先責任者データを表示する。"], "correct": [0], "explanation": "Salesforceでは、レポートタイプによってどのオブジェクトや項目がレポートに表示されるかが決まります。カスタムオブジェクト「行動」に取引先責任者を参照する参照項目を追加した場合、管理者はカスタム行動レポートタイプを編集し取引先責任者レコードの項目をレポートに追加する必要があります。この設定により、行動レポートで関連する取引先責任者の項目を表示できるようになります。", "category": "データ管理＆分析"}, {"question": "Salesforceの「ダッシュボード」を使用する目的として、適切なものは次のうちどれですか？", "choices": ["承認プロセスの自動化", "ビジネスデータの視覚化と分析", "レコードのバックアップ管理", "ページレイアウトの変更"], "correct": [1], "explanation": "「ダッシュボード」を使用することにより、レポートデータを視覚的に表示し、ビジネスパフォーマンスの追跡と分析が容易に行えます。", "category": "データ管理＆分析"}, {"question": "Salesforceの「レコードタイプ」を設定する目的として、適切なものは、次のうちどれですか？", "choices": ["承認プロセスの削除", "ページレイアウトと選択リスト値のカスタマイズ", "レコードの自動保存", "レポートのバックアップ"], "correct": [1], "explanation": "「レコードタイプ」を設定することにより、異なる業務プロセスに応じたページレイアウトと選択リストの値を管理することが出来ます。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "Salesforceの「検証ルール」を使用する目的として適切なものは、次のうちどれですか？", "choices": ["レコードのインポートを自動化する", "データの不正入力を防ぐ", "レポートの生成をスケジューリングする", "プロファイルの権限設定を変更する"], "correct": [1], "explanation": "「検証ルール」を設定することにより、特定の条件を満たさないデータの保存がブロックされ、エラーメッセージが表示されるため、データの品質が向上します。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "Salesforceの「商談ステージの管理」で設定する主な内容として適切なものは、次のうちどれですか？", "choices": ["商談名の自動生成", "承認プロセスのステータス管理", "レコードの自動削除設定", "各ステージの成約確度と進行管理"], "correct": [3], "explanation": "「商談ステージの管理」では、商談の進行状況に応じた成約確度の設定と進行管理が行えるため、予測売上レポートの精度向上に貢献します。", "category": "セールス＆マーケティングアプリケーション"}, {"question": "Salesforceの「セキュリティ設定」で設定できる主な項目は、次のうちどれですか？", "choices": ["データの削除制限", "ログインIP制限とログイン時間の設定", "オブジェクトのレコード数の制限", "レコードの印刷設定"], "correct": [1], "explanation": "「セキュリティ設定」では、ログイン可能なIPアドレス範囲、ログイン可能な時間、パスワードポリシーなどのセキュリティ関連の設定をすることが出来ます。", "category": "設定とセットアップ"}, {"question": "Salesforceの「ワークフロールール」を使用する主な目的は、次のうちどれですか？", "choices": ["承認プロセスの削除", "レコード保存時の自動アクションの実行", "レコードのバックアップ管理", "ページレイアウトの変更"], "correct": [1], "explanation": "「ワークフロールール」を設定することにより、レコードの保存時に特定の条件が満たされた場合、タスクの割り当て、通知の送信、レコードの更新などのアクションが自動的に実行されます。", "category": "自動化"}, {"question": "Salesforceの「AppExchange」を使用する目的として、適切なものはどれですか？", "choices": ["承認プロセスの作成", "アプリケーションとコンポーネントのインストール", "レコードのバックアップ", "ページレイアウトの管理"], "correct": [1], "explanation": "「AppExchange」を使用することにより、Salesforce用のアプリケーションやコンポーネントを検索し、必要なものをインストールすることが出来ます。", "category": "設定とセットアップ"}, {"question": "Salesforceの「検証ルール」が適用されるタイミングとして、適切なものは、次のうちどれですか？", "choices": ["レコードが削除されたとき", "承認プロセスが進行したとき", "レコードが保存されたとき", "レポートが生成されたとき"], "correct": [2], "explanation": "「検証ルール」は、レコードの保存時に適用され、指定された条件を満たしていない場合はエラーメッセージが表示され、保存がブロックされます。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "Salesforceの「商談オブジェクト」に設定できる主なフィールドとして、適切なものは次のうちどれですか？", "choices": ["ページレイアウト", "ダッシュボードの表示順序", "レコードの作成日", "商談名、金額、成約確度、商談ステージ"], "correct": [3], "explanation": "「商談オブジェクト」には、商談名、商談ステージ、金額、成約確度、予測終了日などのフィールドがあり、商談の進捗管理に有用です。", "category": "セールス＆マーケティングアプリケーション"}, {"question": "Salesforceの「プロファイル設定」で制御できる内容として、適切なものは、次のうちどれですか？", "choices": ["レコードの削除履歴", "オブジェクト権限、ページレイアウト、タブの可視性", "商談の割引率の変更", "承認プロセスのステータス管理"], "correct": [1], "explanation": "「プロファイル設定」では、オブジェクト権限、フィールドレベルセキュリティ、ページレイアウトの可視性、タブの表示設定などを管理することが出来ます。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "Salesforceにおいて「スケジュール済みレポート配信」を利用する場合の要件は、次のうちどれですか？", "choices": ["ユーザーがAPIアクセスを有効化している", "ユーザーが該当レポートのフォルダにアクセス権を持っている", "レポートタイプが結合レポートである", "ダッシュボードが必須"], "correct": [1], "explanation": "スケジュール配信においては、対象ユーザーがレポートを含むフォルダに適切なアクセス権を所有している必要があります。", "category": "データ管理＆分析"}, {"question": "Salesforceにおいて「モバイルナビゲーションメニュー」をカスタマイズするために使うものは、次のうちどれですか？", "choices": ["Lightning App Builder", "Salesforceモバイル設定", "プロファイル", "グローバルアクションレイアウト"], "correct": [1], "explanation": "Salesforceモバイル設定で、モバイルナビゲーションメニューの項目をカスタマイズすることが出来ます。", "category": "生産性向上とコラボレーション"}, {"question": "Salesforceにおいて「参照関係（Lookup Relationship）」と比べた場合、「主従関係（Master-Detail）」の特徴として、適切なものは次のうちどれですか？", "choices": ["子レコードの所有者が親レコードと同じになる", "親レコードを削除しても子レコードは残る", "複数の親を持てる", "親の共有設定が子に影響しない"], "correct": [0], "explanation": "主従関係では、子レコードは親レコードと所有権を共有し、親レコードが削除されると子レコードも削除されます。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "Salesforceにおいて「グローバル検索」に表示される項目を制御するために使用する設定は、次のうちどれですか？", "choices": ["プロファイル", "Lightning ページ", "ページレイアウト", "検索レイアウト"], "correct": [3], "explanation": "検索レイアウトを編集することにより、グローバル検索で表示される項目を制御することが出来ます。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "Salesforceにおいて「データローダ」を使用する場合、使用するべきファイル形式は、次のうちどれですか？", "choices": ["XML", "CSV", "JSON", "XLSX"], "correct": [1], "explanation": "データローダは、CSVファイルを使用して、データのインポートやエクスポートを行います。", "category": "データ管理＆分析"}, {"question": "Salesforceにおいて「Chatterでファイル共有」を制御する設定は、次のうちどれですか？", "choices": ["プロファイルでAPIアクセスを無効化", "Chatter設定でファイルアップロードを許可する", "コンテンツデリバリー設定", "グローバル値セットを変更"], "correct": [1], "explanation": "Chatterでファイル共有するためには、Chatter設定でファイルアップロードを許可する必要があります。", "category": "生産性向上とコラボレーション"}, {"question": "ユーザがChatterで投稿できない原因として考えられるのは、次のうちどれですか？", "choices": ["ユーザがロールを持っていない", "ユーザがプロファイルでAPIアクセスを持っていない", "Chatterが組織で無効化されている", "レコードタイプが未設定"], "correct": [2], "explanation": "Chatterが組織レベルで無効になっている場合、全ユーザで利用することが出来ません。一方、ロールやAPI権限はChatterには影響しません。", "category": "生産性向上とコラボレーション"}, {"question": "Salesforceモバイルアプリにおいて、オブジェクトのページレイアウトに影響を与える要素は、次のうちどれですか？", "choices": ["アプリケーションテーマ", "レコードタイプ", "フォーミュラフィールド", "Lightningページ"], "correct": [3], "explanation": "Salesforceモバイルにおいては Lightningページの設定がレイアウトを決定します。ページレイアウトも関係していますが、モバイル用にLightningページが優先されます。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "取引先責任者（Contact）を商談（Opportunity）に関連付けるために必要な設定として、適切なものは次のうちどれですか？", "choices": ["取引先責任者ロール", "Opportunity Contact Role", "Lookup関係を有効化", "Junctionオブジェクト"], "correct": [1], "explanation": "Opportunity Contact Roleを有効化することにより、商談に複数の取引先責任者を関連付け、役割を指定することが出来ます。", "category": "セールス＆マーケティングアプリケーション"}, {"question": "Salesforceにおいて、複数のオブジェクトを横断したレポートを作成する場合、次のうちどのレポート形式を使用するべきですか？", "choices": ["マトリックスレポート", "結合レポート", "サマリレポート", "カスタムレポートタイプのみ"], "correct": [1], "explanation": "結合レポートを使うことにより、異なるオブジェクトのデータを1つのレポートにまとめて表示することが出来ます。", "category": "データ管理＆分析"}, {"question": "Salesforceにおいて、組織の共有設定を使用する目的として、適切なものは次のうちどれですか？", "choices": ["プロファイルのCRUD権限を付与する", "レポートの表示条件を決定する", "データの既定の公開範囲を決定する", "Lightningページの権限を設定する"], "correct": [2], "explanation": "組織の共有設定は、レコードがデフォルトでどの範囲で共有されるかを決定します。", "category": "設定とセットアップ"}, {"question": "Salesforceにおいて、データインポートウィザードと比較した場合、データローダの方が適しているケースは次のうちどれですか？", "choices": ["最大5万件のレコードをロードする場合", "大量データ（50,000件以上）をロードする場合", "標準オブジェクトのみ扱う場合", "手動でUI操作だけで済ませたい場合"], "correct": [1], "explanation": "データインポートウィザードが最大5万件迄であるのに対して、データローダは、大量データのエクスポートに適しています。", "category": "データ管理＆分析"}, {"question": "Salesforceにおいて、プロファイルに設定することが出来るのは、次のうちどれですか？", "choices": ["オブジェクトのCRUD権限", "ページレイアウトのデフォルト設定", "レコードタイプの割り当て", "上記すべて"], "correct": [3], "explanation": "プロファイルでは、オブジェクトのCRUD、ページレイアウト、レコードタイプの割り当てのデフォルトなどを設定することが出来ます。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "Salesforceにおいて、共有ルールを使用する目的として、最も適切なものは次のうちどれですか？", "choices": ["ユーザーに対してプロファイル権限を付与する", "ワークフローを自動化する", "特定条件に一致するレコードをグループやロールに共有する", "レコードタイプを割り当てる"], "correct": [2], "explanation": "共有ルールは、組織の共有設定（OWD）を緩和して、特定条件に一致するレコードをロールやグループに共有するために使用します。", "category": "設定とセットアップ"}, {"question": "Salesforceで「組織の既定の共有設定」を「非公開」に設定した場合の影響は、次のうちどれですか？", "choices": ["すべてのユーザーがレコードを参照できる", "ユーザーは自分が所有するレコードのみ参照可能", "レコードタイプが非表示になる", "権限セットで共有を上書きできる"], "correct": [1], "explanation": "非公開（Private）に設定した場合、基本的にユーザーは自分の所有するレコードのみ参照可能になります。", "category": "設定とセットアップ"}, {"question": "Salesforceで「ロール階層」を使用する主なメリットは、次のうちどれですか？", "choices": ["上位のロールは下位ロールのレコードを参照できる", "ページレイアウトを分けることができる", "プロファイル設定を簡素化できる", "Lightningページを管理できる"], "correct": [0], "explanation": "ロール階層では、上位ロールのユーザーは下位ロールのレコードを参照できるようになります。", "category": "設定とセットアップ"}, {"question": "中規模病院の管理者が、医療記録システムにおいて患者データの可視性を向上させるため、依存関係のあるフィールド設定を検討しています。このとき、チェックボックスフィールドの使用に関する適切な説明はどれですか？", "choices": ["チェックボックスフィールドは依存フィールドとしてのみ使用可能です。", "チェックボックスフィールドは制御フィールドとしてのみ使用可能です。", "チェックボックスフィールドは制御フィールドと依存フィールドの両方として使用可能です。", "チェックボックスフィールドは依存フィールドまたは制御フィールドのいずれにも使用できません。"], "correct": [1], "explanation": "チェックボックスフィールドは、制御フィールドとして設定できますが、依存フィールドとしては機能しません。これは、選択された値に基づいて他のフィールドを条件付ける制御を提供する場合に最適です。\n不正解の選択肢の解説：\n\na. チェックボックスは依存フィールドとして使用することはできません。\nc. 制御フィールドとしてのみ使用可能であり、依存フィールドとしては利用不可です。\nd. 制御フィールドとして使用可能なため、この選択肢は誤りです。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "大手教育機関が、学生の登録データの「コースタイプ」フィールドの値を一括で更新したいと考えています。以下の方法のうち、実行できないものはどれですか？", "choices": ["データローダを使用して登録データをエクスポートし、値を更新して再インポートする。", "プロセスビルダーを使用して一括更新をトリガーするルールを作成する。", "リストビューを作成し、対象レコードをインライン編集で一括更新する。", "レポート機能を使用してフィールド値を一括変更する。"], "correct": [3], "explanation": "レポート機能はデータの可視化や分析に使用されるものであり、フィールド値の一括変更はサポートされていません。一括変更には、データローダやリストビューのインライン編集が適しています。\n不正解の選択肢の解説：\n\na. データローダは大量データのエクスポート、更新、再インポートに適したツールで、一括変更が可能です。\nb. プロセスビルダーは一括更新をトリガーするルールを作成することで、一部の更新タスクを自動化できます。\nc. リストビューを使用して同一レコードタイプのデータをインライン編集し、一括更新することができます。", "category": "データ管理＆分析"}, {"question": "新興スタートアップが、従業員の操作権限を適切に制御するためにSalesforceのセキュリティ設定を見直しています。以下のうち、オブジェクトの作成、読み取り、更新、削除（CRUD）権限を制御できるものを2つ選んでください。", "choices": ["ロール", "プロファイル", "キュー", "権限セット"], "correct": [1, 3], "explanation": "プロファイルは、Salesforceで CRUD 権限を直接制御する主要なセキュリティ機能です。また、権限セットを使用すると、プロファイルに追加権限を付与でき、柔軟な権限管理が可能です。\n不正解の選択肢の解説：\n\na. ロールはレコードの共有ルールを管理するための機能で、CRUD権限は管理しません。\nc. キューはタスクの割り当てを管理するための機能で、CRUD権限には関連しません。", "category": "設定とセットアップ"}, {"question": "貴社は特定顧客向けに特別なソリューションを提供する新しいビジネスモデルを導入しました。この新しい商談には、既存の「通常販売」とは異なる商談ステージを適用する必要があります。この要件を満たすために必要な設定はどれですか？", "choices": ["特定顧客用のカスタムユーザーグループを作成する", "新しい商談レコードタイプを作成する", "新しい販売プロセスを設定する", "新しい製品カテゴリを作成する"], "correct": [1, 2], "explanation": "商談レコードタイプは、異なる販売プロセスやレイアウトを商談に適用するために必要です。一方、販売プロセスは商談ステージを管理するための基本的な設定です。これらを組み合わせることで、特定のビジネス要件に対応できます。\n他の回答の解説：\n\na. カスタムユーザーグループはアクセス権管理に使用されるもので、商談ステージの管理には適しません。\nd. 製品カテゴリは商品管理に関連するもので、商談の設定には関係しません。", "category": "セールス＆マーケティングアプリケーション"}, {"question": "Salesforceダッシュボードでデータを視覚化するためのデータソースとして使用できるものはどれですか？", "choices": ["レポート", "カスタムデータモデル", "Visualforceページ", "外部データAPI"], "correct": [0, 2], "explanation": "ダッシュボードでは、Salesforceレポートを使用して主要なデータを提供します。また、Visualforceページを埋め込むことで、カスタムデータの表示を実現できます。\n他の回答の解説：\n\nb. カスタムデータモデルはSalesforceの標準機能ではありません。\nd. 外部データAPIはダッシュボードの直接的なデータソースとしては利用できません。", "category": "データ管理＆分析"}, {"question": "営業チームのディレクターが、20万件のリードデータをSalesforceにインポートする計画を立てています。この大量データを最も効果的にインポートするために使用すべきツールは次のうちどれですか？", "choices": ["データインポートウィザード", "データローダ", "Workbench", "カスタムAPI統合"], "correct": [1], "explanation": "データローダは、大量データのインポートに特化しています。このケースでは20万件のリードに最適なツールです。\n他の選択肢の解説：\n\na. データインポートウィザードは最大50,000件までしか対応できません。\nc. Workbenchは可能ですが、データローダの方が効率的です。\nd. カスタムAPI統合は可能ですが、実装にコストと時間がかかります。", "category": "データ管理＆分析"}, {"question": "ある小売企業が従業員の利用するアプリケーションを再編成することを決定しました。一部の従業員グループに対して、特定のSalesforceアプリケーションへのアクセスを無効化する必要があります。この要件を満たすための最適な設定方法はどれですか？", "choices": ["プロファイルで割り当てられているアプリケーションを無効化する", "共有ルールを適用してアプリケーションへのアクセスを制御する", "権限セットを削除してアプリケーションの利用を制限する", "カスタムタブを非表示にしてアプリケーションのアクセスを制限する"], "correct": [0], "explanation": "アプリケーションへのアクセスはプロファイルで管理されています。「割り当て済みアプリケーション」セクションを編集することで、特定のユーザーグループのアプリケーション利用を制限できます。\n他の選択肢の解説：\n\nb. 共有ルールはレコードレベルのアクセス制御に使用され、アプリケーション制御には適しません。\nc. 権限セットは追加の権限を付与するためのものであり、アプリケーションのアクセス無効化には直接関与しません。\nd. カスタムタブの非表示設定はタブレベルの制御に限定され、アプリケーション全体の制御には不十分です。", "category": "設定とセットアップ"}, {"question": "ある多国籍企業が、製品フィードバックフォームを簡素化するため、「複数選択リスト」フィールドを「選択リスト」フィールドに変更しようとしています。この変更によって発生する可能性が高い問題は次のうちどれですか？", "choices": ["既存のレポートでフィールドデータが正しく表示されなくなる", "データの一部が消失する可能性がある", "変更後も問題なく動作し、特別な対応は必要ない", "フィールドの他のタイプへの変更が不可能になる"], "correct": [1], "explanation": "複数選択リストを選択リストに変換すると、選択リストが1つの値しか保持できないため、複数選択リストの追加値が削除され、データ損失のリスクがあります。\n他の選択肢の解説：\n\na. 既存レポートへの影響は副次的なもので、主な問題はデータ損失です。\nc. データ損失のリスクがあるため、この選択は誤りです。\nd. フィールドタイプ変更の制限は、このシナリオでは主要な懸念事項ではありません。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "地域ごとの製品ラインナップを管理するため、マーケティング部門が複数選択リストをフィールド依存関係に追加したいと考えています。このフィールドタイプについて正しい記述を次の中から選んでください。", "choices": ["複数選択リストは制御フィールドと依存フィールドの両方として使用できる", "複数選択リストは制御フィールドとして使用できるが、依存フィールドには使用できない", "複数選択リストは依存フィールドとして使用できるが、制御フィールドには使用できない", "複数選択リストは制御フィールドにも依存フィールドにも使用できない"], "correct": [2], "explanation": "複数選択リストは、選択可能な値が多くなりすぎる可能性があるため、制御フィールドとして使用することはできません。ただし、依存フィールドとしては利用可能です。\n他の選択肢の解説：\n\na. 制御フィールドとしては使用できないため誤りです。\nb. 制御フィールドには使用できませんが、依存フィールドとしては利用可能です。\nd. 依存フィールドとしては使用できるため、この選択肢は誤りです。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "地域販売マネージャーが、毎月の売上データを営業チーム全体に自動的に配信するよう依頼しました。この作業を効率的に行うために、どの手順を実行する必要がありますか？", "choices": ["Salesforceレポートの「実行」メニューから「スケジュールされた実行」を選択し、適切な受信者を指定する。", "レポートの「スケジュール」ボタンを使用して配信を設定する。", "自動化されたワークフローを作成し、レポートを添付したメールアラートを設定する。", "Apexトリガーを開発してカスタマイズされたメール配信を実行する。"], "correct": [0], "explanation": "「スケジュールされた実行」オプションを使用すると、定期的にレポートを自動実行し、その結果を指定した受信者に配信できます。この機能により、管理者は簡単にデータの共有を自動化できます。\n他の回答の解説：\n\nb. Salesforceには「スケジュール」ボタンは存在せず、選択肢aの方法が正しいです。\nc. ワークフローではレポートの添付はサポートされていません。\nd. Apexトリガーを使えば可能ですが、一般的な管理者試験ではこの選択肢は適切ではありません。", "category": "データ管理＆分析"}, {"question": "地方自治体が、行政サービスのデータ保護を強化するためにSalesforceのログインIP制限を導入しました。この範囲外のIPアドレスから職員がログインを試みた場合、どのような対応が取られますか？", "choices": ["ログインリクエストは直ちに拒否される。", "職員には追加認証のためのログインチャレンジが表示される。", "職員は読み取り専用のアクセス権で一時的にログインを許可される。", "システム管理者にアラートが送信され、承認後にログインが許可される。"], "correct": [0], "explanation": "SalesforceのログインIP制限は、指定されたIPアドレス範囲内でのログインを強制します。この範囲外からのアクセスは、自動的に拒否される設定となっています。これにより、許可されていない場所からの不正アクセスを防止できます。\n他の回答の解説：\n\nb. ログインチャレンジは「信頼済みIP範囲」設定時にのみ発生します。\nc. 読み取り専用モードはこの設定には適用されません。\nd. アラート送信機能は存在しません。", "category": "設定とセットアップ"}, {"question": "ある非営利団体のIT担当者が、ユーザーアカウントのロック状態を確認する方法について問い合わせてきました。この状況で正しい対応方法を選びなさい。", "choices": ["ユーザープロファイル設定から「ロック解除」ボタンが表示されているか確認する。", "ユーザーのアカウント詳細ページで「ロック解除」オプションを探す。", "Salesforceのログイン履歴レポートを確認し、ロック状態を特定する。", "ユーザーが送信した最新のログイン試行に関するメールを確認する。"], "correct": [1], "explanation": "ユーザーがロックされた場合、Salesforceのアカウント詳細ページに「ロック解除」ボタンが表示されます。このボタンの有無でアカウントがロックされているかを確認できます。\n他の回答の解説：\n\na. プロファイル設定自体にはロック状態を確認するオプションはありません。\nc. ログイン履歴レポートはアクセス失敗の詳細を確認できますが、ロック状態の直接確認には適しません。\nd. ユーザーの送信したログインメールは、アカウントロックに関する公式情報ではありません。", "category": "設定とセットアップ"}, {"question": "新しい製品キャンペーンの管理において、Salesforceで使用するコンパクトレイアウトをカスタマイズしたいと考えています。この作業を完了するための正しい手順はどれですか？", "choices": ["キャンペーンページレイアウトエディターでカスタムコンポーネントをドラッグ&ドロップする。", "キャンペーンオブジェクトの「コンパクトレイアウト」セクションで新しいレイアウトを作成し、割り当てを変更する。", "Lightningアプリビルダーで既存のレイアウトを編集し、必要な情報を追加する。", "オブジェクト設定からグローバルコンパクトレイアウトを変更する。"], "correct": [1], "explanation": "コンパクトレイアウトは、オブジェクトマネージャー内でカスタマイズされます。新しいレイアウトを作成し、割り当てを変更することで適用できます。\n他の回答の解説：\n\na. ページレイアウトエディターでは、コンパクトレイアウトの変更は行えません。\nc. Lightningアプリビルダーは、コンパクトレイアウトの編集に使用できません。\nd. グローバルコンパクトレイアウトは、特定のオブジェクトに適用するものではありません。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "Salesforceで顧客契約データを効率的に管理するには、複数の顧客が異なるプロジェクトに参加できる多対多の関係を作成する必要があります。この関係を実現するために使用されるオブジェクトタイプはどれですか？", "choices": ["カスタムオブジェクト", "ジャンクションオブジェクト", "外部オブジェクト", "階層オブジェクト"], "correct": [1], "explanation": "多対多の関係は、2つのオブジェクト間で複数の関連を可能にするものです。これを実現するには、2つの主従関係を持つ中間オブジェクト（ジャンクションオブジェクト）を作成します。たとえば、顧客とプロジェクトの関係を管理する場合、「参加記録」といったジャンクションオブジェクトを使用します。\n他の回答の解説：\n\na. カスタムオブジェクトは多対多の関係を構成する要素になり得ますが、それ自体ではこの関係を構築できません。\nc. 外部オブジェクトは外部データの統合に使用され、多対多の関係を直接作成するものではありません。\nd. 階層オブジェクトは存在しない概念であり、多対多の関係には関与しません。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "Salesforceのある機能は、営業チームが特定の条件に基づいて重要な商談データを迅速に確認できるようにするものです。この機能はどれですか？", "choices": ["リストビュー", "ピボットテーブル", "グラフウィジェット", "カレンダービュー"], "correct": [0], "explanation": "リストビューは特定のフィルター条件を満たすレコードの一覧を表示します。これにより、営業チームは重要な商談情報をすばやく把握できます。また、リストビューは共有設定も可能で、必要に応じて公開または非公開にできます。\n他の回答の解説：\n\nb. ピボットテーブルはデータ分析に使用されるもので、リストビューの代わりにはなりません。\nc. グラフウィジェットは視覚化ツールであり、条件に基づくリストの表示には適していません。\nd. カレンダービューは日付データをカレンダー形式で表示するもので、リストビューの用途とは異なります。", "category": "設定とセットアップ"}, {"question": "営業チームでは、リード情報を既存の顧客データベースに統合する際に、リードを変換すると新規作成されるオブジェクトがあります。ただし、以下の選択肢の中に誤ったものが1つ含まれています。それはどれですか？", "choices": ["顧客案件（商談）", "サポート依頼（ケース）", "顧客アカウント（取引先）", "顧客担当者（取引先責任者）"], "correct": [1], "explanation": "リード変換時に新規作成される可能性があるオブジェクトは、顧客アカウント（取引先）、顧客担当者（取引先責任者）、および顧客案件（商談）です。これにより、リード情報を既存または新規の顧客データと統合できます。\n他の回答の解説：\n\na. 顧客案件（商談）はリード変換時に作成可能です。\nc. 顧客アカウント（取引先）はリード変換プロセスで作成されます。\nd. 顧客担当者（取引先責任者）もリード変換時に作成可能です。", "category": "セールス＆マーケティングアプリケーション"}, {"question": "リードを取引先や商談に変換する際に、リードのカスタムフィールドをマッピングできるオブジェクトはどれですか？（3つ選択）", "choices": ["取引先", "カスタムオブジェクト", "取引先責任者", "商談"], "correct": [0, 2, 3], "explanation": "リード変換プロセスでは、リードのカスタムフィールドを取引先、取引先責任者、商談のフィールドにマッピングできます。この機能により、リード情報を変換後のオブジェクトに引き継ぐことが可能です。\n他の回答の解説：\n\nb. カスタムオブジェクトは標準のリード変換では使用できません。", "category": "セールス＆マーケティングアプリケーション"}, {"question": "リード変換プロセスにおいて、新たに作成されるレコードタイプを適切に設定する必要があります。次の選択肢の中から2つ選んでください。これにより、営業チームがリード情報を効率的に管理できるようになります。", "choices": ["ケース", "取引先（アカウント）", "カスタムオブジェクト", "取引先責任者（コンタクト）"], "correct": [1, 3], "explanation": "リードを変換するとき、次のレコードが新たに作成されます。取引先（アカウント）：企業情報が移行されます。取引先責任者（コンタクト）：連絡先情報が保存されます。\n他の選択肢の解説：\n\na. ケースはリード変換の際に自動的には作成されません。特定の条件に基づいて別途作成が必要です。\nc. カスタムオブジェクトはリード変換プロセスの標準的な作成対象ではありませんが、ワークフローや自動化ルールを利用して作成可能です。", "category": "セールス＆マーケティングアプリケーション"}, {"question": "営業マネージャーが、取引先のページに商談ステータスに基づく情報を表示し、特定のステージごとに集計データを確認できるようにしたいと依頼してきました。この要件を満たすために使用すべきフィールドタイプはどれですか？", "choices": ["数式フィールド", "ロールアップサマリーフィールド", "マスターディテールフィールド", "外部参照フィールド"], "correct": [1], "explanation": "ロールアップサマリーフィールドは、主従関係に基づいて関連データを集計するのに最適です。このケースでは、取引先と商談間の関係を活用して、ステージごとのデータを効率的に表示できます。\n他の選択肢の解説：\n\na. 数式フィールドはデータを動的に計算しますが、関連データの集計には使用できません。\nc. マスターディテールフィールドはデータの関係を定義するものですが、集計は行いません。\nd. 外部参照フィールドは外部システムとの統合に使用され、このシナリオには適しません。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "製品キャンペーンの成果を追跡するために、マーケティング部門が商談をキャンペーンに関連付ける方法を確認したいとしています。以下の選択肢の中から、適切ではない方法を1つ選んでください。", "choices": ["商談に「主キャンペーンソース」を指定する", "商談の「キャンペーン影響力」関連リストを使用する", "商談の履歴追跡機能を有効にする", "ページレイアウトに関連リストを追加する"], "correct": [2], "explanation": "商談の履歴追跡機能は、フィールド変更の履歴を記録するためのものであり、キャンペーンとの関連付けには使用されません。\n他の選択肢の解説：\n\na. 商談に「主キャンペーンソース」を指定することで、キャンペーンとの関連付けが可能です。\nb. 「キャンペーン影響力」関連リストを活用することで、複数のキャンペーンと商談を関連付けられます。\nd. ページレイアウトに関連リストを追加することで、キャンペーン影響力を表示・管理できます。", "category": "セールス＆マーケティングアプリケーション"}, {"question": "営業チームが、商談レコードに取引先の「業種」情報をリアルタイムで表示できるよう求めています。この要件を実現するために作成すべきフィールドの種類はどれですか？", "choices": ["関連オブジェクトから値を取得できる数式フィールド（Formula）", "選択肢を固定する選択リストフィールド（Picklist）", "数値データを格納する数値フィールド（Number）", "静的リストを複数選択できる複数選択リスト（Multi-Select Picklist）"], "correct": [0], "explanation": "数式フィールドを使用すると、商談オブジェクトから取引先オブジェクトの「業種」情報をリアルタイムで取得して表示できます。この方法により、データの手動入力が不要となり効率化が図れます。\n他の回答の解説：\n\nb. 選択リストは手動入力が必要で、動的に値を取得することはできません。\nc. 数値フィールドは取引先情報のようなテキストデータには適しません。\nd. 複数選択リストは静的データに適しており、関連オブジェクトから動的に値を取得することはできません。", "category": "セールス＆マーケティングアプリケーション"}, {"question": "人事部が、新たに作成された職種データのカスタムフィールドについて、過去半年間の変更履歴を確認したいと考えています。この履歴を確認するために最適な場所はどこですか？", "choices": ["設定変更監査ログ（Setup Audit Trail）", "データローダ（Data Loader）", "データエクスポート（Data Export）", "変更管理ダッシュボード（Change Management Dashboard）"], "correct": [0], "explanation": "設定変更監査ログは、組織内で行われた過去6か月間の変更内容を記録します。これには、日時、変更者、変更内容が含まれます。CSV形式で履歴をダウンロードすることも可能です。\n他の回答の解説：\n\nb. データローダはデータのインポート・エクスポートに使用され、設定変更の履歴確認には適しません。\nc. データエクスポートはレコードデータのバックアップ作成に使用されますが、監査には適しません。\nd. 変更管理ダッシュボードは仮想的な選択肢で、Salesforceには存在しません。", "category": "データ管理＆分析"}, {"question": "小売業の管理者が、特定の商品のカスタムレコードページを特定のチームにのみ見せるよう設定を求めました。この要件を実現するため、Lightningカスタムレコードページのアクティベーション割り当てで正しい設定はどれですか？", "choices": ["レコードタイプごとにカスタマイズ可能な権限を設定する。", "アプリ、レコードタイプ、およびプロファイルの組み合わせを利用する。", "会社全体に共通のデフォルト設定を使用する。", "個々のユーザー設定に基づくページ割り当てを行う。"], "correct": [1], "explanation": "この方法により、特定のアプリケーション、レコードタイプ、およびプロファイルに基づいてページを個別に割り当てることができます。他の方法は、要件の詳細な割り当てには不十分です。\n他の回答の解説：\n\na. レコードタイプの権限設定は個別のページ割り当てには関与しません。\nc. 会社全体のデフォルト設定は柔軟性に欠け、特定チーム向けには不適切です。\nd. 個々のユーザー設定に基づくページ割り当ては、一般的な運用には複雑すぎます。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "ある多国籍企業のサポートチームが新たな地域でサービスを開始し、この地域特有の情報を収集するため、ケースのライフサイクルに追加ステータスを設定する必要があります。この要件を満たすためにSalesforceで作成すべき項目として、誤りを1つ選びなさい。", "choices": ["ケースの情報をカスタマイズする新しいケースページレイアウトを作成する。", "地域ごとのプロセスを管理する新しいケースレコードタイプを設定する。", "追加情報を格納するためのカスタムフィールドを作成する。", "営業活動を支援するために新しい地域（Territory）を設定する。"], "correct": [3], "explanation": "地域（Territory）は営業活動を地理的に区分するために使用され、ケース管理の設定には直接関与しません。\n他の回答の解説：\n\na. ケースページレイアウトは地域固有の情報を表示するために必要です。\nb. ケースレコードタイプは特定地域用のプロセスとページレイアウトを関連付けるために必須です。\nc. カスタムフィールドは新たに収集する情報を格納するために作成します。", "category": "サービス＆サポートアプリケーション"}, {"question": "ある不動産会社の管理者が、取引先レコードに「成約済み物件の合計金額」を自動的に計算して表示するフィールドを追加するよう求められました。この要件を満たすフィールドの種類として適切なものはどれですか？", "choices": ["取引先に直接入力可能な数値フィールド（Number Field）", "商談データを集計して取引先に表示する集計項目（Roll-Up Summary）", "数式を使用して計算値を表示する数式フィールド（Formula Field）", "金額データを表示する通貨フィールド（Currency Field）"], "correct": [1], "explanation": "集計項目（Roll-Up Summary）は、親オブジェクト（取引先）に関連する子オブジェクト（商談）のデータを基に計算を行い、結果を親オブジェクトに表示するフィールドです。この機能は、「成約済み商談の合計金額」を計算して取引先レコードに表示する要件を満たします。\n他の回答の解説：\n\na. 数値フィールドは手動入力が必要なため、自動計算には対応していません。\nc. 数式フィールドは主に親オブジェクトから子オブジェクトへのデータ反映に使用されます。\nd. 通貨フィールドは金額データを保存しますが、計算機能はありません。", "category": "セールス＆マーケティングアプリケーション"}, {"question": "営業チームが、商談の「クローズ日」の7日前にリマインダーを表示するフィールドを必要としています。この要件に最適なSalesforceのフィールドタイプは次のうちどれですか？", "choices": ["日付データを入力できる日付フィールド（Date Field）", "「クローズ日」から7日を引いた日付を計算する数式フィールド（Formula Field）", "日付と時間を記録する日付/時間フィールド（Date/Time Field）", "計算結果をテキスト形式で表示する数式フィールド（Text Formula Field）"], "correct": [1], "explanation": "数式フィールドを使用し、数式としてCloseDate - 7を指定することで、クローズ日の7日前の日付を計算し、リマインダー日付として表示することができます。このフィールドの戻り値を「日付（Date）」に設定する必要があります。\n他の回答の解説：\n\na. 日付フィールドは動的な計算に対応していません。\nc. 日付/時間フィールドは不要なタイムスタンプを含むため、この要件には適していません。\nd. テキスト形式の数式フィールドでは日付の計算結果を適切に表示できません。", "category": "セールス＆マーケティングアプリケーション"}, {"question": "あるマーケティングチームでは、営業レポートに含まれる特定のフィールドが誤解を招く可能性があるため、表示されないようにしたいと考えています。このフィールドを検索結果やリストビュー、レポートで非表示にするための最も適切な設定はどれですか？", "choices": ["フィールドを削除してデータをクリアする。", "プロファイル設定でフィールドレベルセキュリティを利用して非表示にする。", "レポートビルダーでフィールドをフィルタリングする。", "ページレイアウトからフィールドを削除する。"], "correct": [1], "explanation": "フィールドレベルセキュリティ（FLS）は、特定のフィールドをプロファイルごとに表示または非表示にするための強力なツールです。この設定により、検索結果、リストビュー、レポート、ページレイアウトからそのフィールドが非表示になります。\n他の回答の解説：\n\na. フィールドを削除するとデータも失われるため、実務的ではありません。\nc. レポートビルダーでフィルタリングしても、検索結果やリストビューには影響を与えません。\nd. ページレイアウトの変更はレイアウトに影響しますが、他のビューには影響しません。", "category": "設定とセットアップ"}, {"question": "毎月1日にすべての顧客データをバックアップし、社内のデータ保管ポリシーを遵守したいと考えています。この要件を満たすために最適なSalesforceのサービスはどれですか？", "choices": ["データモデルビルダー", "定期データエクスポート", "自動レポートエクスポート", "一括データ送信"]
