るため、ユーザーレコード自体をシステムから完全に削除することはできません。\nC. 元従業員のユーザーレコードを凍結する。 - ユーザーの凍結は対象者のログインを即座にブロックする機能ですが、割り当てられているユーザーライセンスは解放されません。他のプロセスの管理者になっているなど、すぐに無効化できない場合の一時的な措置として使用されます。\nD. 元ユーザーのレコードを新しいユーザーに変更する。 - 既存のユーザーレコードの情報を新しいユーザーの情報で上書きすることは、過去のデータの作成者や更新者の履歴が不正確になってしまうため、監査やデータ整合性の観点から推奨されません。必ず新しいユーザーレコードを作成する必要があります。", "category": "設定とセットアップ"}, {"question": "Universal Containersの管理者は、商談の金額が500,000ドルに達したときに営業ディレクターにアラートをトリガーする簡単な方法を必要としています。この要件を満たすために、管理者は何を設定するべきでしょうか？", "choices": ["金額に対して大規模商談アラートを設定する。", "商談更新アラートを有効にする。", "カンバンビューでの商談の警告。", "ホームページの主要な商談コンポーネント。"], "correct": [0], "explanation": "A. 金額に対して大規模商談アラートを設定する。 - 正解です。大規模商談アラートは、商談が指定された金額や確度に達したときに、指定されたユーザーに自動的にメール通知を送信する標準機能です。\nB. 商談更新アラートを有効にする。 - 商談更新アラートは、マネージャーが直属の部下に対して、所有する進行中の商談の定期的なレポートをスケジュールして送信する機能であり、特定の金額に達したときにリアルタイムでトリガーされるアラートではありません。\nC. カンバンビューでの商談の警告。 - カンバンビューでの商談の警告は、ToDoがない、または期限切れのToDoがある商談に対して視覚的な警告を表示する機能であり、金額のしきい値に基づいたメールアラートを送信するものではありません。\nD. ホームページの主要な商談コンポーネント。 - ホームページの主要な商談コンポーネントは、ユーザーにとって重要な商談をリスト表示するものであり、特定の条件が満たされたときにアラートをトリガーする機能ではありません。", "category": "セールス＆マーケティングアプリケーション"}, {"question": "DreamHouse Realtyは、将来の内見が蓄積されすぎるのを防ぐため、内見を今年中にスケジュールすることを求めています。内見日に今年のデータのみが入力されるようにするには、どうすればよいですか？", "choices": ["ユーザーの内見カレンダーをSalesforceに同期し、今年のみを表示するように絞り込む。", "今年スケジュールされていない内見日を表示するレポートを作成して更新する。", "ユーザーが今年の内見日のみを追加すべきであることがわかるように、ヘルプテキストを追加する。", "内見日に今年のデータが含まれていることを確認する入力規則を作成する。"], "correct": [3], "explanation": "A. ユーザーの内見カレンダーをSalesforceに同期し、今年のみを表示するように絞り込む。 - カレンダーの同期や表示の絞り込みは、データの表示を制限するだけであり、ユーザーが不適切な日付のレコードを作成または保存すること自体を防ぐことはできません。\nB. 今年スケジュールされていない内見日を表示するレポートを作成して更新する。 - レポートを使用して事後に誤ったデータを特定することは可能ですが、レコードが保存される前にシステム側で入力をブロックすることはできません。\nC. ユーザーが今年の内見日のみを追加すべきであることがわかるように、ヘルプテキストを追加する。 - ヘルプテキストはユーザーに入力の手引きを提供しますが、システムとしての強制力はないため、ユーザーが無視して今年以外の日付を入力するのを防ぐことはできません。\nD. 内見日に今年のデータが含まれていることを確認する入力規則を作成する。 - 正解です。入力規則を使用することで、ユーザーが入力した日付が現在の年内であるかをシステムが自動的に検証し、条件を満たさない場合はエラーメッセージを表示して保存をブロックすることができます。これにより、要件を確実に満たすことができます。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "Cloud Kicksはカスタム項目を削除することを決定しました。削除されると、その項目のデータはどうなりますか？", "choices": ["項目内のデータは15日間保存されます。", "データは完全に削除されます。", "項目に関連付けられたデータは必須になります。", "データはごみ箱から復元可能です。"], "correct": [0], "explanation": "A. 項目内のデータは15日間保存されます。 - 正解です。Salesforceでは、削除されたカスタム項目とそのデータは即座に完全に削除されるのではなく、15日間（標準の保持期間）は保存され、その期間内であればオブジェクトマネージャの「削除された項目」セクションから復元することが可能です。\nB. データは完全に削除されます。 - 項目を削除した直後にデータが完全に削除されるわけではありません。一定の猶予期間が経過するか、管理者が手動で完全に削除（消去）するまではシステム内に保持されます。\nC. 項目に関連付けられたデータは必須になります。 - カスタム項目を削除することと、そのデータが必須になることは無関係です。削除された項目はユーザーインターフェースから見えなくなります。\nD. データはごみ箱から復元可能です。 - レコードを削除した場合はごみ箱から復元しますが、削除された項目とそのデータはごみ箱ではなく、オブジェクトマネージャの項目と関係にある「削除された項目」という専用のセクションから復元を行います。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "DreamHouse Realtyの管理者は、ケースのページレイアウトにメールクイックアクションを追加しましたが、ケースフィードでそのアクションを表示できません。クイックアクションが想定通りに表示されるようにするには、どの機能を有効にする必要がありますか？", "choices": ["メール通知", "メール-to-ケース", "メールアラート", "メールテンプレート"], "correct": [1], "explanation": "A. メール通知 - メール通知は、特定のイベントが発生したときにユーザーに通知を送信する機能ですが、ケースフィードでのメールクイックアクションの表示を制御するものではありません。\nB. メール-to-ケース - 正解です。ケースフィードでメールアクションを利用および表示するためには、メール-to-ケース機能を有効にする必要があります。これが有効化されていないと、ページレイアウトにアクションを追加してもフィードには表示されません。\nC. メールアラート - メールアラートは、自動化プロセスから事前に定義されたメールを自動送信するための機能であり、ケースフィード上のメール作成アクションの表示を有効にするものではありません。\nD. メールテンプレート - メールテンプレートは送信するメールの定型文を作成するための機能ですが、ケースフィード上でメールクイックアクションの機能自体を有効化して表示させるための設定ではありません。", "category": "サービス＆サポートアプリケーション"}, {"question": "Cloud Kicksのユーザーは、ケースページで自分の役割にとってより有用な情報を表示したいと考えています。管理者はページをより動的で使いやすくするためにどのようにするべきでしょうか？", "choices": ["コンポーネントにコンポーネントの表示条件を追加する。", "レコード詳細コンポーネントから項目を削除する。", "ページから余分なコンポーネントを削除する。", "検索条件を含むタブコンポーネントをさらに追加する。"], "correct": [0], "explanation": "A. コンポーネントにコンポーネントの表示条件を追加する。 - 正解です。Lightningアプリケーションビルダーでコンポーネントの表示条件を設定することで、ユーザーのプロファイルやレコードの項目の値などに基づいて、特定のコンポーネントの表示・非表示を動的に制御できます。これにより、ユーザーの役割に応じて必要な情報だけを提示する使いやすい画面を構築できます。\nB. レコード詳細コンポーネントから項目を削除する。 - レコード詳細コンポーネントから項目を削除すると、そのページレイアウトを割り当てられているすべてのユーザーに対して一律で項目が非表示になります。ユーザーの役割に応じて動的に情報を切り替えるという目的は達成できません。\nC. ページから余分なコンポーネントを削除する。 - ページからコンポーネントを削除するのもすべてのユーザーに影響を与えます。特定の役割を持つユーザーにとって不要なものでも、他の役割のユーザーには必要かもしれないため、動的な解決策にはなりません。\nD. 検索条件を含むタブコンポーネントをさらに追加する。 - タブを使用して情報を整理することは画面をすっきりさせるのに役立ちますが、タブコンポーネントを追加しただけではユーザーの役割に基づく動的な表示制御にはなりません。動的な表示にはコンポーネントの表示条件を使用する必要があります。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "Cloud Kicks (CK) は新しい営業アプリケーションを必要としています。管理者はAppExchangeにアプリケーションパッケージがあることに気付き、CKのニーズを満たすかどうかを確認するためにSandboxでのテストを開始したいと考えています。Sandboxにマネージドパッケージをインストールする際の2つの考慮事項は何ですか？2つ選択してください。", "choices": ["パッケージへのメタデータの変更は、本番環境で再作成する必要があります。", "https://www.google.com/search?q=%E3%82%A4%E3%83%B3%E3%82%B9%E3%83%88%E3%83%BC%E3%83%AB%E3%83%AA%E3%83%B3%E3%82%AF%E3%82%92test.salesforce.comに変更する必要があります。", "「管理者のみのインストール」が利用可能な唯一のインストールオプションになります。", "Sandboxが更新されると、パッケージは削除されます。"], "correct": [1, 3], "explanation": "A. パッケージへのメタデータの変更は、本番環境で再作成する必要があります。 - マネージドパッケージのコンポーネント自体はロックされており、管理者が直接メタデータを変更することはほとんどできません。また、追加で行った設定は変更セットなどで本番環境に移行できるため、必ずしも手動で再作成する必要はありません。\nB. https://www.google.com/search?q=%E3%82%A4%E3%83%B3%E3%82%B9%E3%83%88%E3%83%BC%E3%83%AB%E3%83%AA%E3%83%B3%E3%82%AF%E3%82%92test.salesforce.comに変更する必要があります。 - 正解です。AppExchangeからパッケージをインストールする場合、デフォルトのリンクは本番環境用になっています。Sandboxにインストールするには、https://www.google.com/search?q=URL%E3%82%92test.salesforce.comに変更してSandbox環境にルーティングする必要があります。\nC. 「管理者のみのインストール」が利用可能な唯一のインストールオプションになります。 - Sandboxへのインストール時であっても、本番環境と同様に複数のオプション（管理者のみ、すべてのユーザー、特定のプロファイル）から選択してインストールすることが可能です。\nD. Sandboxが更新されると、パッケージは削除されます。 - 正解です。Sandboxのリフレッシュを実行すると、本番環境の構成でSandboxが完全に上書きされるため、リフレッシュ前にSandboxのみにインストールされていたパッケージは消去されます。", "category": "設定とセットアップ"}, {"question": "Northern Trail Outfittersは、Salesforceから外部の人事システムへの経費レポートを開始したいと考えています。このプロセスはマネージャーとディレクターによる確認が必要です。管理者はどの2つのツールを設定するべきでしょうか？2つ選択してください。", "choices": ["クイックアクション", "アウトバウンドメッセージ", "承認プロセス", "メールアラートアクション"], "correct": [0, 2], "explanation": "A. クイックアクション - 正解です。クイックアクションを使用することで、ユーザーがSalesforce上でレコードから直接、経費レポートの作成やプロセスの開始をすばやく実行できるインターフェースを提供できます。\nB. アウトバウンドメッセージ - アウトバウンドメッセージはSalesforceから外部システムへデータを送信するために使用されますが、マネージャーやディレクターによる段階的な確認プロセスをシステム内で構築する機能ではありません。\nC. 承認プロセス - 正解です。承認プロセスを使用することで、マネージャーやディレクターなどの承認者にレコードの確認と承認を要求する、構造化されたルーティングのワークフローを自動化して構築できます。\nD. メールアラートアクション - メールアラートアクションは指定された受信者にメール通知を送信する機能であり、レコードの送信やマネージャーによる承認のステップ自体を制御および管理するツールではありません。", "category": "自動化"}, {"question": "Cloud Kicksの管理者は、取引先責任者を作成する画面フローをデバッグしようとしています。フロー内の変数の1つがデバッグ画面に表示されません。この問題の原因として何が考えられますか？", "choices": ["入力可能のチェックボックスがオフになっていた。", "フローが非アクティブなバージョンである。", "項目型がデバッグでサポートされていない。", "出力可能のチェックボックスがオフになっていた。"], "correct": [0], "explanation": "A. 入力可能のチェックボックスがオフになっていた。 - 正解です。フローのデバッグ時に変数の初期値を設定したり、外部から値を受け取ったりするには、変数の設定で入力可能チェックボックスがオンになっている必要があります。これがオフの場合、デバッグ画面の入力項目として表示されません。\nB. フローが非アクティブなバージョンである。 - フローが非アクティブなバージョンであっても、フロービルダーキャンバスから直接デバッグを実行することは可能です。したがって、デバッグ画面に変数が表示されない原因にはなりません。\nC. 項目型がデバッグでサポートされていない。 - フローデバッグツールは、フローで使用される標準的な変数のデータ型をサポートしています。項目型が原因でデバッグ画面に変数が表示されないということは基本的にありません。\nD. 出力可能のチェックボックスがオフになっていた。 - 出力可能のチェックボックスは、フローが終了した後にその変数の値を他のプロセスや親フローに渡すために使用されます。デバッグ開始時の入力画面に変数が表示されないことの原因ではありません。", "category": "自動化"}, {"question": "Universal Containersには、3つの独立した事業部門があります。各部門には、ユーザーに表示する必要がある特定の項目があります。ただし、営業チームが必要とする項目は、サービスチームが必要とする項目とは異なります。管理者はこの要件をどのように設定するべきですか？", "choices": ["2つのレコードタイプを作成し、それぞれに3つのページレイアウトを設定する。", "1つのレコードタイプを作成し、6つのページレイアウトを設定する。", "3つのレコードタイプを作成し、それぞれに2つのページレイアウトを設定する。", "6つのレコードタイプを作成し、それぞれに1つのページレイアウトを設定する。"], "correct": [2], "explanation": "A. 2つのレコードタイプを作成し、それぞれに3つのページレイアウトを設定する。 - レコードタイプはビジネスプロセスや要件が異なる事業部門（今回は3つ）に基づいて作成する必要があるため、2つのレコードタイプではすべての部門の要件をカバーすることができません。\nB. 1つのレコードタイプを作成し、6つのページレイアウトを設定する。 - 3つの異なる事業部門があるため、それぞれの業務プロセスや選択リスト値を区別するために、1つではなく3つのレコードタイプを作成する必要があります。\nC. 3つのレコードタイプを作成し、それぞれに2つのページレイアウトを設定する。 - 正解です。3つの事業部門それぞれに対して個別のレコードタイプを作成します（計3つ）。そして、各レコードタイプに対して、営業チーム用とサービスチーム用の2つの異なるページレイアウトを作成し、それぞれのユーザープロファイルに割り当てることで、適切な項目を表示するという要件を満たすことができます。\nD. 6つのレコードタイプを作成し、それぞれに1つのページレイアウトを設定する。 - レコードタイプは事業部門の数（3つ）に合わせて作成すべきです。チーム間（営業とサービス）での表示項目の違いを管理するためにレコードタイプを増やす必要はなく、画面表示の制御にはページレイアウトを使用するのが適切です。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "Northern Trail Outfittersはケースオブジェクトを非公開に設定しています。サポートマネージャーは、担当者が想定よりも広い範囲のデータビューを持っており、グループのダッシュボードですべてのケースを見ることができるという懸念を提起しました。担当者がダッシュボード上のデータに不適切なアクセス権を持つ原因として考えられるものは何ですか？", "choices": ["ダッシュボード検索条件", "ダッシュボードの登録", "動的ダッシュボード", "公開ダッシュボード"], "correct": [2], "explanation": "A. ダッシュボード検索条件 - ダッシュボード検索条件は、ダッシュボード上に表示されるデータをユーザーが絞り込むための機能です。この機能によってユーザーの基盤となるデータアクセス権限が拡大されることはないため、他のユーザーの非公開レコードが見える原因にはなりません。\nB. ダッシュボードの登録 - ダッシュボードの登録は、スケジュールに従ってダッシュボードを自動更新し、その結果をメールで送信する機能です。この設定自体がSalesforce組織内でのダッシュボード閲覧時のデータアクセス権を不適切に広げる直接の原因ではありません。\nC. 動的ダッシュボード - 正解です。動的ダッシュボードを使用すると、ダッシュボードの実行ユーザーとして指定された特定のユーザー（すべてのケースデータにアクセスできるマネージャーなど）の権限でデータが表示されるように設定されている可能性があります。そのため、本来はアクセス権のないレコードのデータであっても、担当者のダッシュボード上に表示されてしまう原因となります。\nD. 公開ダッシュボード - ダッシュボードが公開フォルダーに保存されている場合、対象ユーザーはそのダッシュボード自体にはアクセスできますが、表示されるデータは依然として設定された実行ユーザーのアクセス権限に依存します。公開ダッシュボードにアクセスできるという事実自体が、レコードへのデータアクセス権を不適切に広げているわけではありません。", "category": "データ管理＆分析"}, {"question": "Ursa Major Solarの管理者は、ユーザーがSalesforce組織内で自律型AIエージェントを使用して、自然言語でデータをクエリしたりタスクを実行したりできるようにしたいと考えています。この機能を有効にするための最初のステップは何ですか？", "choices": ["ユーザーに「Agentforceコンソール」権限セットを割り当てる", "[設定] の [Agentforce設定] で「Agentforce」を有効にする", "App Builderで「Einstein Copilot」コンポーネントを配置する", "プロンプトビルダーで新しいテンプレートを作成する"], "correct": [1], "explanation": "A. ユーザーに「Agentforceコンソール」権限セットを割り当てる - 権限の割り当ては必要ですが、機能そのものを有効化する前に行う手順ではありません。\nB. [設定] の [Agentforce設定] で「Agentforce」を有効にする - 正解です。 Agentforceを利用するには、まずシステム管理者が [設定] 画面から機能をグローバルに有効化する必要があります。\nC. App Builderで「Einstein Copilot」コンポーネントを配置する - Agentforceは従来のEinstein Copilotの後継ですが、まずは設定での有効化が先決です。\nD. プロンプトビルダーで新しいテンプレートを作成する - プロンプトビルダーはアクションの構成要素ですが、Agentforce全体の有効化手順とは異なります。", "category": "Agentforce"}, {"question": "管理者は、Agentforceエージェントが特定のビジネスプロセス（例：ケースのクローズや注文状況の確認）を実行できるように設定する必要があります。エージェントがどのような指示に従い、どのアクションを実行するかを決定するための「命令のグループ」を何と呼びますか？", "choices": ["エージェント・プロトコル", "プロンプト・テンプレート", "トピック", "スキル・セット"], "correct": [2], "explanation": "A. エージェント・プロトコル - Salesforceの標準用語ではありません。\nB. プロンプト・テンプレート - 特定の応答を生成するための指示ですが、エージェントの自律的な判断ロジックを構成する単位ではありません。\nC. トピック - 正解です。 Agentforceにおける「トピック（Topic）」は、エージェントが特定の意図（インテント）を理解し、関連するアクションを実行するための指示とガードレールのグループです。\nD. スキル・セット - 以前のEinstein Botなどで使われていた概念に近いですが、Agentforceでは「トピック」と「アクション」という用語が中心となります。", "category": "Agentforce"}, {"question": "管理者は、Agentforceが顧客の機密データを外部のLLM（大規模言語モデル）に送信する際に、データが保護され、モデルの学習に使用されないことを確認したいと考えています。Salesforceのどの機能がこのデータプライバシーを保証しますか？", "choices": ["Shield Platform Encryption", "Einstein Trust Layer", "データの匿名化サービス", "セキュア・コネクタ"], "correct": [1], "explanation": "A. Shield Platform Encryption - 保存データの暗号化機能であり、LLMとの通信時におけるリアルタイムのデータ保護やマスキングを専門とするものではありません。\nB. Einstein Trust Layer - 正解です。 これはデータマスキング、有害コンテンツの検出、および「データ保持ゼロ（Zero Retention）」ポリシーを通じて、生成AI利用時の安全性を確保するSalesforceの標準アーキテクチャです。\nC. データの匿名化サービス - 一般的な用語ですが、Salesforceの特定の機能名ではありません。\nD. セキュア・コネクタ - 外部システムとの接続を指しますが、AIの信頼性担保に特化したフレームワークではありません。", "category": "Agentforce"}, {"question": "管理者は、Agentforceエージェントに特定レコードの更新を行わせるために「フロー（Flow）」をアクションとして追加しました。エージェントがこのフローを正しく呼び出すために、フロー側で設定すべき必須項目は何ですか？", "choices": ["フローを「テンプレート」としてマークする", "フローのAPI参照名を「Agent_」で始める", "フローの要素として「AIポーズ」を追加する", "説明（Description）フィールドにエージェントが理解できる詳細な指示を記入する"], "correct": [3], "explanation": "A. フローを「テンプレート」としてマークする - 必須ではありません。\nB. フローのAPI参照名を「Agent_」で始める - 命名規則は自由であり、動作に影響しません。\nC. フローの要素として「AIポーズ」を追加する - そのような要素は必須ではありません。\nD. 説明（Description）フィールドに詳細な指示を記入する - 正解です。 Agentforceの推論エンジンは、フローの「説明」を読み取って、そのフローが「いつ」「何のために」使われるべきかを判断します。これが不適切だと、エージェントはアクションを正しく選択できません。", "category": "Agentforce"}, {"question": "管理者は、本番環境にAgentforceをデプロイする前に、エージェントがユーザーの入力に対して期待通りのトピックを選択し、正しいアクションを実行するかを確認したいと考えています。どのツールを使用すべきですか？", "choices": ["エージェント・デバッガー", "Agentforce キャンバス", "プロンプト・シミュレーター", "イベント・モニタリング"], "correct": [1], "explanation": "A. エージェント・デバッガー - 似た名称ですが、正しくは「Agentforceビルダー（旧Einstein Copilot ビルダー）」内の「キャンバス」を使用します。\nB. Agentforce キャンバス - 正解です。 Agentforceビルダーのプレビュー（キャンバス）画面では、エージェントと対話し、背後でどのトピックが選択され、どのロジックが実行されたかをリアルタイムで確認（プランニングの可視化）できます。\nC. プロンプト・シミュレーター - プロンプトビルダーで使用されるツールであり、エージェント全体の挙動確認用ではありません。\nD. イベント・モニタリング - 実行後のログ確認には役立ちますが、設定中のテストツールとしてはキャンバスが適切です。", "category": "Agentforce"}, {"question": "管理者は、Agentforceを自社のExperience Cloudサイト（外部サイト）に配置し、顧客が注文ステータスを自己解決できるようにしたいと考えています。Agentforceをサイト上で利用可能にするために使用する設定項目はどれですか？", "choices": ["ページレイアウトの「エージェント・パレット」", "エクスペリエンスビルダーの「組み込みサービスチャット」コンポーネント", "キャンバスアプリの「Agentforce連携」", "サイト設定の「公開アクセス設定」"], "correct": [1], "explanation": "A. ページレイアウトの「エージェント・パレット」 - ページレイアウトは標準画面の構成を管理するもので、外部サイトへのチャネル展開には使用しません。\nB. エクスペリエンスビルダーの「組み込みサービスチャット」コンポーネント - 正解です。 AgentforceをExperience Cloudで公開する場合、組み込みサービス（Embedded Service）の設定を行い、エクスペリエンスビルダーでコンポーネントを配置してデプロイします。\nC. キャンバスアプリの「Agentforce連携」 - キャンバスアプリは外部システムをSalesforce内に埋め込むためのもので、Agentforceの展開方法としては不適切です。\nD. サイト設定の「公開アクセス設定」 - 公開アクセスの許可は必要ですが、これだけではチャットインターフェースは提供されません。", "category": "Agentforce"}, {"question": "Agentforceエージェントがユーザーの要求に対して回答を生成する際、Salesforce内のレコードへのアクセス権はどのように決定されますか？", "choices": ["エージェントには常に「すべてのデータの参照」権限が与えられる", "管理者が「エージェント・システムユーザー」に付与した権限に基づく", "エージェントを使用している「実行ユーザー」の権限に基づく", "プロンプトテンプレートで定義された「データセット」に限定される"], "correct": [2], "explanation": "A. エージェントには常に「すべてのデータの参照」権限が与えられる - セキュリティ上のリスクがあるため、このような仕様にはなっていません。\nB. 管理者が「エージェント・システムユーザー」に付与した権限に基づく - Agentforceはシステムコンテキストではなく、現在のユーザーの権限を尊重します。\nC. エージェントを使用している「実行ユーザー」の権限に基づく - 正解です。 Agentforceはユーザーの権限（共有ルールやプロファイル、権限セット）を遵守するため、ユーザーが通常アクセスできないデータはエージェントも取得・操作できません。\nD. プロンプトテンプレートで定義された「データセット」に限定される - プロンプトテンプレートは入力を定義しますが、最終的なデータアクセス権限はユーザーのセキュリティ設定に従います。", "category": "Agentforce"}, {"question": "管理者は、Agentforceがユーザーの質問に対して「どのトピックを選択すべきか」を判断する推論プロセスを確認したいと考えています。Agentforceビルダーにおいて、AIがプランを立て、実行したステップをログ形式で表示する機能は何ですか？", "choices": ["実行ログ", "プランニング・履歴", "インタラクション・パネル（推論の表示）", "デバッグ・コンソール"], "correct": [2], "explanation": "A. 実行ログ - Salesforce全体のシステムログとは異なります。\nB. プランニング・履歴 - 概念としては近いですが、標準的な機能名ではありません。\nC. インタラクション・パネル（推論の表示） - 正解です。 Agentforceビルダーのテスト画面では、AIがどのように質問を解釈し、どのトピックを選択してプランを作成したかという「思考プロセス」をリアルタイムで確認できます。\nD. デバッグ・コンソール - 開発者コンソールの一部であり、Agentforceの推論確認用ではありません。", "category": "Agentforce"}, {"question": "Einstein Trust Layerの機能の一つで、外部LLMに送信される前にメールアドレスや電話番号などの個人情報を隠し、安全性を高める仕組みはどれですか？", "choices": ["セキュア・ゲートウェイ", "データのマスキング", "毒性検知（Toxicity Detection）", "ゼロ・リテンション"], "correct": [1], "explanation": "A. セキュア・ゲートウェイ - 通信の安全性を指す一般的な用語です。\nB. データのマスキング - 正解です。 Einstein Trust Layerは、プロンプトに含まれる個人識別情報（PII）を動的に検出し、送信前にマスク（置換）することで、機密データがSalesforceの外に出るのを防ぎます。\nC. 毒性検知（Toxicity Detection） - 不適切な内容や有害な回答が生成されるのを防ぐ機能です。\nD. ゼロ・リテンション - 外部LLMプロバイダがデータを保存・学習に使用しないことを保証する規約のことです。", "category": "Agentforce"}, {"question": "管理者がAgentforceにカスタムアクションを追加したいと考えています。既存の「プロンプトテンプレート」をアクションとして呼び出すために必要な設定はどれですか？", "choices": ["プロンプトテンプレートを「有効化」する", "プロンプトテンプレートの種別を「エージェントアクション」にする", "フロー内でプロンプトを呼び出し、そのフローをアクションに指定する", "プロンプトテンプレートのAPI参照名を「Agent_Prompt」にする"], "correct": [1], "explanation": "A. プロンプトテンプレートを「有効化」する - 有効化は必要ですが、それだけではエージェントから呼び出せるようにはなりません。\nB. プロンプトテンプレートの種別を「エージェントアクション」にする - 正解です。 プロンプトビルダーで作成する際、または作成後に、そのテンプレートをエージェントのアクションとして使用できるように設定する必要があります。\nC. フロー内でプロンプトを呼び出し、そのフローをアクションに指定する - フロー経由でも可能ですが、プロンプトテンプレートを直接アクションとして設定するのが最も効率的です。\nD. プロンプトテンプレートのAPI参照名を「Agent_Prompt」にする - 命名規則による制約はありません。", "category": "Agentforce"}, {"question": "営業時間の主な用途として最も適切なものはどれか。", "choices": ["ユーザのログイン時間を制御する", "レコードの共有範囲を決める", "ケースの対応時間やエスカレーションの判定に使用する", "レポートの表示形式を変更する"], "correct": [2], "explanation": "営業時間は、ケースのエスカレーションルールなどで使用され、対応時間の計算に影響します。", "category": "設定とセットアップ"}, {"question": "営業時間に関する説明として正しいものはどれか。", "choices": ["表示用の設定であり、処理には影響しない", "ユーザごとに個別設定する", "ケース管理などで経過時間の計算に使用される", "通貨設定と連動している"], "correct": [2], "explanation": "営業時間は単なる表示設定ではなく、ケースの処理時間やエスカレーション判定などに使用されます。", "category": "設定とセットアップ"}, {"question": "「土日を除いた対応時間でケースの遅延を判断したい」場合、最も適切な設定はどれか。", "choices": ["会計年度", "営業時間と休日", "プロファイル", "公開グループ"], "correct": [1], "explanation": "営業時間に加えて休日を設定することで、土日や祝日を除外した時間計算が可能になります。", "category": "設定とセットアップ"}, {"question": "マスター通貨の説明として最も適切なものはどれか。", "choices": ["ユーザごとに自由に設定できる通貨", "レコードごとに変わる通貨", "組織全体の基準となる通貨", "レポート専用の通貨"], "correct": [2], "explanation": "マスター通貨は組織全体の基準となる通貨であり、すべての金額のベースとなります。", "category": "設定とセットアップ"}, {"question": "複数通貨に関する説明として正しいものはどれか。", "choices": ["有効化後でも簡単に無効化できる", "有効化するとユーザがログインできなくなる", "レコードごとに異なる通貨を扱えるようになる", "通貨はすべて自動で同一になる"], "correct": [2], "explanation": "複数通貨を有効化すると、レコードごとに異なる通貨を設定できます。ただし、一度有効化すると無効に戻すことはできません。", "category": "設定とセットアップ"}, {"question": "複数通貨を有効化する際の注意点として最も重要なものはどれか。", "choices": ["レポートが作成できなくなる", "一度有効化すると無効に戻せない", "ユーザ数が制限される", "オブジェクトが削除される"], "correct": [1], "explanation": "複数通貨は組織全体に影響する重要な設定であり、一度有効化すると元に戻せません。導入前に慎重な判断が必要です。", "category": "設定とセットアップ"}, {"question": "デフォルト設定の説明として最も適切なものはどれか。", "choices": ["ユーザの権限を強制的に固定する設定", "初期値として設定されるが、ユーザが変更できる値", "レコードの共有範囲を決める設定", "オブジェクトを削除する設定"], "correct": [1], "explanation": "デフォルト設定は初期値として適用されますが、ユーザが個別に変更することが可能です。", "category": "設定とセットアップ"}, {"question": "組織のデフォルト言語が日本語の場合の説明として正しいものはどれか。", "choices": ["すべてのユーザは必ず日本語でしか利用できない", "管理者のみ変更できる", "ユーザごとに別の言語へ変更できる", "一度設定すると変更できない"], "correct": [2], "explanation": "デフォルト設定はあくまで初期値であり、ユーザごとに別の言語へ変更することが可能です。", "category": "設定とセットアップ"}, {"question": "デフォルト設定に関する理解として正しいものはどれか。", "choices": ["すべての設定を強制的に統一する仕組みである", "個別ユーザの設定より優先される", "初期状態を決める設定であり、後から変更可能である", "レポート専用の設定である"], "correct": [2], "explanation": "デフォルト設定は初期状態を定めるためのものであり、ユーザが後から変更することができます。", "category": "設定とセットアップ"}, {"question": "営業ユーザから「取引先レコードの画面で、特定の項目の表示順を変更したい」と要望があった。最も適切な対応はどれか。", "choices": ["プロファイルを変更する", "ページレイアウトを変更する", "リストビューを変更する", "Lightning アプリケーションビルダーを変更する"], "correct": [1], "explanation": "項目の表示順や配置はページレイアウトで制御します。Lightning アプリケーションビルダーはページ全体の構造を変更するものであり、項目単位の並び替えは対象外です。", "category": "設定とセットアップ"}, {"question": "ユーザから「一覧画面で表示する列や絞り込み条件を変更したい」と要望があった。最も適切な対応はどれか。", "choices": ["ページレイアウトを変更する", "プロファイルを変更する", "リストビューを変更する", "アプリケーション設定を変更する"], "correct": [2], "explanation": "一覧画面の列表示やフィルタ条件はリストビューで制御します。ページレイアウトはレコード詳細画面の設定であり、一覧表示には影響 れていない", "レコードへのアクセス権がない", "ダッシュボードが作成されていない", "入力規則が設定されている"], "correct": [1], "explanation": "レポートの表示内容は、ユーザーのレコードアクセス権に依存します。", "category": "データ管理＆分析"}, {"question": "レポートのスケジュール配信の説明として正しいものはどれか。", "choices": ["データを削除する機能である", "レポートを自動で更新する機能である", "指定したタイミングでメール送信できる", "ユーザーを作成する機能である"], "correct": [2], "explanation": "スケジュール配信により、定期的にレポートをメール送信できます。", "category": "データ管理＆分析"}, {"question": "レポートのエクスポートに関する説明として正しいものはどれか。", "choices": ["すべてのデータが必ず出力される", "CSVやExcel形式で出力できる", "レコードを削除する機能である", "アクセス権の影響を受けない"], "correct": [1], "explanation": "レポートはCSVやExcel形式でエクスポートできますが、出力内容は権限に依存します。", "category": "データ管理＆分析"}, {"question": "レポート管理において最も重要なポイントはどれか。", "choices": ["レポートの数を増やすこと", "フォルダとアクセス権の適切な管理", "すべてのユーザーに公開すること", "ダッシュボードのみ使用すること"], "correct": [1], "explanation": "レポートはフォルダ単位で管理され、アクセス権の設定が重要となります。", "category": "データ管理＆分析"}, {"question": "あるユーザーはレポートを実行したが、他のユーザーが見えているデータの一部が表示されなかった。最も考えられる原因はどれか。", "choices": ["フィルタ設定が不足している", "レコードへのアクセス権がない", "レポートタイプが間違っている", "ダッシュボード設定の問題"], "correct": [1], "explanation": "レポートに表示されるデータは、ユーザーのアクセス権に依存するため、閲覧権限がないデータは表示されません。", "category": "データ管理＆分析"}, {"question": "OWDが「非公開」に設定されているオブジェクトに対して、ユーザーが閲覧できるレコードはどれか。", "choices": ["すべてのレコード", "他ユーザーのレコードのみ", "自分が所有するレコードのみ", "管理者のみ閲覧可能"], "correct": [2], "explanation": "OWDが非公開の場合、基本的には自分の所有レコードのみ閲覧できます。", "category": "データ管理＆分析"}, {"question": "レポートの表示内容に関する説明として正しいものはどれか。", "choices": ["レポート設定のみで決まる", "すべてのデータが表示される", "ユーザーのアクセス権に依存する", "ダッシュボードの設定に依存する"], "correct": [2], "explanation": "レポートは、ユーザーがアクセス可能なデータのみを表示します。", "category": "データ管理＆分析"}, {"question": "グローバル企業で、日本の営業担当者だけ画面表示を日本語にしたい。他国ユーザーの表示言語は変更したくない。この要件を満たす設定はどれか。", "choices": ["組織情報でデフォルト言語を日本語に変更する", "ユーザー詳細で該当ユーザーの言語を日本語に変更する", "プロファイルで日本語を有効化する", "ロケールを日本に変更する"], "correct": [1], "explanation": "表示言語はユーザー単位で設定できる。特定ユーザーだけ変更したいなら、ユーザー詳細の言語設定を変更する。組織全体のデフォルト言語は、新規ユーザーや未設定ユーザーの初期値として使われるが、個別要件には向かない。言語とロケールは別物で、言語＝UIの表示言語、ロケール＝日付・数値・通貨の表示形式という違いがある。", "category": "設定とセットアップ"}, {"question": "あるユーザーから「日付の表示が突然MM/DD/YYYYになった」と問い合わせがあった。画面の言語は日本語のままでよい。このとき最初に確認すべき設定はどれか。", "choices": ["タイムゾーン", "ロケール", "組織のデフォルト言語", "プロファイル"], "correct": [1], "explanation": "日付形式、数値区切り、通貨表示形式はロケールで制御される。言語が日本語でも、ロケールが米国なら日付表示はMM/DD/YYYYになりうる。タイムゾーンは「何時か」に影響し、ロケールは「どう表示するか」に影響する点が認定アドミンで頻出。", "category": "設定とセットアップ"}, {"question": "複数国で利用するため、組織でマルチ通貨を有効化することになった。管理者がこの設定について事前に理解しておくべき重要事項はどれか。", "choices": ["有効化後もいつでも無効化できる", "マスター通貨はユーザーごとに設定する", "有効化後は無効化できない", "通貨はプロファイルで管理する"], "correct": [2], "explanation": "マルチ通貨は一度有効化すると元に戻せない。そのため、有効化前に運用設計をよく確認する必要がある。マスター通貨は組織レベルで確認するものであり、ユーザーごとに設定するのはユーザーの個人のデフォルト通貨である。", "category": "設定とセットアップ"}, {"question": "サポート部門で、ケースのエスカレーションルールにおいて「営業時間内のみ時間経過をカウントしたい」と要望があった。この要件を満たすために中心となる設定はどれか。", "choices": ["会計年度", "営業時間", "ロール階層", "レコードタイプ"], "correct": [1], "explanation": "ケースのエスカレーションルールでは、営業時間（Business Hours）が使われる。祝日と組み合わせることで、SLAの計算対象時間をより正確に制御できる。会計年度はレポート集計や期間管理向けで、ケースSLAには使わない。", "category": "設定とセットアップ"}, {"question": "既存プロファイルは変更せず、特定ユーザー1名だけに「給与」カスタムオブジェクトの参照権限を追加したい。最も適切な方法はどれか。", "choices": ["共有ルールを作成する", "権限セットを割り当てる", "公開グループを作成する", "ロールを変更する"], "correct": [1], "explanation": "特定ユーザーにだけ追加のオブジェクト権限を与える場合は権限セットが最適。試験ではまず「オブジェクトに入れるか→プロファイル／権限セット」「レコードを見せるか→OWD／ロール／共有ルール」の2つを分けて考えるとよい。共有ルールはレコード共有であり、オブジェクト自体の参照権限は付与できない。", "category": "設定とセットアップ"}, {"question": "営業部全体が、自分が所有していない商談も閲覧できるようにしたい。商談の組織の共有設定は現在「非公開」で、商談オブジェクトの参照権限は既にある。", "choices": ["商談のページレイアウトを変更する", "所有者に基づく共有ルールを作成する", "商談のタブを表示する", "プロファイルに参照項目を追加する"], "correct": [1], "explanation": "OWDが非公開のときに、一定のユーザー集団へ例外的にレコード共有したいなら共有ルールを使う。設問では「営業部全体」という共有先が明確なので、所有者に基づく共有ルールが典型解。ページレイアウトはレコード可視性を変えず、タブ表示もレコード範囲には影響しない。", "category": "設定とセットアップ"}, {"question": "管理者は、組織の設定変更を後から確認したいと考えている。「誰がいつセットアップ変更を行ったか」を確認する機能として最も適切なのはどれか。", "choices": ["ログイン履歴", "項目履歴管理", "セットアップ監査証跡", "レポート履歴"], "correct": [2], "explanation": "設定変更の監査にはセットアップ監査証跡（Setup Audit Trail）を使う。ログイン履歴は認証や接続状況の確認であり、設定変更履歴ではない。項目履歴管理はレコードデータ変更の追跡で、セットアップ変更は追えない。", "category": "設定とセットアップ"}, {"question": "あるユーザーが毎日18時以降にログインできないようにしたい。この要件を最も直接的に実現する設定はどれか。", "choices": ["ユーザー詳細のタイムゾーン", "プロファイルのログイン時間", "組織のセッション設定", "信頼済みIP範囲"], "correct": [1], "explanation": "ログイン可能時間の制御はプロファイルのログイン時間で行う。IP制限と並んで、プロファイル単位の代表的なセキュリティ設定。タイムゾーンは表示時刻の基準であり、ログイン可否は制御しない。", "category": "設定とセットアップ"}, {"question": "ユーザーが初めての端末・場所からログインした場合だけ追加認証を求めたい。ログイン自体を禁止するのではなく、認証確認を促す目的で利用する設定はどれか。", "choices": ["ログイン時間", "信頼済みIP範囲", "共有ルール", "公開グループ"], "correct": [1], "explanation": "信頼済みIP範囲は、既知のネットワークでは認証コードを省略し、範囲外では確認を求めるための設定。「完全ブロック」ではなく「認証確認」に関係する点がポイント。プロファイルのログインIP制限（範囲外はログイン不可）との違いを試験でよく問われる。", "category": "設定とセットアップ"}, {"question": "サポートキューを作成し、ケースを一時的にチームで受け持てるようにしたい。キューの説明として正しいものはどれか。", "choices": ["キューはレコードの所有者になれない", "キューはレコードを待機させ、メンバーが取得できる", "キューはオブジェクト権限を付与する", "キューは公開グループと同じ機能である"], "correct": [1], "explanation": "キューは、担当者がまだ決まっていないレコードを待機させる場所であり、メンバーが取得できる。ケースやリードなどでよく使われる。キューは所有者になれる点が重要で、公開グループ（共有先の束ね役）とは役割が異なる。", "category": "設定とセットアップ"}, {"question": "営業チーム全体で利用するアプリのナビゲーション項目を変更したい。ユーザー個別ではなく、アプリ単位で統一したい場合の設定はどれか。", "choices": ["ユーザー設定", "Lightningアプリケーションビルダー", "プロファイル", "組織情報"], "correct": [1], "explanation": "アプリごとのナビゲーションや画面構成はLightningアプリケーションビルダーで管理する。ユーザー単位ではなく「アプリ単位」で制御したいときに使うのがポイント。ユーザー個別の並び替えは可能だが、統一したい場合はアプリ側で設定する。", "category": "設定とセットアップ"}, {"question": "特定のユーザーだけに新機能へのアクセス権を追加したいが、既存プロファイルは変更したくない。最適な方法はどれか。", "choices": ["新しいプロファイルを作成", "権限セットを作成して割り当て", "公開グループを作成", "共有ルールを作成"], "correct": [1], "explanation": "プロファイルを変更せずに追加権限を付与する場合は権限セットが基本。プロファイル＝ベース、権限セット＝追加という役割分担を徹底することが重要。", "category": "設定とセットアップ"}, {"question": "組織の共有設定（OWD）が「公開／参照のみ」の場合に、さらにアクセス権を制限したい。適切な対応はどれか。", "choices": ["共有ルールを使用する", "ロール階層を変更する", "OWDをより制限的な設定に変更する", "公開グループを作成する"], "correct": [2], "explanation": "共有ルールやロールは「アクセスを広げる」仕組みであり、制限を強めるためには使えない。制限したい場合はOWD自体をより厳しくする必要がある。OWDは最もベースのセキュリティであり、ここをどう設定するかが設計の出発点となる。", "category": "設定とセットアップ"}, {"question": "ユーザーがログアウトせずに長時間放置した場合、自動的にログアウトさせたい。この設定はどこで行うか。", "choices": ["プロファイル", "セッション設定", "ロール", "共有ルール"], "correct": [1], "explanation": "セッションタイムアウトはセッション設定で管理する。一定時間操作がない場合の自動ログアウトを制御できる。プロファイルにも一部関連設定はあるが、基本は組織のセッション設定で考える。", "category": "設定とセットアップ"}, {"question": "あるレポートフォルダを営業チーム全体で閲覧できるようにしたい。この要件に最も関係する設定はどれか。", "choices": ["OWD", "フォルダ共有", "ロール階層", "項目レベルセキュリティ"], "correct": [1], "explanation": "レポートやダッシュボードは「フォルダ単位」で共有する。レコード共有とは別の仕組みなので注意。試験では「レポートが見れない問題」はフォルダ設定を疑う。", "category": "設定とセットアップ"}, {"question": "ユーザーがシステムにログインできるIPアドレスを制限したい。最も直接的な設定はどれか。", "choices": ["信頼済みIP範囲", "プロファイルのログインIP制限", "セッション設定", "公開グループ"], "correct": [1], "explanation": "ログイン自体を制限するのはプロファイルのログインIP制限であり、範囲外はログイン不可になる。信頼済みIP範囲は「認証省略」であり、ログイン禁止ではない点が異なる。", "category": "設定とセットアップ"}, {"question": "複数ユーザーで処理するリードを一時的に管理したい。担当が決まるまでレコードを保留する方法はどれか。", "choices": ["公開グループ", "キュー", "ロール", "レコードタイプ"], "correct": [1], "explanation": "キューはレコードを一時的に保管し、メンバーが取得できる仕組みで、リード・ケースで頻出する。「担当未確定」＝キューと覚えると強い。公開グループは共有先の束ねであり、キューとは役割が異なる。", "category": "設定とセットアップ"}, {"question": "ユーザーに対して、オブジェクトの「編集」権限はあるが、特定項目のみ編集させたくない。最も適切な設定はどれか。", "choices": ["OWD", "項目レベルセキュリティ", "ロール", "共有ルール"], "correct": [1], "explanation": "項目単位の制御は項目レベルセキュリティ（FLS）で行う。オブジェクト権限よりも細かい制御が可能。権限の優先関係は「オブジェクト権限→項目レベル→レコード共有」の順で考えると整理しやすい。", "category": "設定とセットアップ"}, {"question": "あるユーザーに「ログイン履歴」を確認させたいが、設定変更履歴は見せたくない。この違いとして正しい理解はどれか。", "choices": ["両方同じ情報を持つ", "ログイン履歴は認証情報、監査トレイルは設定変更", "監査トレイルはログイン情報", "両方レコード履歴"], "correct": [1], "explanation": "ログイン履歴＝ログイン情報、監査トレイル＝設定変更履歴であり、完全に用途が異なる。ここは混同しやすい頻出ポイントである。", "category": "設定とセットアップ"}, {"question": "新しく作成したカスタムオブジェクトがナビゲーションに表示されない。最初に確認すべき設定はどれか。", "choices": ["レコードタイプ", "タブの作成と割り当て", "OWD", "共有ルール"], "correct": [1], "explanation": "カスタムオブジェクトは作成しただけでは表示されない。タブを作成し、プロファイルやアプリに割り当てる必要がある。「見えない系問題」は、タブ・プロファイル・アプリの3点をチェックするのが基本。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "取引先と取引先責任者の関係として正しいものはどれか。営業担当者は「会社」と「人」を分けて管理したいと考えている。", "choices": ["主従関係", "参照関係（ルックアップ）", "多対多関係", "階層関係"], "correct": [1], "explanation": "取引先（会社）と取引先責任者（人）は参照関係である。人は会社に紐づくが、所有や削除の影響は独立している。会社＝取引先、人＝取引先責任者という関係はSalesforceの基本思想であり頻出基礎。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "親レコード削除時に子レコードも自動削除される関係はどれか。", "choices": ["参照関係", "主従関係", "外部関係", "階層関係"], "correct": [1], "explanation": "主従関係では、子は親に完全依存するため、親削除で子も削除される。主従の特徴は、子に所有者がない、セキュリティは親依存、ロールアップ集計可能という点である。参照関係では親削除時は子は残る（または参照解除）。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "子レコードの合計金額を親レコードに自動表示したい。最適な機能はどれか。", "choices": ["数式項目", "クロスオブジェクト数式", "積み上げ集計項目", "ワークフロー"], "correct": [2], "explanation": "子→親への集計は積み上げ集計項目である。主従関係でのみ利用できる点が重要。方向性が重要で、親→子は不可、子→親は可能（ロールアップ）と覚える。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "親オブジェクトの項目を子オブジェクト側に表示したい。最適な方法はどれか。", "choices": ["数式項目", "クロスオブジェクト数式", "ロールアップ集計", "ページレイアウト"], "correct": [1], "explanation": "親の値を子に表示するのはクロスオブジェクト数式であり、親の更新に応じて自動更新される。方向を覚えるコツは、親→子はクロスオブジェクト数式、子→親はロールアップ集計。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "商談のフェーズを「新規営業」と「既存営業」で分けたい。それぞれ異なる選択リストを使う場合の設定はどれか。", "choices": ["ページレイアウト", "レコードタイプ", "ロール", "OWD"], "correct": [1], "explanation": "選択リストの値を制御するのはレコードタイプであり、ビジネスプロセスと組み合わせて使う。レコードタイプの役割はページレイアウト分岐、選択リスト制御、プロセス分岐である。ページレイアウトは配置だけで値制御はできない。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "営業チームごとに異なる画面レイアウトを使いたい。最適な設定はどれか。", "choices": ["レコードタイプ＋ページレイアウト", "ロール", "共有ルール", "キュー"], "correct": [0], "explanation": "画面構成を分けるには、レコードタイプとページレイアウトの割り当てを組み合わせて使う。試験では「画面が違う」＝ページレイアウト、「条件ごとに分ける」＝レコードタイプと整理する。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "カスタムオブジェクトを作成したが、画面に表示されない。ユーザーに見せるために必要な作業はどれか。", "choices": ["OWD設定", "タブ作成と割り当て", "レコードタイプ設定", "ロール設定"], "correct": [1], "explanation": "オブジェクト作成だけでは表示されない。タブ作成とプロファイルへの割り当てが必要である。「見えない問題」はタブまたはプロファイルの確認から始めるとよい。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "Lightningページで特定条件のときだけコンポーネントを表示したい。どの機能を使うか。", "choices": ["ページレイアウト", "コンポーネント表示条件", "レコードタイプ", "OWD"], "correct": [1], "explanation": "Lightningアプリケーションビルダーでは条件付き表示（Component Visibility）が使える。項目値・ユーザー・デバイスなどの条件で制御可能である。ページレイアウトは静的なレイアウトであり、細かい表示制御には向かない。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "ある項目に入力された値が条件を満たさない場合、保存できないようにしたい。どの機能を使用するか。", "choices": ["入力規則（Validation Rule）", "ワークフロー", "フロー", "レコードタイプ"], "correct": [0], "explanation": "保存時のチェックは入力規則であり、条件を満たさないとエラーで保存不可になる。実行順序的にも入力規則はかなり早い段階で実行される。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "2つのオブジェクト間で多対多の関係を構築したい。最適な方法はどれか。", "choices": ["主従関係を2つ設定", "参照関係を1つ設定", "連結オブジェクトを作成", "ロール階層を設定"], "correct": [2], "explanation": "多対多は連結（ジャンクション）オブジェクトで実現する。2つの主従関係を持たせるのが基本構造。試験では「多対多」と出たら即ジャンクションオブジェクトと考えればよい。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "参照関係（ルックアップ）において、親レコードが削除された場合の挙動として正しいものはどれか。", "choices": ["子レコードも削除される", "子レコードの参照が解除される", "子レコードは編集不可になる", "親は削除できない"], "correct": [1], "explanation": "参照関係では、親削除時に子は残り、参照が外れる。設定によっては削除禁止も可能だが、基本挙動は参照解除であり、主従関係との違いを問う典型問題である。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "主従関係において、子レコードのアクセス権はどのように決まるか。", "choices": ["子レコードの所有者", "親レコードの共有設定", "プロファイルのみ", "ロール階層のみ"], "correct": [1], "explanation": "主従関係では子は親に完全依存するため、アクセス権も親に従う。子に所有者がないため、独立した共有制御ができない点が重要。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "カスタム項目を削除した場合の影響として正しいものはどれか。", "choices": ["すぐ完全削除される", "一定期間復元可能", "データは保持され続ける", "レポートのみ削除される"], "correct": [1], "explanation": "カスタム項目は削除後も一定期間（通常15日）復元可能であり、その後完全削除される。試験では「即削除」か「復元可能か」がよく問われる。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "あるページで項目の表示順を変更したい。どの設定を変更するべきか。", "choices": ["項目とリレーション", "ページレイアウト", "レコードタイプ", "OWD"], "correct": [1], "explanation": "画面上の配置・順序はページレイアウトで管理する。項目の「存在」は項目設定、項目の「表示」はページレイアウトで制御する点を区別しておく。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "選択リストの値を全オブジェクトで統一して使いたい。最適な方法はどれか。", "choices": ["レコードタイプ", "グローバル値セット", "ページレイアウト", "入力規則"], "correct": [1], "explanation": "グローバル値セットを使うことで複数オブジェクトで同じ選択肢を共有できる。変更時に一括反映されるのがメリットである。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "Lightningページを編集したが、ユーザーに反映されない。最初に確認すべきことはどれか。", "choices": ["レコードタイプ", "有効化（アクティベーション）", "OWD", "ロール"], "correct": [1], "explanation": "Lightningページは編集後に「有効化」しないと反映されない。割り当て先（組織・アプリ・プロファイル）も重要な確認ポイントである。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "標準オブジェクトの項目ラベルを変更したい。どの設定から行うのが適切か。", "choices": ["ページレイアウト", "タブと表示ラベルの変更", "OWD", "ロール"], "correct": [1], "explanation": "標準項目の表示名は「タブと表示ラベルの変更」から変更する。これは地味にひっかけポイントで、項目編集画面ではない点に注意が必要。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "ある項目を必須入力にしたいが、特定条件のときのみ必須にしたい。最適な方法はどれか。", "choices": ["必須項目設定", "入力規則", "ページレイアウト", "レコードタイプ"], "correct": [1], "explanation": "条件付き必須は入力規則で実現する。ページレイアウトの必須設定は「常に必須」となり、条件付きの制御はできない。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "商談とケースを1つのレポートで同時に表示したい。最適なレポート形式はどれか。", "choices": ["表形式", "サマリ", "マトリックス", "結合レポート"], "correct": [3], "explanation": "異なるオブジェクトを同時表示するには結合レポートを使う。通常のレポートは1つのレポートタイプに依存するため、表形式・サマリ・マトリックスでは対応できない。", "category": "データ管理＆分析"}, {"question": "親オブジェクトに関連する子レコードを画面に表示したい。どの設定を使用するか。", "choices": ["ページレイアウトの関連リスト", "レコードタイプ", "OWD", "入力規則"], "correct": [0], "explanation": "親画面に子を表示するには関連リストをページレイアウトに追加する。親→子は関連リスト、子→親は項目参照（クロスオブジェクト数式など）と覚えておくとよい。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "営業チームで、商談の進行状況に応じて表示するフェーズを制御したい。適切な設定はどれか。", "choices": ["ページレイアウト", "セールスプロセス", "ロール", "OWD"], "correct": [1], "explanation": "商談フェーズの制御はセールスプロセスで行う。レコードタイプと組み合わせて使うのが基本。セールスプロセス＝選択リスト制御、ページレイアウト＝表示制御という違いが重要。", "category": "セールス＆マーケティングアプリケーション"}, {"question": "営業担当者に、次に取るべきアクションを画面上でガイドしたい。最適な機能はどれか。", "choices": ["ダッシュボード", "パス", "レポート", "リストビュー"], "correct": [1], "explanation": "パスは商談フェーズごとに推奨アクションを表示できる、営業支援の代表機能である。パス＝ガイド、ダッシュボード＝分析という役割の違いを押さえておく。", "category": "セールス＆マーケティングアプリケーション"}, {"question": "リードが一定条件を満たした場合、自動的に担当者へ割り当てたい。どの機能を使うか。", "choices": ["ワークフロー", "リード割り当てルール", "レコードタイプ", "OWD"], "correct": [1], "explanation": "リードの自動振り分けはリード割り当てルールで行う。リード系の機能は割り当てと取引開始（コンバート）の2つが重要である。", "category": "セールス＆マーケティングアプリケーション"}, {"question": "リードを取引開始したときに作成される標準オブジェクトの組み合わせはどれか。", "choices": ["取引先・ケース・商談", "取引先・取引先責任者・商談", "取引先・キャンペーン・ケース", "商談・ケース・ナレッジ"], "correct": [1], "explanation": "リード変換で作成されるのは取引先・取引先責任者・商談である。リードは「人＋会社＋商談」に分解されるという理解が超頻出。", "category": "セールス＆マーケティングアプリケーション"}, {"question": "マーケティングチームが、特定キャンペーンに参加した顧客を管理したい。使用するオブジェクトはどれか。", "choices": ["商談商品", "キャンペーンメンバー", "リードスコア", "ケース"], "correct": [1], "explanation": "キャンペーンと顧客（リード・取引先責任者）を結びつけるのがキャンペーンメンバーである。キャンペーン＝施策、メンバー＝参加者という関係を押さえておく。", "category": "セールス＆マーケティングアプリケーション"}, {"question": "営業マネージャーが、複数の商談データを視覚的に分析したい。最も適切なツールはどれか。", "choices": ["リストビュー", "ダッシュボード", "レコードタイプ", "パス"], "correct": [1], "explanation": "ダッシュボードは複数のレポートをグラフなどで可視化し、データを視覚的に分析するための機能である。リストビューは一覧表示にとどまり、視覚的な分析には向かない。", "category": "データ管理＆分析"}, {"question": "営業担当者が、商談の確度を過去データに基づいて自動評価したい。どの機能を使用するか。", "choices": ["ワークフロー", "Einstein商談スコアリング", "パス", "リストビュー"], "correct": [1], "explanation": "AIを使った確度予測はEinstein商談スコアリングで行う。「過去データ」「AI」といったキーワードが出たらEinstein系の機能と判断する。", "category": "セールス＆マーケティングアプリケーション"}, {"question": "営業担当者が、ホーム画面で重要なタスクや商談を確認したい。最適な機能はどれか。", "choices": ["ホームページアシスタント", "レコードタイプ", "OWD", "キュー"], "correct": [0], "explanation": "ホームページアシスタントは重要な作業や商談を提示する、営業効率化の代表機能である。", "category": "セールス＆マーケティングアプリケーション"}, {"question": "リードを特定の条件で分類し、優先度をつけたい。最適な機能はどれか。", "choices": ["リードスコアリング", "レコードタイプ", "キャンペーン", "ダッシュボード"], "correct": [0], "explanation": "リードの優先順位付けはスコアリングで行う。EinsteinリードスコアもこのCategoryに含まれる。", "category": "セールス＆マーケティングアプリケーション"}, {"question": "商談に複数の商品を関連付けて売上を管理したい。使用する機能はどれか。", "choices": ["商談商品", "キャンペーンメンバー", "ケース", "リード"], "correct": [0], "explanation": "商談と商品を紐づけるのは商談商品である。価格表とセットで理解するのが重要。", "category": "セールス＆マーケティングアプリケーション"}, {"question": "新規ケースが作成された際に、自動で担当チームへ振り分けたい。最も適切な機能はどれか。", "choices": ["ケース割り当てルール", "ワークフロー", "レコードタイプ", "OWD"], "correct": [0], "explanation": "ケースの自動振り分けはケース割り当てルールを使う。条件に応じてユーザーまたはキューへ割り当てられる。「自動で担当を決める」＝割り当てルールと覚える。", "category": "サービス＆サポートアプリケーション"}, {"question": "サポートチームで、未対応のケースを複数人で管理し、誰でも引き取れるようにしたい。最適な仕組みはどれか。", "choices": ["公開グループ", "キュー", "ロール", "レコードタイプ"], "correct": [1], "explanation": "キューにケースを入れることで、メンバーが自由に取得できる。ケース・リードではキューが頻出する。", "category": "サービス＆サポートアプリケーション"}, {"question": "顧客からケースが登録された直後に、自動で受付確認メールを送りたい。最適な機能はどれか。", "choices": ["エスカレーションルール", "自動レスポンスルール", "ワークフロー", "フロー"], "correct": [1], "explanation": "受付確認メールは自動レスポンスルールで送信する。ケース・リードどちらにも存在する機能で、「受付メール」＝レスポンスと覚える。", "category": "サービス＆サポートアプリケーション"}, {"question": "一定時間以内に対応されていないケースを上位担当者に通知したい。最適な機能はどれか。", "choices": ["ケース割り当てルール", "エスカレーションルール", "レコードタイプ", "キュー"], "correct": [1], "explanation": "時間経過による対応はエスカレーションルールで行う。営業時間を考慮できる点も特徴。「時間経過」＝エスカレーションと覚える。", "category": "サービス＆サポートアプリケーション"}, {"question": "ケースの進行状況（新規、対応中、完了など）を管理したい。どの設定が中心となるか。", "choices": ["サポートプロセス", "ロール", "OWD", "公開グループ"], "correct": [0], "explanation": "ケースのステータス管理はサポートプロセスで行う。リード＝リードプロセス、商談＝セールスプロセス、ケース＝サポートプロセスという対応を覚えておくとよい。", "category": "サービス＆サポートアプリケーション"}, {"question": "顧客からの問い合わせ内容を蓄積し、他の担当者が参照できるようにしたい。最適な機能はどれか。", "choices": ["ナレッジ", "キャンペーン", "商談", "リード"], "correct": [0], "explanation": "ナレッジはFAQや対応履歴を蓄積し再利用するための機能であり、サポート効率化の中心機能である。", "category": "サービス＆サポートアプリケーション"}, {"question": "ケースをWebフォームから自動作成したい。最適な機能はどれか。", "choices": ["Web-to-Case", "Web-to-Lead", "フロー", "レポート"], "correct": [0], "explanation": "Webからケースを作成する標準機能はWeb-to-Caseである。リード版はWeb-to-Lead。", "category": "サービス＆サポートアプリケーション"}, {"question": "サポート担当者のスキルや負荷に応じてケースを自動振り分けしたい。最適な機能はどれか。", "choices": ["キュー", "オムニチャネル", "ロール", "OWD"], "correct": [1], "explanation": "オムニチャネルは負荷やスキルに応じて自動割り当てができる。「高度な割り当て」＝オムニチャネルと覚える。キューは単純な待機の仕組みで役割が異なる。", "category": "サービス＆サポートアプリケーション"}, {"question": "クローズ済みケースの特定項目を表示したいが、現在表示されていない。どの設定を確認するべきか。", "choices": ["サポート設定", "OWD", "ロール", "レコードタイプ"], "correct": [0], "explanation": "クローズケースの表示制御はサポート設定にある。ここは細かい試験知識として出ることがある。", "category": "サービス＆サポートアプリケーション"}, {"question": "ケースの担当者が複数人で協力して対応する必要がある。この要件に最も適した機能はどれか。", "choices": ["ケースチーム", "公開グループ", "ロール", "レコードタイプ"], "correct": [0], "explanation": "ケースチームを使うと複数人で役割分担して対応できる。商談チームとケースチームはセットで覚えておくとよい。", "category": "サービス＆サポートアプリケーション"}, {"question": "営業担当者が「やるべき作業」を管理するために使用する機能はどれか。", "choices": ["ケース", "タスク", "商談", "キャンペーン"], "correct": [1], "explanation": "タスクはToDo（やること）管理であり、活動管理の基本。活動＝タスク＋イベントとセットで覚える。", "category": "生産性向上とコラボレーション"}, {"question": "営業担当者が顧客との訪問予定を管理したい。最適な機能はどれか。", "choices": ["タスク", "イベント", "ケース", "リード"], "correct": [1], "explanation": "イベントはスケジュール管理（会議・訪問）に使う。タスク＝期限付き作業、イベント＝時間指定の予定という違いを押さえる。", "category": "生産性向上とコラボレーション"}, {"question": "活動履歴を1つの画面で時系列に確認したい。どの機能が最適か。", "choices": ["リストビュー", "活動タイムライン", "ダッシュボード", "レポート"], "correct": [1], "explanation": "活動タイムラインはタスク・イベントを時系列で表示する機能であり、営業現場でかなり使われるUIである。", "category": "生産性向上とコラボレーション"}, {"question": "チーム内で情報共有やコメントのやり取りをリアルタイムで行いたい。最適な機能はどれか。", "choices": ["Chatter", "ケース", "レポート", "フロー"], "correct": [0], "explanation": "Chatterは社内SNS機能であり、投稿・コメント・通知が可能である。レコード単位で会話できるのが強み。", "category": "生産性向上とコラボレーション"}, {"question": "特定のテーマごとにユーザーを集めて議論したい。最適なChatter機能はどれか。", "choices": ["レコードフィード", "Chatterグループ", "タスク", "ロール"], "correct": [1], "explanation": "Chatterグループはテーマ単位での情報共有に使う機能で、公開／非公開グループの設定も可能である。", "category": "生産性向上とコラボレーション"}, {"question": "外出先の営業担当者がスマートフォンで商談情報を更新したい。最適な機能はどれか。", "choices": ["Salesforceモバイルアプリ", "ダッシュボード", "レポート", "AppExchange"], "correct": [0], "explanation": "Salesforceモバイルアプリを使えば外出先からデータ操作が可能。活動記録・商談更新・通知確認などに対応している。", "category": "生産性向上とコラボレーション"}, {"question": "モバイルアプリでできることとして正しいものはどれか。", "choices": ["レコードの閲覧のみ", "レコードの作成・編集", "設定変更のみ", "共有設定のみ"], "correct": [1], "explanation": "モバイルでもレコードの作成・編集が可能である。PCと同等とはいかないが、実務操作は十分に可能。", "category": "生産性向上とコラボレーション"}, {"question": "Salesforceの機能を拡張するアプリを導入したい。最適な入手先はどれか。", "choices": ["Chatter", "AppExchange", "レポート", "Lightningビルダー"], "correct": [1], "explanation": "AppExchangeは公式アプリマーケットであり、外部アプリを追加できる。無料・有料アプリの両方が存在する。", "category": "生産性向上とコラボレーション"}, {"question": "営業チームで日々の活動量を可視化したい。最も適した方法はどれか。", "choices": ["活動レポート", "Chatter投稿", "ケース管理", "ロール設定"], "correct": [0], "explanation": "活動データはレポートで集計・可視化する。活動＝タスク・イベントが対象となる。", "category": "データ管理＆分析"}, {"question": "Chatterで投稿した内容を特定ユーザーに通知したい。最適な方法はどれか。", "choices": ["レコードタイプ", "メンション（@ユーザー）", "OWD", "キュー"], "correct": [1], "explanation": "@メンションを使うことで特定ユーザーに通知できる。実務でもよく使う基本操作である。", "category": "生産性向上とコラボレーション"}, {"question": "大量のレコードを一括でインポートしたい。データ量は数万件である。最も適切なツールはどれか。", "choices": ["データインポートウィザード", "データローダ", "レポート", "フロー"], "correct": [1], "explanation": "大量データ（数万件以上）はデータローダを使う。インポートウィザードは比較的小規模向けである。目安として、少量＝ウィザード、大量＝データローダと覚える。", "category": "データ管理＆分析"}, {"question": "既存データを更新する際に、レコードを正しく特定するために必要なものはどれか。", "choices": ["レコードタイプ", "外部IDまたはレコードID", "ロール", "OWD"], "correct": [1], "explanation": "更新時はレコードの特定が必要であり、レコードIDまたは外部IDがキーになる。外部IDは外部システムとの連携で頻出する。", "category": "データ管理＆分析"}, {"question": "データを誤って削除した場合に備えて、定期的にデータを保存しておきたい。最適な方法はどれか。", "choices": ["レポート", "データエクスポート", "ダッシュボード", "Chatter"], "correct": [1], "explanation": "データエクスポートでバックアップが可能。スケジュール設定もできる。バックアップ＝エクスポートと覚える。", "category": "データ管理＆分析"}, {"question": "入力時に特定条件を満たさない場合、レコード保存を防ぎたい。使用する機能はどれか。", "choices": ["ワークフロー", "入力規則", "レコードタイプ", "レポート"], "correct": [1], "explanation": "入力規則は保存時のチェックを行い、条件違反なら保存不可にする、最も基本的なデータ品質管理の機能である。", "category": "オブジェクトマネージャーとLightningアプリケーションビルダー"}, {"question": "レポートでデータをグループ化して集計したい。最適なレポート形式はどれか。", "choices": ["表形式", "サマリレポート", "結合レポート", "ダッシュボード"], "correct": [1], "explanation": "グループ化と集計を行うにはサマリレポートを使う。表形式はグループ化ができない点に注意する。", "category": "データ管理＆分析"}, {"question": "レポートで「親に子がないレコード」だけ抽出したい。どの機能を使うか。", "choices": ["クロスフィルター", "入力規則", "OWD", "ロール"], "correct": [0], "explanation": "クロスフィルターを使うことで、関連レコードの有無を条件にできる。「with／without」の条件はクロスフィルターで設定する。", "category": "データ管理＆分析"}, {"question": "ユーザーがレポートを見られない原因として最も可能性が高いものはどれか。", "choices": ["レコードタイプ", "フォルダ共有設定", "ページレイアウト", "パス"], "correct": [1], "explanation": "レポートはフォルダ単位で共有される。「レポートが見られない」問題は、まずフォルダ共有設定を疑うのが基本。", "category": "データ管理＆分析"}, {"question": "ダッシュボードで、ユーザーごとに異なるデータを表示したい。最適な設定はどれか。", "choices": ["固定ユーザー", "実行ユーザー（動的）", "レコードタイプ", "OWD"], "correct": [1], "explanation": "動的ダッシュボードなら、閲覧者の権限に応じたデータが表示される。固定ユーザーは同じデータを全員に表示し、動的はユーザーごとに表示内容が変わる。", "category": "データ管理＆分析"}, {"question": "ダッシュボードのデータが最新でない場合の原因として正しいものはどれか。", "choices": ["レコードタイプ未設定", "更新ボタンを押していない", "ロール未設定", "入力規則未設定"], "correct": [1], "explanation": "ダッシュボードは手動またはスケジュールでの更新が必要である。レポートはリアルタイムだが、ダッシュボードは更新操作が必要な点に注意する。", "category": "データ管理＆分析"}, {"question": "レポートで複数のオブジェクトを同時に分析したい。最適な方法はどれか。", "choices": ["サマリレポート", "結合レポート", "表形式", "入力規則"], "correct": [1], "explanation": "複数オブジェクトを同時に扱うには結合レポートを使う。最大で複数ブロックによる分析が可能である。", "category": "データ管理＆分析"}, {"question": "レコード作成時に自動で項目値を更新したい。最も推奨される方法はどれか。", "choices": ["ワークフロールール", "プロセスビルダー", "フロー", "レコードタイプ"], "correct": [2], "explanation": "現在はFlow Builderが標準の自動化ツールであり、ワークフローやプロセスビルダーは非推奨の方向にある。試験では「基本はフロー」と考えてよい。", "category": "自動化"}, {"question": "レコード更新時に複数条件分岐し、複雑な処理を実行したい。最適なツールはどれか。", "choices": ["ワークフロールール", "フロー", "入力規則", "ダッシュボード"], "correct": [1], "explanation": "複雑な条件分岐や複数処理はフロー一択である。分岐・ループ・複雑処理＝フローと覚えるとよい。", "category": "自動化"}, {"question": "レコード保存前に条件チェックを行い、エラーを表示したい。最適な機能はどれか。", "choices": ["フロー", "入力規則", "ワークフロー", "プロセスビルダー"], "correct": [1], "explanation": "保存前のエラー制御は入力規則で行う。フローでも実現可能だが、基本は入力規則を使う。", "category": "自動化"}, {"question": "上司の承認が必要なレコードについて、承認フローを構築したい。最適な機能はどれか。", "choices": ["フロー", "承認プロセス", "ワークフロー", "レポート"], "correct": [1], "explanation": "承認ステップを伴う処理には承認プロセスを使う。承認＝専用機能と覚える。フローでも組み合わせは可能だが、標準は承認プロセスである。", "category": "自動化"}, {"question": "レコード作成後に自動でメール通知を送りたい。最もシンプルな方法はどれか。", "choices": ["フロー", "ワークフロールール", "ダッシュボード", "ロール"], "correct": [0], "explanation": "現在はフローが推奨の方法であり、メール送信も簡単に設定できる。試験では「今の推奨＝フロー」と考えるとよい。", "category": "自動化"}, {"question": "複数オブジェクトにまたがる処理を自動化したい。最適なツールはどれか。", "choices": ["ワークフロールール", "フロー", "入力規則", "レコードタイプ"], "correct": [1], "explanation": "複数オブジェクトにまたがる処理はフローが強い。ワークフローは単一オブジェクト寄りの機能である。", "category": "自動化"}, {"question": "一定条件で承認申請を自動開始したい。最適な方法はどれか。", "choices": ["承認プロセスのみ", "フローから承認起動", "ワークフロー", "レポート"], "correct": [1], "explanation": "承認プロセスは単体では自動起動できないため、フローと組み合わせて使う。自動起動系の処理にはフローが絡むことが多い。", "category": "自動化"}, {"question": "レコード更新時に関連レコードも更新したい。最適なツールはどれか。", "choices": ["ワークフロールール", "フロー", "入力規則", "ダッシュボード"], "correct": [1], "explanation": "関連レコードの更新はフローの得意分野である。「他オブジェクトに触る」＝フローと覚えるとよい。", "category": "自動化"}, {"question": "ユーザーが入力した内容に応じて画面の流れを変えたい。最適なツールはどれか。", "choices": ["フロー（画面フロー）", "ワークフロー", "レコードタイプ", "OWD"], "correct": [0], "explanation": "画面付きの分岐処理には画面フローを使う。ユーザー入力を伴う自動化＝画面フローと覚える。", "category": "自動化"}, {"question": "一定条件でレコードの所有者を変更したい。最適なツールはどれか。", "choices": ["フロー", "レコードタイプ", "ロール", "入力規則"], "correct": [0], "explanation": "所有者変更などの自動処理はフローで実現できる。フローはほぼ何でもできる万能ツールとして押さえておくとよい。", "category": "自動化"}, {"question": "管理者は、顧客からの問い合わせに自動対応し、必要に応じて人間のオペレーターへエスカレーションできるAIエージェントを構築したいと考えている。この目的に最も適した標準テンプレートはどれか。", "choices": ["Agentforce for Sales（SDRエージェント）", "Agentforce Service Agent", "Agentforce Sales Coach", "Agentforceプロンプトビルダー"], "correct": [1], "explanation": "A. Agentforce for Sales（SDRエージェント） - リード獲得や商談準備を支援するエージェントであり、顧客対応の一次窓口向けではありません。\nB. Agentforce Service Agent - 正解です。 問い合わせ対応と自己解決、必要時の人間へのエスカレーションを標準機能として備えたサービス向けの標準エージェントです。\nC. Agentforce Sales Coach - 営業担当者のロールプレイやコーチングを目的としたエージェントです。\nD. Agentforceプロンプトビルダー - エージェントを構成する部品の一つであり、テンプレート自体ではありません。", "category": "Agentforce"}, {"question": "管理者は、Agentforceエージェントが応答を生成する際に、Data Cloud内で統合された顧客データを根拠（グラウンディング）として利用したいと考えている。この仕組みを何と呼ぶか。", "choices": ["データグラウンディング（Retrieval Augmented Generation）", "フロートリガー", "承認プロセス", "権限セットグループ"], "correct": [0], "explanation": "A. データグラウンディング（Retrieval Augmented Generation） - 正解です。 エージェントが回答を生成する前に、Data CloudやSalesforceのデータを検索して根拠として組み込む仕組みで、回答の正確性を高めます。\nB. フロートリガー - レコードの変更をきっかけに自動処理を実行する仕組みで、AIの応答根拠とは無関係です。\nC. 承認プロセス - 承認ステップを管理する機能であり、データ参照の仕組みではありません。\nD. 権限セットグループ - 権限セットをまとめて割り当てる機能であり、データグラウンディングとは無関係です。", "category": "Agentforce"}, {"question": "管理者は、Agentforceエージェントに独自の複雑なビジネスロジックを実行させるカスタムアクションを追加したい。標準アクションやフローだけでは対応できない処理を実装する場合、最も適切な方法はどれか。", "choices": ["レポートをアクションとして追加する", "Invocable Apexメソッドを作成し、アクションとして公開する", "プロンプトテンプレートのみで対応する", "ダッシュボードをアクションとして追加する"], "correct": [1], "explanation": "A. レポートをアクションとして追加する - レポートはデータの可視化機能であり、アクションとしては利用できません。\nB. Invocable Apexメソッドを作成し、アクションとして公開する - 正解です。 標準アクションやフローでは実現できない複雑な処理は、@InvocableMethodを付与したApexメソッドを作成し、カスタムアクションとしてエージェントに追加します。\nC. プロンプトテンプレートのみで対応する - プロンプトテンプレートはテキスト生成の指示であり、複雑な業務ロジックの実行はできません。\nD. ダッシュボードをアクションとして追加する - ダッシュボードは分析機能であり、アクションとしては利用できません。", "category": "Agentforce"}, {"question": "あるユーザーがAgentforceエージェントを起動できないという問い合わせが管理者に届いた。トラブルシューティングとして最初に確認すべき設定はどれか。", "choices": ["ユーザーに必要なAgentforce関連の権限セットが割り当てられているか", "ユーザーのタイムゾーン設定", "ユーザーの言語設定", "ユーザーのロール階層の位置"], "correct": [0], "explanation": "A. ユーザーに必要なAgentforce関連の権限セットが割り当てられているか - 正解です。 エージェントの利用にはAgentforce関連の権限セットが必要であり、これが未割り当てだと起動できません。まず確認すべき基本項目です。\nB. ユーザーのタイムゾーン設定 - 表示時刻に影響するのみで、エージェントの起動可否とは関係しません。\nC. ユーザーの言語設定 - 表示言語に影響するのみで、起動可否の直接原因にはなりにくいです。\nD. ユーザーのロール階層の位置 - レコード共有の縦方向の範囲に関係し、エージェント起動の可否そのものとは直接関係しません。", "category": "Agentforce"}, {"question": "管理者は、Agentforceエージェントが給与や人事情報など特定の話題について一切回答しないように制限したいと考えている。この制御を設定する場所はどれか。", "choices": ["トピックの指示（スコープ）に、扱わせない内容を明記する", "プロファイルの項目レベルセキュリティ", "組織の共有設定（OWD）", "レポートのフィルタ条件"], "correct": [0], "explanation": "A. トピックの指示（スコープ）に、扱わせない内容を明記する - 正解です。 トピックの指示（Instructions）にガードレールとして明確に禁止事項を記述することで、AIが特定の話題を扱わないよう制御できます。\nB. プロファイルの項目レベルセキュリティ - データ項目へのアクセス制御であり、会話トピックの制限には使えません。\nC. 組織の共有設定（OWD） - レコードの共有範囲を制御する設定であり、会話内容の制限とは異なります。\nD. レポートのフィルタ条件 - レポートの表示データを絞り込む機能であり、AIの応答内容の制御には使えません。", "category": "Agentforce"}, {"question": "管理者は、本番リリース前に多数のテストケース（会話パターン）を一括で実行し、エージェントの応答精度をまとめて評価したいと考えている。この目的に最も適したツールはどれか。", "choices": ["会話プレビュー（単発の対話テスト）", "Agentforceのテストセンター（一括テスト実行機能）", "デバッグログ", "セットアップ監査証跡"], "correct": [1], "explanation": "A. 会話プレビュー（単発の対話テスト） - 1件ずつ対話を試すのに適していますが、大量のテストケースをまとめて評価する用途には向きません。\nB. Agentforceのテストセンター（一括テスト実行機能） - 正解です。 事前に用意した複数のテストケースを一括実行し、期待したトピック選択やアクション実行が行われているかを効率的に検証できます。\nC. デバッグログ - Apexなどの実行ログを確認する機能であり、会話パターンの一括評価には使いません。\nD. セットアップ監査証跡 - 設定変更履歴の確認機能であり、エージェントの応答精度評価とは無関係です。", "category": "Agentforce"}, {"question": "管理者は、社内のSlackチャンネルからもAgentforceエージェントを利用できるようにしたいと考えている。この要件を満たす設定はどれか。", "choices": ["エージェントの配置先としてSlackチャネルを追加する", "レポートフォルダをSlackに共有する", "プロファイルにSlackアクセス権を追加する", "Chatterグループを新規作成する"], "correct": [0], "explanation": "A. エージェントの配置先としてSlackチャネルを追加する - 正解です。 Agentforceは複数のチャネル（Webサイト、モバイルアプリ、Slackなど）に配置でき、Slackを利用先として追加することで社内チャットからも利用可能になります。\nB. レポートフォルダをSlackに共有する - レポートの共有方法であり、エージェントの提供チャネル設定とは異なります。\nC. プロファイルにSlackアクセス権を追加する - Salesforceのプロファイル設定にSlackアクセス権という項目はありません。\nD. Chatterグループを新規作成する - 社内コラボレーション機能であり、エージェントのチャネル展開とは無関係です。", "category": "Agentforce"}, {"question": "Agentforceのアクションに関する説明として最も適切なものはどれか。", "choices": ["標準アクションはSalesforceがあらかじめ用意しており、多くは追加設定なしで利用できる", "すべてのアクションはApexで実装しなければならない", "アクションはトピックとは無関係に単独で動作する", "1つのエージェントには1つのアクションしか追加できない"], "correct": [0], "explanation": "A. 標準アクションはSalesforceがあらかじめ用意しており、多くは追加設定なしで利用できる - 正解です。 レコード検索やケースのクローズなど、よく使われる処理は標準アクションとして提供されており、そのまま利用できるものが多くあります。\nB. すべてのアクションはApexで実装しなければならない - 誤りです。フローやプロンプトテンプレート、標準アクションなど複数の方法があります。\nC. アクションはトピックとは無関係に単独で動作する - 誤りです。アクションはトピックに紐づけられ、トピックの指示に従って呼び出されます。\nD. 1つのエージェントには1つのアクションしか追加できない - 誤りです。1つのエージェントには複数のトピックとアクションを追加できます。", "category": "Agentforce"}, {"question": "管理者は、Agentforceエージェントが自力で解決できない問い合わせについて、自動的に人間のオペレーターへ引き継ぐ仕組みを構築したいと考えている。この機能は一般的に何と呼ばれるか。", "choices": ["エスカレーション（人間へのハンドオフ）アクション", "データグラウンディング", "プロンプトテンプレート", "トピック分類"], "correct": [0], "explanation": "A. エスカレーション（人間へのハンドオフ）アクション - 正解です。 標準アクションとして用意されており、エージェントが解決できないと判断した場合に会話を人間のオペレーターへ引き継ぐことができます。\nB. データグラウンディング - 回答生成時にデータを根拠として参照する仕組みであり、人への引き継ぎ機能ではありません。\nC. プロンプトテンプレート - 応答文を生成するための指示であり、引き継ぎの仕組みそのものではありません。\nD. トピック分類 - ユーザーの意図を判定してトピックを選ぶ処理であり、人へのエスカレーションとは別の概念です。", "category": "Agentforce"}, {"question": "次のうち、Agentforceの導入が最も効果的なユースケースはどれか。", "choices": ["定型的な問い合わせ対応を自動化し、人的リソースの負担を軽減する", "会社の会計年度を変更する", "組織の共有設定（OWD）を変更する", "既存のレコードタイプを削除する"], "correct": [0], "explanation": "A. 定型的な問い合わせ対応を自動化し、人的リソースの負担を軽減する - 正解です。 頻出する定型的な質問への自動応答や一次対応は、AIエージェントの活用が特に効果的なユースケースです。\nB～D. 会計年度の変更、共有設定の変更、レコードタイプの削除 - いずれも管理者が手動で行う設定変更であり、AIエージェントを導入する典型的なユースケースではありません。", "category": "Agentforce"}, {"question": "管理者がトピックの指示（Instructions）を作成する際のベストプラクティスとして最も適切なものはどれか。", "choices": ["具体的かつ明確な指示を、短い文で複数に分けて記述する", "できるだけ長い一つの段落にすべての指示をまとめる", "指示は一切記述せず、AIの判断にすべて任せる", "指示文の中にプログラムコードを直接埋め込む必要がある"], "correct": [0], "explanation": "A. 具体的かつ明確な指示を、短い文で複数に分けて記述する - 正解です。 曖昧さを避け、AIが正しく意図を解釈できるよう、簡潔で明確な指示を複数に分けて記述することが推奨されています。\nB. できるだけ長い一つの段落にすべての指示をまとめる - 長文で複雑な指示は誤解釈の原因になりやすく、推奨されません。\nC. 指示は一切記述せず、AIの判断にすべて任せる - 指示がないとエージェントの挙動が不安定になりやすく、適切ではありません。\nD. 指示文の中にプログラムコードを直接埋め込む必要がある - 指示は自然言語で記述するものであり、コードの埋め込みは不要です。", "category": "Agentforce"}, {"question": "管理者がAgentforceビルダーでエージェントの設定を完了した。エンドユーザーが実際に利用できるようにするために、最後に必要な操作はどれか。", "choices": ["エージェントを有効化（アクティベート）する", "レポートを作成する", "ダッシュボードを共有する", "入力規則を作成する"], "correct": [0], "explanation": "A. エージェントを有効化（アクティベート）する - 正解です。 設定を完了しただけでは利用できず、エージェントを有効化することで初めてエンドユーザーが利用できる状態になります。\nB～D. レポート作成、ダッシュボード共有、入力規則作成 - いずれもエージェントの提供とは直接関係のない操作です。", "category": "Agentforce"}, {"question": "Einstein Trust Layerが提供する、外部LLMプロバイダーに送信したデータを保持させない仕組みを何と呼ぶか。", "choices": ["ゼロデータ保持（Zero Data Retention）", "データエクスポート機能", "単純なキャッシュ機能", "セットアップ監査証跡"], "correct": [0], "explanation": "A. ゼロデータ保持（Zero Data Retention） - 正解です。 Einstein Trust Layerは、外部LLMプロバイダーとの通信において、送信されたデータがモデルの学習や保存に利用されないことを保証するポリシーを備えています。\nB. データエクスポート機能 - Salesforceのデータを外部に取り出す機能であり、Trust Layerのプライバシー保護とは異なります。\nC. 単純なキャッシュ機能 - 一時的なデータ保持を指す一般的な用語であり、Trust Layerの中核機能ではありません。\nD. セットアップ監査証跡 - 設定変更履歴を記録する機能であり、LLMへのデータ送信保護とは無関係です。", "category": "Agentforce"}, {"question": "管理者は、Agentforceエージェントを本番展開する前に、実際のユーザーとの対話を模擬して応答内容を確認したいと考えている。Agentforceビルダー内でこれを行う機能はどれか。", "choices": ["会話プレビュー", "セットアップ監査証跡", "データローダー", "レポートビルダー"], "correct": [0], "explanation": "A. 会話プレビュー - 正解です。 Agentforceビルダー内から実際のユーザーとの対話を模擬し、トピックの選択やアクションの実行結果、 let questions = [];    // {id, setId, question, choices:[], correct:[idx...], explanation}
let history = {};      // { [setId]: [ {date,total,correctCount,wrongIds:[]}, ... up to 3, index0=今回 ] }
let missed = {};       // { [setId]: [questionId, ...] } 一度でも間違えて、まだ正解し直せていない問題の累積プール
let draft = null;      // {setId, questionIds, answers, currentIndex, mode, label}
let session = null;    // active quiz session (mirrors draft while in-progress)
let currentSetId = null;

const LABELS = ["今回","前回","前々回"];
const DEFAULT_CATEGORY = '未分類';
function qCategory(q){ return q.category || DEFAULT_CATEGORY; }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastT);
  window._toastT = setTimeout(()=>t.classList.remove('show'), 2200);
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function getCurrentSet(){ return sets.find(s=>s.id===currentSetId); }
function setQuestions(sid){ return questions.filter(q=>q.setId===(sid||currentSetId)); }

/* ============ init (with migration from pre-multi-set version) ============ */
async function init(){
  questions = (await sGet('sf_questions')) || [];
  sets      = (await sGet('sf_sets')) || [];
  const rawHistory = await sGet('sf_history');
  missed    = (await sGet('sf_missed')) || {};
  draft     = (await sGet('sf_draft')) || null;

  if(sets.length===0 && questions.length>0 && !questions[0].setId){
    // 旧バージョン（セット機能なし）のデータを1つのセットに移行する
    const legacyId = uid();
    sets = [{id:legacyId, name:'インポート済みの問題'}];
    questions = questions.map(q=>({...q, setId:legacyId}));
    history = Array.isArray(rawHistory) ? {[legacyId]: rawHistory} : {};
    if(draft && !draft.setId) draft.setId = legacyId;
    await sSet('sf_sets', sets);
    await sSet('sf_questions', questions);
    await sSet('sf_history', history);
    if(draft) await sSet('sf_draft', draft);
  } else {
    history = (rawHistory && !Array.isArray(rawHistory)) ? rawHistory : {};
  }

  await ensureSeeded();
  goto('sets');
}

/* mondai1.csv の内容をアプリに一度だけ自動反映する（手動インポート不要） */
async function ensureSeeded(){
  const done = await sGet('sf_seed_v17_done');
  if(done) return;
  let setObj = sets.find(s=>s.name===SEED_SET_NAME);
  if(setObj){
    // 既存の同名セットがある場合は、その中身をレビュー済みの内容に差し替える
    questions = questions.filter(q=>q.setId!==setObj.id);
  } else {
    setObj = { id: uid(), name: SEED_SET_NAME };
    sets.push(setObj);
  }
  const seeded = SEED_QUESTIONS.map(q => ({ id: uid(), setId: setObj.id, ...q }));
  questions = questions.concat(seeded);
  await sSet('sf_sets', sets);
  await sSet('sf_questions', questions);
  await sSet('sf_seed_v17_done', true);
}

/* ============ router ============ */
let view = 'sets';
let viewParam = null;

function goto(v, param){ view=v; viewParam=param; render(); window.scrollTo({top:0,behavior:'instant'}); }

function render(){
  const app = document.getElementById('app');
  if(view==='sets') app.innerHTML = renderSets();
  else if(view==='setHome') app.innerHTML = renderSetHome();
  else if(view==='quiz') app.innerHTML = renderQuiz();
  else if(view==='result') app.innerHTML = renderResult();
  else if(view==='wrongList') app.innerHTML = renderWrongList(viewParam);
  else if(view==='manage') app.innerHTML = renderManage();
  bindEvents();
}

/* ============ SETS (top-level list) ============ */
function renderSets(){
  const rows = sets.map(s=>{
    const count = setQuestions(s.id).length;
    const h = (history[s.id]||[])[0];
    return `<div class="qlist-item">
      <div>
        <div class="qtext" style="font-weight:600;font-size:14.5px;">${escapeHtml(s.name)}</div>
        <div class="qmeta">${count}問${h ? ` ・ 前回スコア ${h.correctCount}/${h.total}` : ''}</div>
      </div>
      <div class="row">
        <button class="btn-primary btn-sm" data-act="open-set" data-id="${s.id}">開く</button>
        <button class="btn-danger btn-sm" data-act="delete-set" data-id="${s.id}">削除</button>
      </div>
    </div>`;
  }).join('') || `<div class="empty-note">まだクイズセットがありません。下のフォームから作成してください。</div>`;

  return `
  <div class="ticket">
    <div>
      <div class="eyebrow">STUDY TICKET</div>
      <h1>Salesforce 過去問トレーナー</h1>
      <div class="sub">「アドミニストレーター」「プラットフォーム基礎」のように試験範囲ごとにセットを分けて学習できます</div>
    </div>
    <div class="stub">
      <div class="num">${sets.length}</div>
      <div class="lbl">SET</div>
    </div>
  </div>

  <div class="card">
    <h2>クイズセット一覧</h2>
    ${rows}
  </div>

  <div class="card">
    <h2>新しいクイズセットを作成</h2>
    <div class="desc">出題範囲や試験名で分けて作成してください（例：アドミニストレーター、プラットフォーム基礎、Sales Cloudコンサルタント）。</div>
    <div class="row">
      <input type="text" class="input-inline" id="newSetName" placeholder="例：プラットフォーム基礎">
      <button class="btn-primary" data-act="create-set">作成する</button>

async function createSet(){
  const inp = document.getElementById('newSetName');
  const name = (inp?.value||'').trim();
  if(!name){ toast('セット名を入力してください'); return; }
  const id = uid();
  sets.push({id, name});
  await sSet('sf_sets', sets);
  toast(`「${name}」を作成しました`);
  currentSetId = id;
  goto('setHome');
}

function openSet(id){
  currentSetId = id;
  goto('setHome');
}

async function deleteSet(id){
  const s = sets.find(x=>x.id===id);
  if(!s) return;
  if(!confirm(`「${s.name}」を削除しますか？セット内の問題と成績履歴もすべて削除されます。`)) return;
  sets = sets.filter(x=>x.id!==id);
  questions = questions.filter(q=>q.setId!==id);
  delete history[id];
  delete missed[id];
  await sSet('sf_sets', sets);
  await sSet('sf_questions', questions);
  await sSet('sf_history', history);
  await sSet('sf_missed', missed);
  if(draft && draft.setId===id){ draft=null; await sDel('sf_draft'); }
  toast('セットを削除しました');
  goto('sets');
}

/* ============ SET HOME (per-set dashboard) ============ */
const NOTE100_CATEGORY = 'note100問';

function getCategoryBreakdown(){
  const qs = setQuestions().filter(q=>qCategory(q)!==NOTE100_CATEGORY);
  const map = {};
  qs.forEach(q=>{ const c=qCategory(q); (map[c]=map[c]||[]).push(q); });
  return Object.entries(map)
    .map(([name,list])=>({name, count:list.length}))
    .sort((a,b)=> b.count - a.count);
}

function getNote100Count(){
  return setQuestions().filter(q=>qCategory(q)===NOTE100_CATEGORY).length;
}

  return `

        <div class="eyebrow">STUDY TICKET · ${escapeHtml(set.name)}</div>

/* ============ start / resume quiz ============ */
function startAll(){
  const qs = setQuestions();
  if(qs.length===0) return;
  const set = getCurrentSet();
  session = {
    questionIds: qs.map(q=>q.id),
    answers: qs.map(()=>[]),
    checked: qs.map(()=>false),
    currentIndex: 0,
    mode:'all',
    label:`${set.name}・全問`,
    setId: currentSetId
  };
  goto('quiz');
}

function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

/* カテゴリごとに偏りが出ないよう、公平に割り当てながら合計totalWanted件を選ぶ */
function stratifiedSample(qs, totalWanted){
  const groups = {};
  qs.forEach(q=>{ const c=qCategory(q); (groups[c]=groups[c]||[]).push(q); });
  const pools = Object.keys(groups).map(c=>({cat:c, items:shuffleArray(groups[c])}));
  const wanted = Math.min(totalWanted, qs.length);
  const picked = [];
  while(picked.length < wanted){
    const active = pools.filter(p=>p.items.length>0);
    if(active.length===0) break;
    const need = wanted - picked.length;
    const share = Math.max(1, Math.floor(need/active.length));
    let progressed = false;
    for(const p of active){
      if(picked.length>=wanted) break;
      const take = Math.min(share, p.items.length, wanted-picked.length);
      if(take>0){ picked.push(...p.items.splice(0,take)); progressed = true; }
    }
    if(!progressed) break;
  }
  return shuffleArray(picked);
}

function startRandom(count){
  const qs = setQuestions();
  if(qs.length===0) return;
  const set = getCurrentSet();
  const picked = stratifiedSample(qs, count);
  session = {
    questionIds: picked.map(q=>q.id),
    answers: picked.map(()=>[]),
    checked: picked.map(()=>false),
    currentIndex: 0,
    mode:'random',
    label:`${set.name}・ランダム${picked.length}問`,
    setId: currentSetId

}

function resumeDraft(){
  if(!draft || draft.setId!==currentSetId) return;
  const keepIdx = draft.questionIds
    .map((id,i)=> questions.find(q=>q.id===id) ? i : -1)
    .filter(i=>i>=0);
  if(keepIdx.length !== draft.questionIds.length) toast('一部の問題が削除されていたため除外しました');
  session = {
    questionIds: keepIdx.map(i=>draft.questionIds[i]),
    answers: keepIdx.map(i=>draft.answers[i]),
    checked: keepIdx.map(i=> draft.checked ? !!draft.checked[i] : false),
    currentIndex: Math.min(draft.currentIndex, Math.max(0, keepIdx.length-1)),
    mode: draft.mode,
    label: draft.label,
    setId: draft.setId
  };
  goto('quiz');
}

async function discardDraft(){
  draft = null;
  await sDel('sf_draft');
  toast('一時保存を破棄しました');
  render();
}

async function saveDraftNow(){
  if(!session) return;
  draft = {
    setId: session.setId,
    questionIds: session.questionIds,
    answers: session.answers,
    checked: session.checked,
    currentIndex: session.currentIndex,
    mode: session.mode,
    label: session.label
  };
  await sSet('sf_draft', draft);
  toast('一時保存しました');
  goto('setHome');
}

/* ============ QUIZ VIEW ============ */
function currentQuestion(){
  const id = session.questionIds[session.currentIndex];
  return questions.find(q=>q.id===id);
}
function isAnswerCorrect(q, userSel){
  const user = (userSel||[]).slice().sort();
  const corr = q.correct.slice().sort();
  return user.length===corr.length && user.every((v,k)=>v===corr[k]);
}

function renderQuiz(){
  if(!session || session.questionIds.length===0){
    goto('setHome'); return '';
  }
  const q = currentQuestion();
  if(!q){
    session.currentIndex = Math.min(session.currentIndex+1, session.questionIds.length-1);
    return renderQuiz();
  }
  const idx = session.currentIndex;
  const total = session.questionIds.length;
  const selected = session.answers[idx] || [];
  const isMulti = q.correct.length > 1;
  const checked = !!session.checked[idx];
  const correct = checked ? isAnswerCorrect(q, selected) : null;

  const choicesHtml = q.choices.map((c,i)=>{
    const sel = selected.includes(i);
    const isCorrectChoice = q.correct.includes(i);
    let cls = isMulti?'':'radio';
    let mark = '';
    if(!checked){
      if(sel){ cls+=' selected'; mark='✓'; }
    } else {
      cls+=' locked';
      if(isCorrectChoice){ cls+=' correct-mark'; mark='✓'; }
      else if(sel){ cls+=' wrong-mark'; mark='✕'; }
    }
    return `<div class="choice ${cls}" data-act="${checked?'':'pick'}" data-i="${i}">
      <div class="mark">${mark}</div>
      <div>${escapeHtml(c)}</div>
    </div>`;
  }).join('');

  const feedbackHtml = checked ? `
    <div class="feedback-banner ${correct?'good':'bad'}">${correct?'✅ 正解！':'❌ 不正解'}</div>
    <div class="explain-box"><b>解説：</b>${escapeHtml(q.explanation||'（解説なし）')}</div>
  ` : '';

  return `
    <div class="progress-wrap">
      <span class="progress-label">${escapeHtml(session.label)}</span>
      <div class="progress-bar"><div class="progress-fill" style="width:${((idx+1)/total*100).toFixed(0)}%"></div></div>
      <span class="progress-label">${idx+1} / ${total}</span>
    </div>
    <div class="card">
      <div class="set-pill">${escapeHtml(qCategory(q))}</div>
      ${isMulti ? `<div class="multi-hint">複数選択（${q.correct.length}つ選択してください）</div>` : ''}
      <div class="question-text">${escapeHtml(q.question)}</div>
      ${choicesHtml}
      ${feedbackHtml}
    </div>
    <div class="quiz-nav">
      <button class="btn-ghost" data-act="prev" ${idx===0?'disabled':''}>← 戻る</button>
      <button class="btn-ghost" data-act="save-draft">一時保存して終了</button>
      ${!checked
        ? `<button class="btn-amber" data-act="check-answer" ${selected.length===0?'disabled':''}>回答する</button>`
        : (idx < total-1
            ? `<button class="btn-primary" data-act="next">次へ →</button>`
            : `<button class="btn-amber" data-act="finish">採点する</button>`)}
    </div>
  `;
}

function pickChoice(i){
  const q = currentQuestion();
  const idx = session.currentIndex;
  if(session.checked[idx]) return;
  if(!session.answers[idx]) session.answers[idx]=[];
  const arr = session.answers[idx];
  const isMulti = q.correct.length>1;
  const pos = arr.indexOf(i);
  if(isMulti){
    if(pos>=0) arr.splice(pos,1); else arr.push(i);
  } else {
    session.answers[idx] = pos>=0 ? [] : [i];
  }
  render();
}

function checkAnswer(){
  const idx = session.currentIndex;
  if((session.answers[idx]||[]).length===0) return;
  session.checked[idx] = true;
  render();
}

function navQuiz(dir){
  session.currentIndex = Math.max(0, Math.min(session.questionIds.length-1, session.currentIndex+dir));
  render();
}

async function finishQuiz(){
  const total = session.questionIds.length;
  let correctCount = 0;
  const wrongIds = [];
  const detail = [];
  session.questionIds.forEach((id,i)=>{
    const q = questions.find(x=>x.id===id);
    if(!q) return;
    const user = (session.answers[i]||[]).slice().sort();
    const corr = q.correct.slice().sort();
    const isCorrect = user.length===corr.length && user.every((v,k)=>v===corr[k]);
    if(isCorrect) correctCount++; else wrongIds.push(id);
    detail.push({id, user, correct:corr});
  });

  const resultEntry = {
    date: new Date().toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}),
    total, correctCount, wrongIds
  };
  const sid = session.setId;
  history[sid] = [resultEntry, ...(history[sid]||[])].slice(0,3);
  await sSet('sf_history', history);

  // 苦手問題プールを更新：今回間違えた問題は追加、正解できた問題は除外する
  const correctIdsThisRun = session.questionIds.filter(id=>!wrongIds.includes(id));
  const missedSet = new Set(missed[sid] || []);
  wrongIds.forEach(id=>missedSet.add(id));
  correctIdsThisRun.forEach(id=>missedSet.delete(id));
  missed[sid] = [...missedSet];
  await sSet('sf_missed', missed);

  if(draft && draft.setId===sid){ draft = null; await sDel('sf_draft'); }

  session.finished = true;
  session.detail = detail;
  session.result = resultEntry;
  goto('result');
}

function renderResult(){

  const r = session.result;
  const good = r.correctCount === r.total;
  const wrongDetail = session.detail.filter(d=>{
    const q = questions.find(x=>x.id===d.id);
    return q && !(d.user.length===d.correct.length && d.user.every((v,k)=>v===d.correct[k]));
  });

  const wrongHtml = wrongDetail.map(d=>{
    const q = questions.find(x=>x.id===d.id);

/* ============ CSV import : パターン定義 ============
   新しいCSV形式に対応する場合は、この配列に定義を追加するだけでよい。
   colMap の index は parseCSVText が返す行配列（0始まり）に対応する。
============================================================ */
const IMPORT_PATTERNS = [
  {
    id:'standard',
    name:'標準フォーマット',
    header:'question,choice1,choice2,choice3,choice4,choice5,choice6,correct,explanation,category',
    note:'choice5・6は空欄可（最大6択）。correct列は "A" または "A;C" のように記号で指定。末尾のcategory列は任意（省略時は「未分類」）。',
    detect: header => header[0]==='question' || (header.includes('correct') && header.includes('question')),
    colMap:{ question:0, choices:[1,2,3,4,5,6], correct:7, explanation:8, category:9 }
  },
  {
    id:'mondai_jp',
    name:'問題形式（問/a-e/解答/解説）',
    header:'問,a,b,c,d,e,解答,解説,カテゴリ',
    note:'解答列は "A. 選択肢の文章" のように1行ずつ、または記号のみでも可。末尾のカテゴリ列は任意（省略時は「未分類」）。',
    detect: header => header[0]==='問' || header.includes('解答') || header.includes('解説'),
    colMap:{ question:0, choices:[1,2,3,4,5], correct:6, explanation:7, category:8 }
  }
];
let currentPatternId = 'auto';

function detectPattern(header){
  const h = header.map(x=>(x||'').trim());
  for(const p of IMPORT_PATTERNS){
    try{ if(p.detect(h)) return p.id; }catch(e){}
  }
  return null;
}

function stripBOM(text){
  return text.charCodeAt(0)===0xFEFF ? text.slice(1) : text;
}

function parseCSVText(text){
  // simple RFC4180-ish parser supporting quoted fields with commas/escaped quotes/改行
  text = stripBOM(text);
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field+='"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if(field.length>0 || row.length>0){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}

/* 解答欄から正解の記号(A,B,C...)を抽出する。
   「A. 文章」を1行ずつ記載した形式と、「A」「A;C」「A,C」のような記号のみの形式の両方に対応 */
function extractAnswerLetters(text){
  text = text || '';
  let letters = [];
  text.split(/\r?\n/).forEach(line=>{
    const m = line.match(/^\s*([A-Za-z])\s*[.\uFF0E]/);
    if(m) letters.push(m[1].toUpperCase());
  });
  if(letters.length>0) return [...new Set(letters)];
  text.split(/[;,、]/).map(s=>s.trim()).filter(Boolean).forEach(t=>{
    const m = t.match(/^([A-Za-z])/);
    if(m) letters.push(m[1].toUpperCase());
  });
  return [...new Set(letters)];
}

function parseRowWithPattern(r, colMap){
  const question = (r[colMap.question]||'').trim();
  const letters = 'ABCDEFGHIJ';
  const choices = [];
  const letterIndex = {};
  colMap.choices.forEach((colIdx,i)=>{
    const v = (r[colIdx]||'').trim();
    if(v!==''){ letterIndex[letters[i]] = choices.length; choices.push(v); }
  });
  const correctRaw = (r[colMap.correct]||'').trim();
  const explanation = (r[colMap.explanation]||'').trim();
  const category = (colMap.category!==undefined ? (r[colMap.category]||'').trim() : '') || DEFAULT_CATEGORY;

  if(!question) throw new Error('問題文が空です');
  if(choices.length<2) throw new Error('選択肢が2つ未満です');
  if(!correctRaw) throw new Error('正解列が空です');

  const answerLetters = extractAnswerLetters(correctRaw);
  const correct = answerLetters.map(l=>letterIndex[l]).filter(v=>v!==undefined);
  if(correct.length===0) throw new Error('正解列を解釈できません: '+truncate(correctRaw,30));

  return { question, choices, correct:[...new Set(correct)].sort(), explanation, category };
}

async function importCSV(text, patternIdOverride){
  if(!currentSetId){ toast('クイズセットを開いてからインポートしてください'); return; }
  const rows = parseCSVText(text);
  if(rows.length<2){ toast('CSVにデータ行がありません'); return; }
  const header = rows[0];
  const dataRows = rows.slice(1);

  const requested = patternIdOverride !== undefined ? patternIdOverride : currentPatternId;
  let patternId = requested === 'auto' ? detectPattern(header) : requested;
  if(!patternId){
    const box = document.getElementById('importResult');
    if(box) box.innerHTML = `<div class="explain-box" style="margin-top:14px;color:var(--danger)">
      フォーマットを自動判定できませんでした。上のプルダウンで形式を選択してから再度インポートしてください。
    </div>`;
    toast('フォーマットを判定できませんでした');
    return;
  }
  const pattern = IMPORT_PATTERNS.find(p=>p.id===patternId);

  let added=0, errors=[];
  dataRows.forEach((r,ri)=>{
    try{
      const q = parseRowWithPattern(r, pattern.colMap);
      questions.push({ id: uid(), setId: currentSetId, ...q });
      added++;
    }catch(e){
      errors.push(`行${ri+2}: ${e.message}`);
    }
  });

  await sSet('sf_questions', questions);
  if(added>0) toast(`${added}件の問題を追加しました（${pattern.name}）`);
  manageTab='import';
  render();
  const box = document.getElementById('importResult');
  if(box){
    box.innerHTML = `<div class="explain-box" style="margin-top:14px;">
      判定フォーマット：<b>${pattern.name}</b><br>
      <b>${added}件</b> 追加しました。${errors.length? `<br><b style="color:var(--danger)">${errors.length}件エラー：</b><br>`+errors.map(escapeHtml).join('<br>') : ''}
    </div>`;
  }
}

async function deleteQuestion(id){
  questions = questions.filter(q=>q.id!==id);
  await sSet('sf_questions', questions);
  toast('問題を削除しました');
  render();
}

async function loadSample(){
  await importCSV(SAMPLE_CSV, 'standard');
  toast('サンプル問題を読み込みました');
}

/* ============ utils ============ */
function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function truncate(s,n){ return s.length>n ? s.slice(0,n)+'…' : s; }

/* ============ event binding ============ */
function bindEvents(){
  document.querySelectorAll('[data-act]').forEach(el=>{
    el.addEventListener('click', async (e)=>{
      const act = el.getAttribute('data-act');
      if(act==='sets-home'){ goto('sets'); }
      else if(act==='set-home'){ goto('setHome'); }
      else if(act==='open-set') openSet(el.getAttribute('data-id'));
      else if(act==='create-set') createSet();
      else if(act==='delete-set') deleteSet(el.getAttribute('data-id'));
      else if(act==='start-all') startAll();
      else if(act==='start-random') startRandom(20);
      else if(act==='start-category') startCategory(decodeURIComponent(el.getAttribute('data-cat')));
      else if(act==='start-missed') startMissed();
      else if(act==='goto-manage'){ manageTab='list'; goto('manage'); }
      else if(act==='resume-draft') resumeDraft();
      else if(act==='discard-draft') discardDraft();
      else if(act==='view-wrong') goto('wrongList', parseInt(el.getAttribute('data-i')));
      else if(act==='retry-wrong') startRetry(parseInt(el.getAttribute('data-i')));
      else if(act==='retry-just-finished') retryJustFinished();
      else if(act==='load-sample') loadSample();
      else if(act==='pick') pickChoice(parseInt(el.getAttribute('data-i')));
      else if(act==='check-answer') checkAnswer();
      else if(act==='prev') navQuiz(-1);
      else if(act==='next') navQuiz(1);
      else if(act==='finish') finishQuiz();
      else if(act==='save-draft') saveDraftNow();
      else if(act==='tab'){ manageTab = el.getAttribute('data-tab'); render(); }
      else if(act==='delete-q'){
        if(confirm('この問題を削除しますか？')) deleteQuestion(el.getAttribute('data-id'));
      }
      else if(act==='import-paste'){
        const txt = document.getElementById('csvPaste').value;
        if(!txt.trim()){ toast('CSVを貼り付けてください'); return; }
        importCSV(txt);
      }
    });
  });

  const nameInput = document.getElementById('newSetName');
  if(nameInput){
    nameInput.addEventListener('keydown', e=>{ if(e.key==='Enter') createSet(); });
  }

  const ps = document.getElementById('patternSelect');
  if(ps){
    ps.addEventListener('change', e=>{ currentPatternId = e.target.value; });
  }

  const dz = document.getElementById('dropzone');
  const fi = document.getElementById('fileInput');
  if(dz && fi){
    dz.addEventListener('click', ()=>fi.click());
    dz.addEventListener('dragover', e=>{ e.preventDefault(); dz.style.borderColor='var(--blue)'; });
    dz.addEventListener('dragleave', ()=>{ dz.style.borderColor='var(--border)'; });
    dz.addEventListener('drop', e=>{
      e.preventDefault(); dz.style.borderColor='var(--border)';
      const file = e.dataTransfer.files[0];
      if(file) readFileAndImport(file);
    });
    fi.addEventListener('change', e=>{
      const file = e.target.files[0];
      if(file) readFileAndImport(file);
    });
  }
}

function readFileAndImport(file){
  const reader = new FileReader();
  reader.onload = ()=> importCSV(reader.result);
  reader.readAsText(file, 'UTF-8');
}

init();
