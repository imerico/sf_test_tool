name: issue-link

# PR 本文を書き直したとき（edited）にも再チェックする。
# 他のチェックをここに入れないこと（edited でスキップされると「成功」扱いになるため）。
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  issues: read
  pull-requests: read

jobs:
  # PR 本文に、実在する Issue への参照（Closes #12 など）があるか
  issue-link:
    runs-on: ubuntu-latest
    steps:
      - name: PR 本文の Issue 参照を確認
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          nums=$(printf '%s' "$PR_BODY" \
            | grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?|refs?)[[:space:]]*:?[[:space:]]*#[0-9]+' \
            | grep -oE '[0-9]+$' | sort -u || true)
          if [ -z "$nums" ]; then
            echo "::error::PR 本文に関連 Issue がありません。「Closes #番号」のように書いてください。"
            exit 1
          fi
          ok=0
          for n in $nums; do
            kind=$(gh api "repos/$REPO/issues/$n" --jq 'if .pull_request then "pr" else "issue" end' 2>/dev/null || echo none)
            if [ "$kind" = issue ]; then
              echo "✔ #$n は Issue です"; ok=1
            else
              echo "::warning::#$n は存在しないか、Issue ではなく PR です"
            fi
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::PR 本文に、実在する Issue への参照がありません。"
            exit 1
          fi
